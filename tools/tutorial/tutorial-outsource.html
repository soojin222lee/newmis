<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AiBudget 업무 튜토리얼 · 외주비 계획</title>
<meta name="description" content="POP 견적 연계·직접 입력·중복 방지·PO 매핑·월별 실투입 전표까지 — 실투입외주비 인터랙티브 튜토리얼.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --sk-ink:#17161f; --sk-page:#f2f2ee; --sk-border:#e7eaef; --sk-border-strong:#d3d9e2; --sk-head:#eef2f7;
  --esv:#2f6bed; --esv-deep:#1746a0; --esv-soft:#eaf1fd;
  --pop:#ea002c; --pop-deep:#b80022; --pop-soft:#fdecec;  /* 구매시스템(POP/ERP) = 빨강 */
  --green:#22b07d; --amber:#b4740a; --red:#ea002c;
  --font:'Pretendard','Noto Sans KR',-apple-system,system-ui,sans-serif; --mono:ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;letter-spacing:-.1px}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--sk-page);color:#1c2432;-webkit-font-smoothing:antialiased;overflow:hidden}

/* 시스템 바 */
#sysbar{position:fixed;top:50px;left:0;right:0;height:44px;z-index:50;display:flex;align-items:center;gap:12px;padding:0 20px;
  background:#fff;border-bottom:1px solid var(--sk-border);transition:background .3s,border-color .3s}
#sysbar .sys{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:900}
#sysbar .sys .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:14px}
#sysbar.esv{background:#fff} #sysbar.esv .sys{color:var(--esv-deep)} #sysbar.esv .sys .ic{background:var(--esv)}
#sysbar.pop{background:var(--pop-soft)} #sysbar.pop .sys{color:var(--pop-deep)} #sysbar.pop .sys .ic{background:var(--pop)}
#sysbar .tag{font-size:11px;font-weight:800;color:#8a94a6}
#sysbar .flow{margin-left:auto;font-size:11.5px;font-weight:800;color:#aab2c0}

/* 본문 */
#sim{position:fixed;top:94px;left:0;right:0;bottom:0;overflow:auto;padding:22px 26px 80px;transition:opacity .18s ease}
.wrap{max-width:1000px;margin:0 auto}
.scr-title{font-size:22px;font-weight:900;color:#16151f;margin:0 0 3px}
.scr-sub{font-size:13px;color:#8a94a6;font-weight:600;margin:0 0 18px}
.card{background:#fff;border:1px solid #e4e2da;border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card.pop{border-color:#f3c7c5;background:#fffafa}
.sec{font-size:12px;font-weight:900;color:#55606f;margin:0 0 10px;letter-spacing:.2px}

.btn{height:38px;padding:0 16px;border-radius:10px;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--sk-border-strong);background:#fff;color:#2b3442}
.btn:hover{background:#f3f6fb}
.btn.esv{background:var(--esv);border-color:var(--esv);color:#fff} .btn.esv:hover{background:var(--esv-deep)}
.btn.ink{background:var(--sk-ink);border-color:var(--sk-ink);color:#fff}
.btn.pop{background:var(--pop);border-color:var(--pop);color:#fff} .btn.pop:hover{background:var(--pop-deep)}
.btn.sm{height:30px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.choice2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ch-card{text-align:left;border:1.5px solid #e4e2da;border-radius:14px;padding:18px;cursor:pointer;background:#fff;transition:border-color .15s,transform .15s,background .15s}
.ch-card:hover{border-color:var(--esv);transform:translateY(-2px);background:var(--esv-soft)}
.ch-card .ic{font-size:24px}
.ch-card .t{font-size:15px;font-weight:900;color:#16151f;margin:8px 0 4px}
.ch-card .d{font-size:12px;color:#6b7480;line-height:1.5}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t thead th{background:var(--sk-head);color:#3d4a5c;font-weight:800;text-align:left;padding:10px 12px;border-bottom:1px solid var(--sk-border-strong);white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid #eef1f5;color:#2b3442;white-space:nowrap}
table.t tbody tr:last-child td{border-bottom:0}
table.t tbody tr:hover td{background:var(--esv-soft)}
table.t.pop thead th{background:var(--pop-soft);color:var(--pop-deep)} table.t.pop tbody tr:hover td{background:var(--pop-soft)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px;color:#55606f}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800}
.b-ok{background:#eef7f1;color:#166534} .b-used{background:#fdecec;color:#b42318} .b-wait{background:#fff7ed;color:#b4740a}
.b-link{background:var(--esv-soft);color:var(--esv-deep)} .b-none{background:#f1f0ea;color:#8a94a6}
.tbd{display:inline-block;font-size:11px;font-weight:800;color:#b4740a;background:#fff7ed;border:1px solid #fed7aa;border-radius:6px;padding:1px 7px}

/* 금액 구성 bar */
.amt-bar{height:30px;border-radius:9px;overflow:hidden;display:flex;border:1px solid #e4e2da;background:#f3f2ec}
.amt-bar .used{background:var(--esv);height:100%;transition:width .6s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;white-space:nowrap}
.amt-bar .rem{background:#cbd7ec;height:100%;transition:width .6s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;justify-content:center;color:#1746a0;font-size:11px;font-weight:800;white-space:nowrap}
.amt-legend{display:flex;gap:16px;margin-top:9px;font-size:12px;font-weight:700;color:#55606f;flex-wrap:wrap}
.amt-legend b{color:#16151f} .amt-legend .d{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}

.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kv .k{font-size:11px;font-weight:800;color:#98a2b3}
.kv .v{font-size:15px;font-weight:900;color:#16151f;margin-top:3px;font-variant-numeric:tabular-nums}
.inp{height:34px;border:1px solid var(--sk-border-strong);border-radius:8px;padding:0 10px;font-size:13px;font-family:inherit;color:#2b3442;background:#fff}

.flash{animation:flash 1s ease}@keyframes flash{0%{background:#fff7cc}100%{background:transparent}}
.po-fill{animation:poFill .8s ease}@keyframes poFill{0%{background:#d1fadf;transform:scale(1.04)}100%{background:transparent;transform:none}}

.banner{border-radius:12px;padding:13px 16px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:9px;margin-bottom:14px}
.banner.ok{background:#eef7f1;border:1px solid #bbe7cc;color:#166534}
.banner.pop{background:var(--pop-soft);border:1px solid #f3c7c5;color:var(--pop-deep)}
.banner.warn{background:#fdecec;border:1px solid #f5c2c0;color:#b42318}

/* 시스템 전환 토스트 */
#switch{position:fixed;inset:0;z-index:9500;display:none;align-items:center;justify-content:center;pointer-events:none}
#switch .pill{background:#17161f;color:#fff;font-size:15px;font-weight:900;padding:14px 24px;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:swin .5s cubic-bezier(.2,.9,.3,1.2)}
#switch .pill em{font-style:normal}
@keyframes swin{from{opacity:0;transform:translateY(12px) scale(.95)}to{opacity:1;transform:none}}

/* ===== 튜토리얼 오버레이 (공용 스타일) ===== */
#hud{position:fixed;top:0;left:0;right:0;z-index:9000;height:50px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--sk-border);display:flex;align-items:center;gap:13px;padding:0 16px}
#hud .ch{font-size:13px;font-weight:900;color:#16151f;white-space:nowrap}#hud .ch em{font-style:normal;color:var(--esv)}
#hud .sc{font-size:11.5px;font-weight:800;color:#8a94a6;white-space:nowrap}
#hud .bar{flex:1;max-width:300px;height:7px;background:#e9ecf1;border-radius:999px;overflow:hidden}
#hud .fill{height:100%;width:0;background:var(--esv);border-radius:999px;transition:width .4s}
#hud .cnt{font-size:12px;font-weight:800;color:#6b7480;white-space:nowrap}
#hud .sp{flex:1}
#hud button{height:31px;padding:0 12px;border-radius:8px;border:1px solid var(--sk-border-strong);background:#fff;color:#37414f;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit}
#hud button:hover{background:#f3f6fb}
#mask{position:fixed;inset:0;z-index:9001;background:rgba(10,14,26,.34);display:none}
#hole{position:fixed;z-index:9002;border-radius:10px;border:2.5px solid var(--esv);background:transparent;cursor:pointer;display:none;
  box-shadow:0 0 0 4px rgba(47,107,237,.30),0 0 0 9999px rgba(10,14,26,.34);animation:pulse 1.6s ease-in-out infinite}
#hole.pop{border-color:var(--pop);box-shadow:0 0 0 4px rgba(124,58,237,.30),0 0 0 9999px rgba(10,14,26,.34)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(47,107,237,.30),0 0 0 9999px rgba(10,14,26,.34)}50%{box-shadow:0 0 0 9px rgba(47,107,237,.15),0 0 0 9999px rgba(10,14,26,.34)}}
#hole .fg{position:absolute;right:-14px;bottom:-14px;font-size:24px;pointer-events:none;animation:fg 1.3s ease-in-out infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
@keyframes fg{0%,100%{transform:translate(0,0)}50%{transform:translate(-5px,-5px)}}
#hole.shake{animation:shake .4s}@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
#bubble{position:fixed;z-index:9003;max-width:340px;background:#fff;border-radius:14px;padding:16px 18px 14px;border:1px solid #e4e2da;
  box-shadow:0 18px 50px rgba(10,14,26,.28);display:none;cursor:grab;animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
#bubble:active{cursor:grabbing}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(6px)}to{opacity:1;transform:none}}
#bubble .grip{position:absolute;top:8px;right:10px;font-size:13px;color:#c3cbd6;pointer-events:none}
#bubble .st{font-size:11px;font-weight:900;color:var(--esv);letter-spacing:.5px}
#bubble.pop .st{color:var(--pop)}
#bubble .tt{font-size:16px;font-weight:900;color:#16151f;margin:5px 0 7px;padding-right:20px}
#bubble .tx{font-size:13.5px;line-height:1.62;color:#3a4250}#bubble .tx b{color:#17161f}
#bubble .tx .lock{color:#b42318}
#bubble .hint{margin-top:10px;font-size:11.5px;font-weight:800;color:var(--esv);display:flex;gap:10px;flex-wrap:wrap}
#bubble.pop .hint{color:var(--pop)}#bubble .hint em{font-style:normal;color:#9aa4b2}
#bubble .ar{position:absolute;width:14px;height:14px;background:#fff;border:1px solid #e4e2da;transform:rotate(45deg)}
#center{position:fixed;inset:0;z-index:9003;display:none;align-items:center;justify-content:center;padding:24px}
#center .card2{background:#fff;border-radius:20px;max-width:620px;width:100%;padding:30px 32px;box-shadow:0 24px 70px rgba(10,14,26,.35);animation:pop .3s cubic-bezier(.2,.9,.3,1.2);margin:0;border:0}
#center .eb{font-size:12px;font-weight:900;letter-spacing:1px;color:var(--esv);text-transform:uppercase}
#center h2{font-size:23px;font-weight:900;color:#16151f;margin:8px 0 10px}
#center p{font-size:14px;line-height:1.7;color:#3a4250;margin:0}
#center .chk{width:58px;height:58px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin:0 auto 12px;color:#fff;font-size:28px}
#center .acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;justify-content:center}
#center .acts button{height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--sk-border-strong);background:#fff;color:#2b3442;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit}
#center .acts button.pri{background:var(--sk-ink);border-color:var(--sk-ink);color:#fff}
.sclist{display:grid;gap:10px;margin-top:18px;text-align:left}
.sc-item{display:flex;align-items:center;gap:13px;padding:13px 15px;border:1.5px solid #e4e2da;border-radius:13px;cursor:pointer;background:#fff;transition:border-color .15s,background .15s}
.sc-item:hover{border-color:var(--esv);background:var(--esv-soft)}
.sc-no{width:30px;height:30px;flex:none;border-radius:9px;background:var(--sk-ink);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:900}
.sc-tt{font-size:14px;font-weight:800;color:#16151f}.sc-ds{font-size:12px;color:#8a94a6;font-weight:700;margin-top:1px}
.sc-done{margin-left:auto;font-size:16px;color:var(--green)}
#toast{position:fixed;z-index:9004;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:#17161f;color:#fff;font-size:13px;font-weight:700;padding:11px 18px;border-radius:11px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 시스템 범례 (상시 표시, 현재 시스템 강조) */
#sysbar .leg{display:flex;gap:8px;align-items:center;margin-left:12px}
#sysbar .lg{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;opacity:.45;transition:opacity .2s}
#sysbar .lg i{width:9px;height:9px;border-radius:3px;display:inline-block}
#sysbar .lg.pop{color:var(--pop-deep);background:var(--pop-soft)} #sysbar .lg.pop i{background:var(--pop)}
#sysbar .lg.esv{color:var(--esv-deep);background:var(--esv-soft)} #sysbar .lg.esv i{background:var(--esv)}
#sysbar.pop .lg.pop{opacity:1;box-shadow:0 0 0 1.5px var(--pop)} #sysbar.esv .lg.esv{opacity:1;box-shadow:0 0 0 1.5px var(--esv)}
/* 시점 타임라인 (시나리오 선택 상단) */
.tl-title{font-size:13.5px;font-weight:900;color:#16151f;margin:16px 0 8px}
.tl-title em{font-style:normal;color:var(--red);font-size:11.5px;font-weight:800;margin-left:6px}
.tl{display:flex;align-items:stretch;gap:4px;overflow-x:auto;padding-bottom:4px}
.tl-n{flex:1;min-width:96px;border-radius:11px;padding:10px 8px;text-align:center;border:1px solid #e4e2da}
.tl-n b{display:block;font-size:12px;font-weight:800;line-height:1.3}
.tl-n span{font-size:10px;font-weight:800}
.tl-n.pop{background:var(--pop-soft);border-color:#f3c7c5} .tl-n.pop b{color:#16151f} .tl-n.pop span{color:var(--pop-deep)}
.tl-n.esv{background:var(--esv-soft);border-color:#bcd3f7} .tl-n.esv b{color:#16151f} .tl-n.esv span{color:var(--esv-deep)}
.tl-n.big{outline:2px solid var(--esv);outline-offset:-1px}
.tl-ar{align-self:center;color:#c3cbd6;font-weight:900;font-size:15px;flex:0 0 auto}
.tl-eq{align-self:center;text-align:center;color:var(--esv-deep);font-weight:900;font-size:17px;flex:0 0 auto;padding:0 2px}
.tl-eq i{display:block;font-style:normal;font-size:9.5px;font-weight:800;color:#8a94a6;line-height:1.25;margin-top:1px}
.tl-note{font-size:12.5px;line-height:1.6;color:#55606f;background:#f7f9fc;border:1px solid #e4e2da;border-radius:10px;padding:10px 13px;margin-top:10px}
.tl-note b{color:#16151f}
/* Agent 콘솔 */
.ag-chips{display:flex;gap:8px;flex-wrap:wrap}
.ag-chip{border:1px solid var(--sk-border-strong);background:#fff;border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:800;color:#2b3442;cursor:pointer}
.ag-chip:hover{border-color:var(--esv);background:var(--esv-soft)}
.ag-input{display:flex;gap:8px;align-items:center;margin-top:12px}
.ag-prop{border-left:3px solid var(--esv)}
</style>
</head>
<body>

<div id="hud">
  <span class="ch">Chapter · <em>외주비</em> 계획(실투입)</span>
  <span class="sc" id="hud-sc"></span>
  <div class="bar"><div class="fill" id="hud-fill"></div></div>
  <span class="cnt" id="hud-cnt"></span>
  <span class="sp"></span>
  <button onclick="tPrev()">◀ 이전</button><button onclick="tRestart()">↻ 다시 시작</button><button onclick="openScenarios()">☰ 시나리오</button>
</div>
<div id="sysbar" class="esv"><div class="sys"><span class="ic">📊</span><span id="sys-name">실행예산 · New MIS</span></div><span class="tag" id="sys-tag">실행예산 시스템</span><span class="flow" id="sys-flow"></span><span class="leg"><span class="lg pop"><i></i>POP·구매/ERP</span><span class="lg esv"><i></i>예산관리</span></span></div>

<div id="sim"></div>

<div id="mask" onclick="tWrong()"></div>
<div id="hole"><span class="fg">👆</span></div>
<div id="bubble"><span class="ar"></span><span class="grip">⠿</span><div class="st"></div><div class="tt"></div><div class="tx"></div><div class="hint"><span>👆 강조된 영역을 클릭</span><em>✋ 말풍선 드래그 이동</em></div></div>
<div id="center"></div>
<div id="switch"><div class="pill"></div></div>
<div id="toast"></div>

<script>
"use strict";
/* =====================================================================
   외주비(실투입) 인터랙티브 튜토리얼 — 시뮬레이션
   POP 구매시스템 ↔ 실행예산(MIS) 두 시스템을 오가며 5개 시나리오 체험.
   ※ 실제 ERP/POP 미연결, 모두 가상 데이터 시뮬레이션.
   ===================================================================== */
const won = n => n.toLocaleString('ko-KR') + '원';
const eok = n => (n/100000000) + '억';

function initState() {
  return {
    plans: [{
      id:'P1', type:'실투입대상', method:'POP 견적', quote:'QT261000001',
      total:100000000, used:40000000, po:'', poState:'미연계',
      contract:{start:'2026-07-01', end:'2026-12-31'},
      months:[
        {m:'2026-07', plan:20000000, mm:1.0, used:20000000},
        {m:'2026-08', plan:20000000, mm:1.0, used:20000000},
        {m:'2026-09', plan:20000000, mm:1.0, used:0},
        {m:'2026-10', plan:20000000, mm:1.0, used:0},
        {m:'2026-11', plan:10000000, mm:0.5, used:0},
        {m:'2026-12', plan:10000000, mm:0.5, used:0},
      ],
      vouchers:[{m:'2026-07', amt:20000000, no:'880012301'},{m:'2026-08', amt:20000000, no:'880012302'}],
    }],
    quotes:[
      {no:'QT261000001', proj:'30131234-D001', author:'김구매(32011)', start:'2026-07-01', end:'2026-12-31', total:100000000, used:true,
       months:[{m:'2026-07',plan:20000000,mm:1.0},{m:'2026-08',plan:20000000,mm:1.0},{m:'2026-09',plan:20000000,mm:1.0},{m:'2026-10',plan:20000000,mm:1.0},{m:'2026-11',plan:10000000,mm:.5},{m:'2026-12',plan:10000000,mm:.5}]},
      {no:'QT261000002', proj:'30131234-D001', author:'이소싱(32044)', start:'2026-08-01', end:'2027-01-31', total:72000000, used:false,
       months:[{m:'2026-08',plan:12000000,mm:.6},{m:'2026-09',plan:12000000,mm:.6},{m:'2026-10',plan:12000000,mm:.6},{m:'2026-11',plan:12000000,mm:.6},{m:'2026-12',plan:12000000,mm:.6},{m:'2027-01',plan:12000000,mm:.6}]},
    ],
    sel:null, tryTotal:null,
  };
}
let S = initState();
const quote = no => S.quotes.find(q => q.no === no);
const plan = id => S.plans.find(p => p.id === id);

/* ---------- 시스템 바 ---------- */
function setSys(sys, flow, name) {
  const bar = document.getElementById('sysbar');
  bar.className = sys;

let curSc = null, step = 0, steps = [], curTgt = null, curPos = 'bottom', bubMoved = false;
const $ = id => document.getElementById(id);

function lockScroll(){ const e=document.scrollingElement||document.documentElement; e.style.overflow='hidden'; $('sim').style.overflow='hidden'; }
function unlockScroll(){ const e=document.scrollingElement||document.documentElement; e.style.overflow=''; $('sim').style.overflow='auto'; }

function runScenario(key){
  curSc=key; steps=SCEN[key].steps; step=0;
  $('center').style.display='none';
  $('hud-sc').textContent='시나리오 '+key+'. '+SCEN[key].name;
  renderStep();
}
function renderStep(){
  const s=steps[step];
  // 전환 잔상 방지 — 이전 스포트라이트/말풍선 즉시 숨기고 타깃 해제(place 에서 다시 표시)
  curTgt=null; $('hole').style.display='none'; $('bubble').style.display='none';
  if(s.sysToast){ switchToast(s.sysToast.replace('→','<em style="opacity:.6"> → </em>')); }
  if(s.render && !s.keep){ $('sim').style.opacity='0'; s.render(); }
  if(s.enter){ try{ s.enter(); }catch(err){ console.warn(err); } }  // 단계 진입 시 상태 준비(입력 프리셋 등)
  setTimeout(()=>place(s), s.sysToast?620:60);
  $('hud-cnt').textContent='단계 '+(step+1)+' / '+steps.length;
  $('hud-fill').style.width=Math.round(step/steps.length*100)+'%';
}
function place(s){
  $('sim').style.opacity='1';
  const tgt=document.querySelector(s.spot);
  const isPop=document.getElementById('sysbar').classList.contains('pop');
  $('center').style.display='none';
  if(!tgt){ // 재시도(렌더 지연)
    return setTimeout(()=>place(s), 120);
  }
  unlockScroll();
  try{ tgt.scrollIntoView({block:'center',inline:'nearest'}); }catch(e){}
  lockScroll();
  $('mask').style.display='block';
  curTgt=tgt; curPos=s.pos||'bottom'; bubMoved=false;
  const hole=$('hole'); hole.className=isPop?'pop':''; drawHole(tgt.getBoundingClientRect());
  hole.onclick=(e)=>{ e.stopPropagation(); if(s.act){ try{s.act();}catch(err){console.warn(err);} } if(s.mode==='done'){ finishScenario(s); } else { next(); } };
  const bub=$('bubble'); bub.className=isPop?'pop':'';
  bub.querySelector('.ar').style.display='block';
  bub.querySelector('.st').textContent='STEP '+(step+1)+' / '+steps.length;
  bub.querySelector('.tt').textContent=s.title;
  bub.querySelector('.tx').innerHTML=s.text;
  bub.style.display='block'; posBub(bub, tgt.getBoundingClientRect(), curPos);
}
function drawHole(r){ const h=$('hole'),p=7; h.style.display='block'; h.style.left=(r.left-p)+'px'; h.style.top=(r.top-p)+'px'; h.style.width=(r.width+p*2)+'px'; h.style.height=(r.height+p*2)+'px'; }
function posBub(b,r,pos){
  const bw=b.offsetWidth,bh=b.offsetHeight,g=18,vw=innerWidth,vh=innerHeight;let l,t;const a=b.querySelector('.ar');
  const cl=(v,mn,mx)=>Math.max(mn,Math.min(mx,v));
  if(pos==='right'){l=r.right+g;t=r.top+r.height/2-bh/2;}else if(pos==='left'){l=r.left-bw-g;t=r.top+r.height/2-bh/2;}
  else if(pos==='top'){l=r.left+r.width/2-bw/2;t=r.top-bh-g;}else{l=r.left+r.width/2-bw/2;t=r.bottom+g;}
  if(l<12)l=12;if(l+bw>vw-12)l=vw-bw-12;if(t<100)t=100;if(t+bh>vh-12)t=vh-bh-12;
  b.style.left=l+'px';b.style.top=t+'px';a.style.display='block';
  if(pos==='right'){a.style.left='-8px';a.style.top=cl(r.top+r.height/2-t-7,10,bh-20)+'px';a.style.borderRight='none';a.style.borderBottom='none';}
  else if(pos==='left'){a.style.left=(bw-6)+'px';a.style.top=cl(r.top+r.height/2-t-7,10,bh-20)+'px';a.style.borderLeft='none';a.style.borderTop='none';}
  else if(pos==='top'){a.style.top=(bh-6)+'px';a.style.left=cl(r.left+r.width/2-l-7,14,bw-24)+'px';a.style.borderLeft='none';a.style.borderTop='none';}
  else{a.style.top='-8px';a.style.left=cl(r.left+r.width/2-l-7,14,bw-24)+'px';a.style.borderRight='none';a.style.borderBottom='none';}
}
function next(){ if(step<steps.length-1){ step++; renderStep(); } else finishScenario(steps[steps.length-1]); }
function tPrev(){ if(step>0){ step--; // 상태 되돌리기는 생략(간단화) — 재시작 권장
  renderStep(); } else openScenarios(); }
function tRestart(){ S=initState(); if(curSc) runScenario(curSc); else openScenarios(); }

/* rAF 고정 */
function sync(){ if(curTgt && $('hole').style.display==='block'){ const r=curTgt.getBoundingClientRect(); if(r.width||r.height){ drawHole(r); if(!bubMoved) posBub($('bubble'),r,curPos); } } requestAnimationFrame(sync); }
requestAnimationFrame(sync);
function maskOn(){ return $('mask').style.display==='block' && $('hole').style.display==='block'; }
addEventListener('wheel', e=>{ if(maskOn()) e.preventDefault(); }, {passive:false,capture:true});
addEventListener('touchmove', e=>{ if(maskOn() && !document.body.classList.contains('drag')) e.preventDefault(); }, {passive:false,capture:true});

function finishScenario(s){
  done[curSc]=true;
  $('mask').style.display='none'; $('hole').style.display='none'; $('bubble').style.display='none'; curTgt=null; unlockScroll();
  $('hud-fill').style.width='100%'; $('hud-cnt').textContent='단계 '+steps.length+' / '+steps.length;
  const nextKey=SC_ORDER[SC_ORDER.indexOf(curSc)+1];
  const c=$('center'); c.style.display='flex';
  c.innerHTML='<div class="card2"><div style="text-align:center"><div class="chk">✓</div><div class="eb">외주비 · 시나리오 '+curSc+'</div><h2>'+(s.doneTitle||'완료')+'</h2></div>'
    +(s.doneHtml||'')
    +'<div class="acts">'
    +(nextKey?'<button class="pri" onclick="runScenario(\''+nextKey+'\')">다음 시나리오 '+nextKey+' →</button>':'')
    +'<button onclick="openScenarios()">☰ 시나리오 목록</button>'
    +'<button onclick="tRestart()">↻ 이 시나리오 다시</button></div></div>';
}

function tWrong(){ const h=$('hole'); if(h.style.display!=='block')return; h.classList.remove('shake'); void h.offsetWidth; h.classList.add('shake');
  const t=$('toast'); t.textContent='👆 강조된 영역을 클릭하세요'; t.classList.add('show'); clearTimeout(window.__t); window.__t=setTimeout(()=>t.classList.remove('show'),1500); }

/* 말풍선 드래그 */
(function(){ const b=$('bubble'); let d=null;
  const st=(x,y)=>{ d={x,y,l:parseFloat(b.style.left)||0,t:parseFloat(b.style.top)||0}; bubMoved=true; b.querySelector('.ar').style.display='none'; document.body.classList.add('drag'); };
  const mv=(x,y)=>{ if(!d)return; let nl=d.l+(x-d.x),nt=d.t+(y-d.y); nl=Math.max(6,Math.min(innerWidth-b.offsetWidth-6,nl)); nt=Math.max(100,Math.min(innerHeight-b.offsetHeight-6,nt)); b.style.left=nl+'px'; b.style.top=nt+'px'; };
  const en=()=>{ if(d){ d=null; document.body.classList.remove('drag'); } };
  b.addEventListener('mousedown',e=>{ st(e.clientX,e.clientY); e.preventDefault(); });
  addEventListener('mousemove',e=>mv(e.clientX,e.clientY)); addEventListener('mouseup',en);
  b.addEventListener('touchstart',e=>{ const t=e.touches[0]; st(t.clientX,t.clientY); },{passive:true});
  addEventListener('touchmove',e=>{ if(!d)return; const t=e.touches[0]; mv(t.clientX,t.clientY); e.preventDefault(); },{passive:false}); addEventListener('touchend',en);
})();

/* 시나리오 선택 */
function openScenarios(){
  $('mask').style.display='none'; $('hole').style.display='none'; $('bubble').style.display='none'; curTgt=null; unlockScroll(); curSc=null;
  $('hud-sc').textContent=''; $('hud-cnt').textContent=''; $('hud-fill').style.width='0';
  setSys('esv',''); sim().innerHTML='';
  const items=SC_ORDER.map(k=>{ const sc=SCEN[k]; return '<button class="sc-item" onclick="runScenario(\''+k+'\')"><span class="sc-no">'+k+'</span><span><span class="sc-tt">'+sc.name+'</span><span class="sc-ds">'+sc.desc+'</span></span>'+(done[k]?'<span class="sc-done">✓</span>':'')+'</button>'; }).join('');
  const c=$('center'); c.style.display='flex';
  const timeline='<div class="tl-title">외주비 — 시점 한눈에 보기 <em>(순서보다 ‘항목 일치’가 핵심)</em></div>'
    +'<div class="tl">'
    +'<div class="tl-n pop"><b>① 견적 작성</b><span>POP · 또는 구두합의 입력</span></div>'
    +'<div class="tl-eq">⇄<i>동일 항목<br>순서 무관</i></div>'
    +'<div class="tl-n esv big"><b>② 실행예산 수립</b><span>견적과 동일 데이터</span></div><div class="tl-ar">→</div>'
    +'<div class="tl-n pop"><b>③ 구매요청·PO</b><span>POP</span></div><div class="tl-ar">→</div>'
    +'<div class="tl-n pop"><b>④ 실투입 전표</b><span>구매/ERP · 계속 수신 ↻</span></div><div class="tl-ar">→</div>'
    +'<div class="tl-n esv"><b>실시간 잔여 관리</b><span>예산관리 · 상시</span></div>'
    +'</div>'
    +'<div class="tl-note">💡 <b>핵심은 순서가 아니라 ‘항목 일치’</b> — POP 견적과 실행예산의 <b>견적 항목이 똑같아야</b> 합니다. 실행예산 수립(②)은 견적 작성(①)과 <b>동시에</b> 하거나 <b>먼저</b> 할 수도 있어요(견적이 시스템에 없어도 업체와 <b>구두 합의</b>한 내용이면 <b>수기 수립</b> 가능 — 이후 POP 입력→연계). 잔여는 <b style="color:var(--pop-deep)">실투입 전표를 계속 받아</b> <b style="color:var(--esv-deep)">실시간</b>으로 계산됩니다(정해진 순서가 아님).</div>';
  c.innerHTML='<div class="card2" style="max-width:860px"><div class="eb">실행예산 · 외주비(실투입)</div><h2>외주비 계획 — 시나리오 선택</h2>'
    +'<p><b style="color:var(--pop-deep)">🔴 구매시스템(POP·ERP) = 빨강</b> · <b style="color:var(--esv-deep)">🔵 실행예산(예산관리) = 파랑</b>. 두 시스템을 오가지만, <b>예산관리의 프로세스·로직</b>에 집중하세요.</p>'
    +timeline
    +'<div class="sclist">'+items+'</div></div>';
}

openScenarios();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PM 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="/css/main.css?v=20260814-fontbump" />
<link rel="stylesheet" href="/css/initiation-extra.css?v=20260814-fontbump" />
<link rel="stylesheet" href="/css/initiation-extra2.css?v=20260814-fontbump" />
<link rel="stylesheet" href="/css/sk-theme.css?v=20260814-hidedev" />
<link rel="stylesheet" href="/css/insights.css?v=20260814-report4" />
</head>
<body>

<div class="shell">
  <!-- ── Top nav ── -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="tb-left">
        <div class="tb-brand nav-group-btn" id="nav-main-brand" onclick="showMain()">
          <span class="tb-brand-mark">SK</span>
          <span class="tb-brand-sub">주식회사<br>AX</span>
        </div>
        <nav class="topnav">
          <button class="nav-group-btn topnav-item" id="nav-main" onclick="showMain()">My Work</button>
          <div class="topnav-drop">
            <button class="nav-group-btn topnav-item" id="ngbtn-sub-ops">프로젝트 <span class="tb-caret">▾</span></button>
            <div class="topnav-menu" id="sub-ops">
              <button class="nav-sub-item" id="nav-si-project" onclick="showSIProject()">수주형 프로젝트</button>
              <button class="nav-sub-item" id="nav-wg-project" onclick="showWGProject()">W/G 프로젝트</button>
              <button class="nav-sub-item" id="nav-internal-project" onclick="showInternalProject()">사내 프로젝트</button>
              <button class="nav-sub-item" id="nav-investment-project" onclick="showInvestmentProject()">투자프로젝트</button>
              <button class="nav-sub-item" id="nav-advance-project" onclick="showAdvanceProject()">선투입 프로젝트</button>
              <button class="nav-sub-item" id="nav-project-close" onclick="showProjectClose()">프로젝트 종료</button>
            </div>
          </div>
          <button class="nav-group-btn topnav-item" id="nav-budget" onclick="showBudget()">실행예산</button>
          <div class="topnav-drop">
            <button class="nav-group-btn topnav-item" id="ngbtn-sub-insight" onclick="showInsights('overview')">인사이트 <span class="tb-caret">▾</span></button>
            <div class="topnav-menu" id="sub-insight">
              <button class="nav-sub-item" onclick="showInsights('overview')">종합 현황</button>
              <button class="nav-sub-item" id="nav-custom-report" onclick="showCustomReport()">맞춤 레포트</button>
            </div>
          </div>
        </nav>
      </div>
      <div class="tb-right">
        <div class="tb-user">
          <div class="tb-user-name">이봄 님</div>
          <div class="tb-user-role">프로젝트 매니저</div>
        </div>
        <button class="tb-apps" onclick="openPurchaseReference()" title="구매시스템 참고 화면" aria-label="구매시스템 참고 화면">▦</button>
      </div>
    </div>
  </header>

  <!-- ── Main ── -->
  <main class="main">
    <div class="content">
      <div class="screen active" id="s-main"></div>
      <div class="screen" id="s-hist"></div>
      <div class="screen" id="s-budget"></div>
      <div class="screen" id="s-project-close"></div>
      <div class="screen" id="s-custom-report"></div>
      <div class="screen" id="s-insights"></div>
      <div class="screen" id="s-initiation"></div>
      <div class="screen" id="s-interim"></div>
      <div class="screen" id="s-closure"></div>
      <div class="screen" id="s-monthly-close"></div>
      <div class="screen" id="s-system-desc"></div>
      <div class="screen" id="s-si-project"></div>
      <div class="screen" id="s-wg-project"></div>
      <div class="screen" id="s-internal-project"></div>
      <div class="screen" id="s-investment-project"></div>
      <div class="screen" id="s-advance-project"></div>
      <div class="screen" id="s-master-config"></div>
      <div class="screen" id="s-cp-briefing"></div>
      <div class="screen" id="s-cp-status"></div>
      <div class="screen" id="s-cp-history"></div>
      <div class="screen" id="s-phase-history"></div>
    </div>
  </main>
</div>

<!-- ════ MODAL: AI 리스크 조치 ════ -->
<div class="overlay" id="action-overlay" onclick="closeMoIfBg(event)">
  <div class="modal">
    <div class="modal-head">
      <div>
        <div class="modal-tag" id="mo-tag"></div>
        <div class="modal-title" id="mo-title"></div>
        <div class="modal-level" id="mo-level-badge"></div>
      </div>
      <button class="close-btn" onclick="closeMo()">닫기</button>
    </div>
    <div class="modal-section">
      <div class="sec-label">조치 사항</div>
      <div class="sec-body" id="mo-action"></div>
    </div>
    <div class="modal-section">
      <div class="sec-label">AI 가이드</div>
      <div class="sec-body" id="mo-guide"></div>
    </div>
    <div class="modal-section">
      <div class="sec-label">확인 체크리스트</div>
      <div class="chk-list">
        <div class="chk-item"><input type="checkbox" id="mc1"><label for="mc1">해당 리스크 내용을 확인했습니다.</label></div>
        <div class="chk-item"><input type="checkbox" id="mc2"><label for="mc2">AI가 제시한 가이드 내용을 확인했습니다.</label></div>
        <div class="chk-item"><input type="checkbox" id="mc3"><label for="mc3">미조치 또는 지연에 따른 영향과 책임을 인지했습니다.</label></div>
      </div>
    </div>
    <div class="modal-section">
      <div class="sec-label">확인 의견</div>
      <textarea class="memo-input" id="mo-memo" placeholder="조치 계획 또는 확인 의견을 입력하세요."></textarea>
    </div>
    <div class="modal-section">
      <div class="sec-label">PM 서명</div>
      <div class="sig-container">
        <div class="sig-header">
          <span class="sig-hint">마우스 또는 터치로 서명하세요</span>
          <button class="sig-clear-btn" onclick="clearSig()">지우기</button>
        </div>
        <canvas id="sig-canvas" width="560" height="100"></canvas>
      </div>
      <div class="sig-confirmer">
        <span>확인자: <strong id="mo-confirmer"></strong></span>
        <span id="sig-status" style="font-size:15px;color:#94a3b8">서명 전</span>
      </div>
    </div>
    <div class="modal-section">
      <div class="sec-label">조치 이력</div>
      <div id="mo-hist-body"></div>
    </div>
    <div class="modal-footer">
      <div class="saved-msg" id="mo-saved-msg">✓ 저장되었습니다</div>
      <button class="save-btn" onclick="saveAction()">확인 완료</button>
    </div>
  </div>
</div>

<!-- ════ MODAL: 단계보고 승인 ════ -->
<div class="overlay" id="phase-approve-overlay" onclick="if(event.target===this)closeApproveModal()">
  <div class="modal" style="max-width:480px">
    <div class="modal-head">
      <div>
        <div class="modal-tag">단계보고 승인</div>
        <div class="modal-title" id="apr-phase-name"></div>
      </div>
      <button class="close-btn" onclick="closeApproveModal()">닫기</button>
    </div>
    <div class="modal-section">
      <div style="font-size:16px;color:#475569;line-height:1.8;background:#f8fafc;border-radius:10px;padding:16px">
        위 보고서를 검토하였으며 내용이 정확함을 확인하고 최종 승인합니다.<br>
        승인 후에는 해당 단계가 공식 완료 처리됩니다.
      </div>
    </div>
    <div class="modal-section">
      <div class="sec-label">승인자</div>
      <div style="font-size:17px;font-weight:700;color:#1e293b;padding:8px 0">이봄 (프로젝트 매니저)</div>
    </div>
    <div class="modal-footer">
      <div></div>
      <div style="display:flex;gap:10px">
        <button class="reset-btn" onclick="closeApproveModal()">취소</button>
        <button class="save-btn" onclick="confirmApprove()">✅ 최종 승인</button>
      </div>
    </div>
    <input type="hidden" id="apr-idx" value="">
  </div>
</div>

<!-- ════ AI 대화 팝업 (Budget Navi / Q / Pilot) ════ -->
<div class="ai-chat-overlay" id="ai-chat-overlay" onclick="if(event.target===this)closeAiChat()">
  <div class="ai-chat-modal" role="dialog" aria-modal="true" aria-label="AI 대화">
    <div class="ai-chat-head">
      <span class="ai-chat-avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#2f6bed" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="8" width="16" height="12" rx="3.2"/><path d="M12 4.4V8"/>
          <circle cx="12" cy="3.2" r="1.3" fill="#2f6bed" stroke="none"/>
          <circle cx="9.2" cy="13.4" r="1.2" fill="#2f6bed" stroke="none"/>
          <circle cx="14.8" cy="13.4" r="1.2" fill="#2f6bed" stroke="none"/><path d="M2 13v3M22 13v3"/>
        </svg>
      </span>
      <div class="ai-chat-id">
        <strong id="ai-chat-title">Budget Q</strong>
        <span id="ai-chat-sub">무엇이든 물어보세요</span>
      </div>
      <button class="ai-chat-close" onclick="closeAiChat()" aria-label="닫기">✕</button>
    </div>
    <div class="ai-chat-body" id="ai-chat-body"></div>
    <div class="ai-chat-input">
      <input id="ai-chat-query" type="text" placeholder="메시지를 입력하세요" onkeydown="if(event.key==='Enter') sendAiChat()" />
      <button class="ai-chat-send" onclick="sendAiChat()" aria-label="보내기">↑</button>
    </div>
  </div>
</div>

<!-- ── 우측 하단 바로가기 ── -->
<div class="quick-shortcuts" aria-label="바로가기">
  <button class="qs-btn" onclick="openQuickShortcut('navi')" title="Budget Navi">
    <span class="qs-title">Budget<br>Navi</span>
    <span class="qs-label">NAVIGATION</span>
    <span class="qs-tip"><b>업무·메뉴 찾아가기</b>"실행예산 변경 어디서 해?"</span>
  </button>
  <button class="qs-btn" onclick="openQuickShortcut('q')" title="Budget Q">
    <span class="qs-title">Budget<br>Q</span>
    <span class="qs-label">QUESTION</span>
    <span class="qs-tip"><b>데이터에 질문하기</b>"왜 원가율이 올랐어?"</span>
  </button>
  <button class="qs-btn" onclick="openQuickShortcut('pilot')" title="Budget Pilot">
    <span class="qs-badge">4</span>
    <span class="qs-title">Budget<br>Pilot</span>
    <span class="qs-label">ASSIST</span>
    <span class="qs-tip"><b>AI 프로젝트 관리</b>"오늘 확인할 업무 알려줘."</span>
  </button>
</div>

<div id="toast"></div>

<script src="/js/app.js?v=20260814-agent"></script>
<script src="/js/dashboard.js?v=20260814-agent"></script>

<script src="/js/custom-report.js?v=20260814-fontbump"></script>
<script src="/js/insights.js?v=20260814-report4"></script>
<script src="/js/initiation-report.js?v=20260814-fontbump"></script>
<script src="/js/interim-report.js?v=20260814-fontbump"></script>
<script src="/js/closure-report.js?v=20260814-fontbump"></script>
<script src="/js/monthly-close.js?v=20260814-fontbump"></script>
<script src="/js/system-desc.js?v=20260814-fontbump"></script>
<script src="/js/si-project.js?v=20260814-fontbump"></script>
<script src="/js/wg-project.js?v=20260814-fontbump"></script>
<script src="/js/internal-project.js?v=20260814-fontbump"></script>
<script src="/js/investment-project.js?v=20260814-fontbump"></script>
<script src="/js/advance-project.js?v=20260814-fontbump"></script>
<script src="/js/master-config.js?v=20260814-fontbump"></script>
<script src="/js/checkpoint-extra.js?v=20260814-fontbump"></script>
<script src="/js/screen-guide-chatbot.js?v=20260814-dev"></script>
</body>
</html>

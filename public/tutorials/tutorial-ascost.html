<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AiBudget 업무 튜토리얼 · A/S Cost</title>
<meta name="description" content="A/S Cost — 본프로젝트 AS여부=Y면 A/S 프로젝트 자동 생성, 본프로젝트 예산에서 수립·승인, 본프로젝트 종료 후 A/S에서 사용. 인터랙티브 튜토리얼.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --sk-ink:#17161f; --sk-page:#f2f2ee; --sk-border:#e7eaef; --sk-border-strong:#d3d9e2; --sk-head:#eef2f7;
  --esv:#2f6bed; --esv-deep:#1746a0; --esv-soft:#eaf1fd;
  --main:#2f6bed; --main-deep:#1746a0; --main-soft:#eaf1fd;
  --as:#0f9b8e; --as-deep:#0a6f66; --as-soft:#e5f7f4;
  --green:#22b07d; --amber:#b4740a; --red:#ea002c;
  --font:'Pretendard','Noto Sans KR',-apple-system,system-ui,sans-serif; --mono:ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;letter-spacing:-.1px}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--sk-page);color:#1c2432;-webkit-font-smoothing:antialiased;overflow:hidden}

#sysbar{position:fixed;top:50px;left:0;right:0;height:44px;z-index:50;display:flex;align-items:center;gap:12px;padding:0 20px;background:#fff;border-bottom:1px solid var(--sk-border)}
#sysbar .sys{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:900;color:var(--as-deep)}
#sysbar .sys .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:14px;background:var(--as)}
#sysbar .tag{font-size:11px;font-weight:800;color:#8a94a6}
#sysbar .flow{margin-left:auto;font-size:11.5px;font-weight:800;color:#aab2c0}
#sysbar .leg{display:flex;gap:7px;align-items:center;margin-left:12px}
#sysbar .lg{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}
#sysbar .lg i{width:9px;height:9px;border-radius:3px;display:inline-block}
#sysbar .lg.main{color:var(--main-deep);background:var(--main-soft)} #sysbar .lg.main i{background:var(--main)}
#sysbar .lg.as{color:var(--as-deep);background:var(--as-soft)} #sysbar .lg.as i{background:var(--as)}

#sim{position:fixed;top:94px;left:0;right:0;bottom:0;overflow:auto;padding:22px 26px 80px;transition:opacity .18s ease}
.wrap{max-width:1000px;margin:0 auto}
.scr-title{font-size:22px;font-weight:900;color:#16151f;margin:0 0 3px}
.scr-sub{font-size:13px;color:#8a94a6;font-weight:600;margin:0 0 18px}
.card{background:#fff;border:1px solid #e4e2da;border-radius:12px;padding:16px 18px;margin-bottom:14px}
.sec{font-size:12px;font-weight:900;color:#55606f;margin:0 0 10px;letter-spacing:.2px}

.btn{height:38px;padding:0 16px;border-radius:10px;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--sk-border-strong);background:#fff;color:#2b3442}
.btn:hover{background:#f3f6fb}
.btn.as{background:var(--as);border-color:var(--as);color:#fff} .btn.as:hover{background:var(--as-deep)}
.btn.ink{background:var(--sk-ink);border-color:var(--sk-ink);color:#fff}
.btn.sm{height:30px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t thead th{background:var(--sk-head);color:#3d4a5c;font-weight:800;text-align:left;padding:10px 12px;border-bottom:1px solid var(--sk-border-strong);white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid #eef1f5;color:#2b3442;white-space:nowrap}
table.t tbody tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pname{font-weight:700;color:#16151f}
.mono{font-family:var(--mono);font-size:12px;color:#55606f}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800}
.b-ok{background:#eef7f1;color:#166534} .b-warn{background:#fdecec;color:#b80022} .b-na{background:#f1f0ea;color:#8a94a6} .b-wait{background:#eef2f7;color:#55606f}
.b-as{background:var(--as-soft);color:var(--as-deep)} .b-main{background:var(--main-soft);color:var(--main-deep)}
.tbd{display:inline-block;font-size:11px;font-weight:800;color:#b4740a;background:#fff7ed;border:1px solid #fed7aa;border-radius:6px;padding:1px 7px}
.dev{display:inline-block;font-size:11px;font-weight:800;color:#5b21b6;background:#f3edff;border:1px solid #d9c9f5;border-radius:6px;padding:1px 7px}
.auto{display:inline-block;font-size:11px;font-weight:800;color:var(--as-deep);background:var(--as-soft);border:1px solid #b6e6df;border-radius:6px;padding:1px 7px}

.banner{border-radius:12px;padding:13px 16px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:9px;margin-bottom:14px}
.banner.main{background:var(--main-soft);border:1px solid #bcd3f7;color:var(--main-deep)}
.banner.as{background:var(--as-soft);border:1px solid #b6e6df;color:var(--as-deep)}
.banner.warn{background:#fdecec;border:1px solid #f5c2c0;color:#b80022}
.banner.ok{background:#eef7f1;border:1px solid #bbe7cc;color:#166534}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.layer{border:1.5px solid #e4e2da;border-radius:14px;padding:16px}
.layer.main{border-color:#bcd3f7;background:var(--main-soft)} .layer.as{border-color:#b6e6df;background:var(--as-soft)}
.layer .t{font-size:15px;font-weight:900;color:#16151f}.layer .d{font-size:12.5px;line-height:1.6;color:#3a4250;margin-top:6px}

.cond{display:flex;align-items:center;gap:10px;padding:10px 13px;border:1px solid #e4e2da;border-radius:10px;margin-bottom:8px;font-size:13px;font-weight:700;color:#2b3442}
.cond .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;color:#fff;flex:none}
.cond.y .ic{background:var(--green)} .cond.n .ic{background:#c3cbd6}
.cond b{color:#16151f}
.flowd{display:flex;align-items:center;gap:0;overflow-x:auto;padding-bottom:4px;margin-top:6px}
.flowd .fn{flex:1;min-width:120px;text-align:center;border:1px solid #e4e2da;border-radius:11px;padding:10px 8px;background:#f7f9fc}
.flowd .fn b{display:block;font-size:12px;font-weight:800;color:#16151f}.flowd .fn span{font-size:10px;font-weight:800;color:var(--as-deep)}
.flowd .fn.mn{background:var(--main-soft);border-color:#bcd3f7}.flowd .fn.mn span{color:var(--main-deep)}
.flowd .fn.as{background:var(--as-soft);border-color:#b6e6df}
.flowd .fa{align-self:center;color:#c3cbd6;font-weight:900;font-size:15px;flex:0 0 auto;padding:0 4px}
.proc-note{font-size:12.5px;line-height:1.6;color:#55606f;background:#f7f9fc;border:1px solid #e4e2da;border-radius:10px;padding:10px 13px;margin-top:10px}.proc-note b{color:#16151f}
.subacct{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.subacct .sa{border:1px solid #e4e2da;border-radius:10px;padding:10px 11px;background:#fff}
.subacct .sa b{display:block;font-size:12.5px;font-weight:800;color:#16151f}
.subacct .sa span{font-size:11px;color:#8a94a6;font-weight:700}
.subacct .sa .n{font-size:13px;font-weight:900;color:var(--as-deep);margin-top:5px}

#hud{position:fixed;top:0;left:0;right:0;z-index:9000;height:50px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--sk-border);display:flex;align-items:center;gap:13px;padding:0 16px}
#hud .ch{font-size:13px;font-weight:900;color:#16151f;white-space:nowrap}#hud .ch em{font-style:normal;color:var(--as)}
#hud .sc{font-size:11.5px;font-weight:800;color:#8a94a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
#hud .bar{flex:1;max-width:260px;height:7px;background:#e9ecf1;border-radius:999px;overflow:hidden}
#hud .fill{height:100%;width:0;background:var(--as);border-radius:999px;transition:width .4s}
#hud .cnt{font-size:12px;font-weight:800;color:#6b7480;white-space:nowrap}#hud .sp{flex:1}
#hud button{height:31px;padding:0 12px;border-radius:8px;border:1px solid var(--sk-border-strong);background:#fff;color:#37414f;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit}
#hud button:hover{background:#f3f6fb}
#mask{position:fixed;inset:0;z-index:9001;background:rgba(10,14,26,.34);display:none}
#hole{position:fixed;z-index:9002;border-radius:10px;border:2.5px solid var(--as);background:transparent;cursor:pointer;display:none;box-shadow:0 0 0 4px rgba(15,155,142,.30),0 0 0 9999px rgba(10,14,26,.34);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(15,155,142,.30),0 0 0 9999px rgba(10,14,26,.34)}50%{box-shadow:0 0 0 9px rgba(15,155,142,.15),0 0 0 9999px rgba(10,14,26,.34)}}
#hole.shake{animation:shake .4s}@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
#hole .fg{position:absolute;right:-14px;bottom:-14px;font-size:24px;pointer-events:none;animation:fg 1.3s ease-in-out infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
@keyframes fg{0%,100%{transform:translate(0,0)}50%{transform:translate(-5px,-5px)}}
#bubble{position:fixed;z-index:9003;max-width:356px;background:#fff;border-radius:14px;padding:16px 18px 14px;border:1px solid #e4e2da;box-shadow:0 18px 50px rgba(10,14,26,.28);display:none;cursor:grab;animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
#bubble:active{cursor:grabbing}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(6px)}to{opacity:1;transform:none}}
#bubble .grip{position:absolute;top:8px;right:10px;font-size:13px;color:#c3cbd6;pointer-events:none}
#bubble .st{font-size:11px;font-weight:900;color:var(--as);letter-spacing:.5px}
#bubble .tt{font-size:16px;font-weight:900;color:#16151f;margin:5px 0 7px;padding-right:20px}
#bubble .tx{font-size:13.5px;line-height:1.62;color:#3a4250}#bubble .tx b{color:#17161f}
#bubble .tx .as{color:var(--as-deep)}#bubble .tx .main{color:var(--main-deep)}#bubble .tx .warn{color:#b80022}
#bubble .hint{margin-top:10px;font-size:11.5px;font-weight:800;color:var(--as);display:flex;gap:10px;flex-wrap:wrap}#bubble .hint em{font-style:normal;color:#9aa4b2}
#bubble .ar{position:absolute;width:14px;height:14px;background:#fff;border:1px solid #e4e2da;transform:rotate(45deg)}
#center{position:fixed;inset:0;z-index:9003;display:none;align-items:center;justify-content:center;padding:24px}
#center .card2{background:#fff;border-radius:20px;max-width:680px;width:100%;padding:30px 32px;box-shadow:0 24px 70px rgba(10,14,26,.35);animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
#center .eb{font-size:12px;font-weight:900;letter-spacing:1px;color:var(--as);text-transform:uppercase}
#center h2{font-size:23px;font-weight:900;color:#16151f;margin:8px 0 10px}
#center p{font-size:14px;line-height:1.7;color:#3a4250;margin:0}
#center .chk{width:58px;height:58px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin:0 auto 12px;color:#fff;font-size:28px}
#center .acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;justify-content:center}
#center .acts button{height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--sk-border-strong);background:#fff;color:#2b3442;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit}
#center .acts button.pri{background:var(--sk-ink);border-color:var(--sk-ink);color:#fff}
.sclist{display:grid;gap:10px;margin-top:18px;text-align:left}
.sc-item{display:flex;align-items:center;gap:13px;padding:13px 15px;border:1.5px solid #e4e2da;border-radius:13px;cursor:pointer;background:#fff;transition:border-color .15s,background .15s}
.sc-item:hover{border-color:var(--as);background:var(--as-soft)}
.sc-no{width:30px;height:30px;flex:none;border-radius:9px;background:var(--sk-ink);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:900}
.sc-tt{font-size:14px;font-weight:800;color:#16151f}.sc-ds{font-size:12px;color:#8a94a6;font-weight:700;margin-top:1px}
.sc-done{margin-left:auto;font-size:16px;color:var(--green)}
#toast{position:fixed;z-index:9004;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:#17161f;color:#fff;font-size:13px;font-weight:700;padding:11px 18px;border-radius:11px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="hud">
  <span class="ch">Chapter · <em>A/S Cost</em></span>
  <span class="sc" id="hud-sc"></span>
  <div class="bar"><div class="fill" id="hud-fill"></div></div>
  <span class="cnt" id="hud-cnt"></span>
  <span class="sp"></span>
  <button onclick="tPrev()">◀ 이전</button><button onclick="tRestart()">↻ 다시 시작</button><button onclick="openScenarios()">☰ 시나리오</button>
</div>
<div id="sysbar"><div class="sys"><span class="ic">🛠</span><span>A/S Cost · New MIS</span></div><span class="tag">본 사업 종료 후 하자보수 예산</span><span class="flow"></span><span class="leg"><span class="lg main"><i></i>본 프로젝트</span><span class="lg as"><i></i>A/S 프로젝트</span></span></div>

<div id="sim"></div>

<div id="mask" onclick="tWrong()"></div>
<div id="hole"><span class="fg">👆</span></div>
<div id="bubble"><span class="ar"></span><span class="grip">⠿</span><div class="st"></div><div class="tt"></div><div class="tx"></div><div class="hint"><span>👆 강조된 영역을 클릭</span><em>✋ 말풍선 드래그 이동</em></div></div>
<div id="center"></div>
<div id="toast"></div>

<script>
"use strict";
/* =====================================================================
   A/S Cost 인터랙티브 튜토리얼 — 시뮬레이션
   핵심: ① A/S = 본 사업 종료 후 하자보수 예산 / ② 본프로젝트 'AS여부=Y'면
         A/S 프로젝트가 자동 생성(사용자가 개설하지 않음) / ③ A/S비는
         본프로젝트 실행예산의 'A/S Cost' 계정(인건비·외주비·재료비·경비)에서 수립·승인 /
         ④ 본프로젝트가 종료되어야 그만큼 A/S 프로젝트에서 집행 가능.
   근거: budget-area-as.js(A/S Cost 계정 서브구조), 승인요청 관문 ④(본PJT 종료 확인).
   ※ 모두 가상 데이터 시뮬레이션.
   ===================================================================== */
const won = n => n.toLocaleString('ko-KR') + '원';
const sim = () => document.getElementById('sim');
function setFlow(t){ const e=document.querySelector('#sysbar .flow'); if(e) e.textContent = t || ''; }
function initState(){ return {}; }
let S = initState();

/* ---------- 화면 ---------- */
function scrConcept() {
  setFlow('A/S란 · 자동 생성 · 번호 규칙');
  sim().innerHTML = `<div class="wrap">
    <h1 class="scr-title">A/S Cost — 본 사업이 끝난 뒤의 예산</h1>
    <p class="scr-sub">A/S는 <b>본 프로젝트(본 사업)가 종료된 뒤</b>의 하자보수·유지보수(워런티) 비용입니다. 그래서 수립·집행 흐름이 일반 계정과 달라요.</p>
    <div class="banner as">🛠 A/S Cost는 <b>인건비·외주비·재료비·경비</b>를 다시 품는 <b>5번째 대계정</b>이에요 — A/S 프로젝트 안에서 쓸 작은 예산 한 벌.</div>
    <div class="card" id="asc-auto"><div class="sec">① A/S 프로젝트는 자동으로 생긴다</div>
      <div class="g2">
        <div class="layer main"><div class="t">🔵 본 프로젝트</div><div class="d"><b>AS여부 = Y</b>로 설정돼 있으면…</div>
          <div class="cond y" style="margin-top:10px"><span class="ic">✓</span><span><b>AS여부</b> <span class="badge b-main">Y</span></span></div>
        </div>
        <div class="layer as"><div class="t">🟢 A/S 프로젝트</div><div class="d">배치가 <b>A/S 프로젝트를 자동 생성</b>합니다. <b>사용자가 따로 개설 신청하지 않아요.</b> <span class="auto">자동</span></div></div>
      </div>
      <div class="proc-note" style="margin-top:12px"><b>AS여부=Y</b>인 본 프로젝트만 A/S 프로젝트가 붙습니다. N이면 A/S 자체가 없어요.</div>
    </div>
    <div class="card" id="asc-num"><div class="sec">② 번호는 본 프로젝트에서 파생된다</div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px">
        <span class="badge b-main">본 프로젝트</span><span class="mono">30131234-D001</span>
        <span style="color:#aab2c0;font-weight:900">→ 번호 규칙 →</span>
        <span class="badge b-as">A/S 프로젝트</span><span class="mono">AS-30131234-D001</span>
      </div>
      <div class="proc-note" style="margin-top:10px">A/S 번호로 <b>원래 본 프로젝트를 역으로 찾을 수</b> 있어요. 이 규칙이 뒤(라이프사이클·승인 관문)에서 계속 쓰입니다. <span class="dev">개발</span> 번호 체계가 바뀌면 이 연결이 조용히 깨집니다.</div>
    </div>
  </div>`;
}

function scrSetup() {
  setFlow('A/S비 수립 — 본PJT 예산의 A/S Cost 계정');
  sim().innerHTML = `<div class="wrap">
    <h1 class="scr-title">A/S비는 어디서 수립할까</h1>
    <p class="scr-sub">A/S 프로젝트 화면이 아니라, <b class="main">본 프로젝트 실행예산</b>의 <b>‘A/S Cost’ 계정</b>에서 미리 세웁니다. (수행원가 › 원가조정 › A/S Cost)</p>
    <div class="card" id="asc-where"><div class="sec">실행예산 5대 대계정</div>
      <div class="flowd">
        <div class="fn mn"><b>인건비</b><span>①</span></div><div class="fa">·</div>
        <div class="fn mn"><b>외주비</b><span>②</span></div><div class="fa">·</div>
        <div class="fn mn"><b>재료비</b><span>③</span></div><div class="fa">·</div>
        <div class="fn mn"><b>경비</b><span>④</span></div><div class="fa">·</div>

const SC_ORDER = ['A','B','C'];
const done = {};

/* =====================================================================

let curSc=null, step=0, steps=[], curTgt=null, curPos='bottom', bubMoved=false;
const $ = id => document.getElementById(id);
function lockScroll(){ const e=document.scrollingElement||document.documentElement; e.style.overflow='hidden'; $('sim').style.overflow='hidden'; }
function unlockScroll(){ const e=document.scrollingElement||document.documentElement; e.style.overflow=''; $('sim').style.overflow='auto'; }

function runScenario(key){ curSc=key; steps=SCEN[key].steps; step=0; $('center').style.display='none';
  $('hud-sc').textContent='시나리오 · '+SCEN[key].name; renderStep(); }
function renderStep(){
  const s=steps[step];
  curTgt=null; $('hole').style.display='none'; $('bubble').style.display='none';
  if(s.render && !s.keep){ $('sim').style.opacity='0'; s.render(); }
  if(s.enter){ try{ s.enter(); }catch(e){ console.warn(e); } }
  setTimeout(()=>place(s), 70);
  $('hud-cnt').textContent='단계 '+(step+1)+' / '+steps.length;
  $('hud-fill').style.width=Math.round(step/steps.length*100)+'%';
}
function place(s){
  $('sim').style.opacity='1';
  const tgt=document.querySelector(s.spot);
  $('center').style.display='none';
  if(!tgt){ return setTimeout(()=>place(s),120); }
  unlockScroll(); try{ tgt.scrollIntoView({block:'center',inline:'nearest'}); }catch(e){} lockScroll();
  $('mask').style.display='block';
  curTgt=tgt; curPos=s.pos||'bottom'; bubMoved=false;
  drawHole(tgt.getBoundingClientRect());
  $('hole').onclick=(e)=>{ e.stopPropagation(); if(s.act){ try{s.act();}catch(err){console.warn(err);} } if(s.mode==='done'){ finishScenario(s); } else { next(); } };
  const b=$('bubble'); b.querySelector('.ar').style.display='block';
  b.querySelector('.st').textContent='STEP '+(step+1)+' / '+steps.length;
  b.querySelector('.tt').textContent=s.title; b.querySelector('.tx').innerHTML=s.text;
  b.style.display='block'; posBub(b, tgt.getBoundingClientRect(), curPos);
}
function drawHole(r){ const h=$('hole'),p=7; h.style.display='block'; h.style.left=(r.left-p)+'px'; h.style.top=(r.top-p)+'px'; h.style.width=(r.width+p*2)+'px'; h.style.height=(r.height+p*2)+'px'; }
function posBub(b,r,pos){
  const bw=b.offsetWidth,bh=b.offsetHeight,g=18,vw=innerWidth,vh=innerHeight;let l,t;const a=b.querySelector('.ar');
  const cl=(v,mn,mx)=>Math.max(mn,Math.min(mx,v));
  if(pos==='right'){l=r.right+g;t=r.top+r.height/2-bh/2;}else if(pos==='left'){l=r.left-bw-g;t=r.top+r.height/2-bh/2;}
  else if(pos==='top'){l=r.left+r.width/2-bw/2;t=r.top-bh-g;}else{l=r.left+r.width/2-bw/2;t=r.bottom+g;}
  if(l<12)l=12;if(l+bw>vw-12)l=vw-bw-12;if(t<100)t=100;if(t+bh>vh-12)t=vh-bh-12;
  b.style.left=l+'px';b.style.top=t+'px';a.style.display='block';
  if(pos==='right'){a.style.left='-8px';a.style.top=cl(r.top+r.height/2-t-7,10,bh-20)+'px';a.style.borderRight='none';a.style.borderBottom='none';}
  else if(pos==='left'){a.style.left=(bw-6)+'px';a.style.top=cl(r.top+r.height/2-t-7,10,bh-20)+'px';a.style.borderLeft='none';a.style.borderTop='none';}
  else if(pos==='top'){a.style.top=(bh-6)+'px';a.style.left=cl(r.left+r.width/2-l-7,14,bw-24)+'px';a.style.borderLeft='none';a.style.borderTop='none';}
  else{a.style.top='-8px';a.style.left=cl(r.left+r.width/2-l-7,14,bw-24)+'px';a.style.borderRight='none';a.style.borderBottom='none';}
}
function next(){ if(step<steps.length-1){ step++; renderStep(); } else finishScenario(steps[steps.length-1]); }
function tPrev(){ if(step>0){ step--; renderStep(); } else openScenarios(); }
function tRestart(){ S=initState(); if(curSc) runScenario(curSc); else openScenarios(); }
function sync(){ if(curTgt && $('hole').style.display==='block'){ const r=curTgt.getBoundingClientRect(); if(r.width||r.height){ drawHole(r); if(!bubMoved) posBub($('bubble'),r,curPos); } } requestAnimationFrame(sync); }

function maskOn(){ return $('mask').style.display==='block' && $('hole').style.display==='block'; }

function tWrong(){ const h=$('hole'); if(h.style.display!=='block')return; h.classList.remove('shake'); void h.offsetWidth; h.classList.add('shake');
  const t=$('toast'); t.textContent='👆 강조된 영역을 클릭하세요'; t.classList.add('show'); clearTimeout(window.__t); window.__t=setTimeout(()=>t.classList.remove('show'),1500); }

/* 드래그 */
(function(){ const b=$('bubble'); let d=null;
  const st=(x,y)=>{ d={x,y,l:parseFloat(b.style.left)||0,t:parseFloat(b.style.top)||0}; bubMoved=true; b.querySelector('.ar').style.display='none'; document.body.classList.add('drag'); };
  const mv=(x,y)=>{ if(!d)return; let nl=d.l+(x-d.x),nt=d.t+(y-d.y); nl=Math.max(6,Math.min(innerWidth-b.offsetWidth-6,nl)); nt=Math.max(100,Math.min(innerHeight-b.offsetHeight-6,nt)); b.style.left=nl+'px'; b.style.top=nt+'px'; };
  const en=()=>{ if(d){ d=null; document.body.classList.remove('drag'); } };
  b.addEventListener('mousedown',e=>{ st(e.clientX,e.clientY); e.preventDefault(); });
  addEventListener('mousemove',e=>mv(e.clientX,e.clientY)); addEventListener('mouseup',en);
  b.addEventListener('touchstart',e=>{ const t=e.touches[0]; st(t.clientX,t.clientY); },{passive:true});
  addEventListener('touchmove',e=>{ if(!d)return; const t=e.touches[0]; mv(t.clientX,t.clientY); e.preventDefault(); },{passive:false}); addEventListener('touchend',en);
})();

  const items=SC_ORDER.map((k,i)=>{ const sc=SCEN[k]; return '<button class="sc-item" onclick="runScenario(\''+k+'\')"><span class="sc-no">'+(i+1)+'</span><span><span class="sc-tt">'+sc.name+'</span><span class="sc-ds">'+sc.desc+'</span></span>'+(done[k]?'<span class="sc-done">✓</span>':'')+'</button>'; }).join('');
  const flow='<div class="flowd">'
    +'<div class="fn mn"><b>① A/S비 수립</b><span>본PJT 예산</span></div><div class="fa">→</div>'
    +'<div class="fn mn"><b>② 실행예산 승인</b><span>본PJT 상신</span></div><div class="fa">→</div>'
    +'<div class="fn mn"><b>③ 본PJT 종료</b><span>기간+30일</span></div><div class="fa">→</div>'
    +'<div class="fn as"><b>④ A/S 집행</b><span>그만큼 사용</span></div>'
    +'</div>'
    +'<div class="proc-note">💡 A/S 프로젝트는 본 프로젝트 <b>AS여부=Y</b>면 <b>자동 생성</b>. A/S비는 <b>본 프로젝트 예산의 A/S Cost 계정</b>에서 수립·승인하고, <b>본 프로젝트가 종료되어야</b> 그만큼 A/S에서 집행합니다.</div>';
  const c=$('center'); c.style.display='flex';
  c.innerHTML='<div class="card2" style="max-width:900px"><div class="eb">A/S Cost</div><h2>A/S Cost — 시나리오 선택</h2>'
    +'<p>본 사업 종료 후의 하자보수 예산. <b style="color:var(--main-deep)">본 프로젝트에서 수립·승인</b> → <b style="color:var(--as-deep)">본 프로젝트 종료 후 A/S에서 집행</b>하는 흐름을 익혀봅니다.</p>'
    +flow
    +'<div class="sclist">'+items+'</div></div>';
}

openScenarios();
</script>

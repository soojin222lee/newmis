requirements:
  - { id: FR-HAG-01, text: "홈은 Agent와 나누는 업무 대화 화면이어야 하며, 처음 들어오면 Agent가 오늘 먼저 볼 일 3가지(해야 할 일 · 이상징후 · 결재 진행 건수 포함)를 브리핑해야 한다" }
  - { id: FR-HAG-02, text: "PM은 추천 질문 버튼을 누르거나 글로 입력해 질문할 수 있어야 하며, 질문을 보내면 브리핑은 한 줄로 접히고 다시 펼쳐 볼 수 있어야 한다" }
  - { id: FR-HAG-03, text: "Agent가 제안한 계정 간 조정안은 표(지금 예산 · 조정 · 조정 후 · 합계)와 이유로 보여 주고, [이대로 반영] · [금액 바꿔서 반영] · 원가조정 화면 이동을 할 수 있어야 하며, 반영한 내용은 원가조정 [예산 조정안]에 남아야 한다" }
  - { id: FR-HAG-04, text: "오른쪽 대화 기록에서 새 대화를 시작하고, 대화를 오늘 · 어제 · 지난주로 묶어 보고, 내용으로 검색하고, 골라서 다시 열 수 있어야 한다" }
  - { id: FR-HAG-05, text: "대화 기록 패널은 접었다 펼 수 있어야 하며, 접힌 상태를 기억해야 한다" }
  - { id: FR-HAG-06, text: "왼쪽 레일은 원래 모양(회색 머리글 + 흰 카드)을 유지하면서 즐겨찾기 · 담당 프로젝트를 차례로 보여야 한다" }
  - { id: FR-HAG-09, text: "담당 프로젝트가 많아도(예: 30개) 먼저 5개만 보이고 [나머지 N개 보기]로 전체와 이름 검색을 펼칠 수 있어야 하며, 펼치기 칸과 줄 높이는 작게 해 한눈에 더 많이 보여야 한다" }
  - { id: FR-HAG-07, text: "원가조정 등 다른 화면에서는 AI 창 머리의 문서 아이콘([⧉ 새 창] 옆)으로 대화 기록을 드롭다운으로 볼 수 있어야 하고, 고른 대화는 AI 창 안에서 펼쳐 보고 화면을 떠나지 않고 그 대화에 이어서 물을 수 있어야 하며, 지금 대화로 돌아갈 수 있어야 한다" }
  - { id: FR-HAG-08, text: "홈에서는 [AI에게 물어보기] · AI 창을 숨겨, 대화 화면이 두 개로 겹쳐 보이지 않아야 한다" }

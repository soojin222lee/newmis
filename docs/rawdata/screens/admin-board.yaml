requirements:
  - { id: FR-BRD-01, text: "관리자는 공지사항 · Q&A · 매뉴얼을 탭으로 나눠 관리할 수 있어야 한다" }
  - { id: FR-BRD-02, text: "관리자는 공지사항을 등록 · 수정 · 삭제할 수 있어야 하며, 구분 · 제목 · 내용이 비면 항목별 안내가 나와야 한다" }
  - { id: FR-BRD-03, text: "공지사항은 메인팝업(Y/N)을 정할 수 있어야 한다" }
  - { id: FR-BRD-04, text: "관리자는 구분 · Q&A상태 · 제목 · 작성자로 Q&A를 조회할 수 있어야 한다" }
  - { id: FR-BRD-05, text: "관리자는 Q&A에 답변을 등록하고 상태(답변완료 · 확인 중 · 조치 중)를 바꿀 수 있어야 한다" }
  - { id: FR-BRD-06, text: "관리자는 매뉴얼을 등록 · 수정 · 삭제할 수 있어야 한다" }
  - { id: FR-BRD-07, text: "관리자는 매뉴얼 한 건을 메인 매뉴얼로 등록할 수 있어야 한다" }

# rawdata: 관리자 > 게시판 관리 (스토리보드/SRS/버튼로직 생성용 원천 데이터)
# 스키마 규약: 영문 key(안정적 파싱) + 한국어 value. 로직은 file:function 근거 인용.
# [2026.11.27 남주] AS-IS 관리자(base-front) 화면을 옮긴 메뉴. 공통 코드는 public/js/admin-asis.js

screen:
  id: s-admin-board
  name: 게시판 관리
  menu_path: "관리자 > 운영 · 연계 > 게시판 관리"
  route: "/admin.html#board"
  entry: "adminGo('board') → asiteRender() → admSectionBody('board') → AAS_RENDER.board"
  data_source: "운영자 작성 · 사용자 질문"
  asis_source: "base-front src/views/admin/board/ (notice/NoticeAdmin.vue · qna/QnaAdmin.vue · manual/ManualBoard.vue)"
  source_files:
    - public/js/admin-asis.js   # 메뉴 등록(ADMIN_SECTIONS) · admSectionBody 데코레이터 · 렌더 · 핸들러 · 목업 데이터(AAS_DEF) · 전용 CSS(.aas-*)
    - public/js/admin.js        # 관리자 사이트 셸 · admModal · admToast — 수정하지 않음
    - public/admin.html         # admin-asis.js 로드(admin-approval.js 다음)
  purpose: >
    공지사항 · Q&A · 매뉴얼 게시판을 관리한다. 공지는 메인팝업 여부를, Q&A는 답변과 상태를, 매뉴얼은 메인 매뉴얼을 정한다.
  asis_diff: "AS-IS 의 그리드 행추가 · 바로 입력 · 행삭제 후 [저장] 방식을 목업 공통 방식(등록/수정 팝업 · 행별 삭제 확인)으로 바꿈. 페이지 이동(페이징)은 목업 건수가 적어 뺌"

elements:
  - { id: tab-board, label: "게시판 탭 (공지사항 · Q&A · 매뉴얼, 건수)", type: tab, crud: N, area: "화면 상단", event: onclick,
      front: { handler: "aasBoardGo('notice'|'qna'|'manual')", file: "admin-asis.js:aasBoardGo", logic: "탭 전환" }, backend: null, result: "탭별 조회 조건 · 표" }
  - { id: sel-notice-type, label: "구분 (전체 · 공지 · 작업공지 · 안내 · 긴급작업공지)", type: select, crud: R, area: "공지사항 탭 조회 조건", event: onclick,
      front: { handler: "aasSetDraft('notice','type',값)", file: "admin-asis.js:aasSetDraft", logic: "값이 같은 줄만(전체=조건 없음)" }, backend: null, result: "조회 조건 입력값" }
  - { id: inp-notice-title, label: "제목", type: input, crud: R, area: "공지사항 탭 조회 조건", event: onclick,
      front: { handler: "aasSetDraft('notice','title',값) · Enter=aasSearch('notice')", file: "admin-asis.js:aasSetDraft", logic: "값이 들어간 줄만(부분 일치)" }, backend: null, result: "조회 조건 입력값" }

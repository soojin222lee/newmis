# rawdata: 관리자 > 알림 · 메일 관리 > [메일 템플릿] 탭 (스토리보드/SRS/버튼로직 생성용 원천 데이터)
# 스키마 규약: 영문 key(안정적 파싱) + 한국어 value. 로직은 file:function 근거 인용.
# [2026.11.27 남주] AS-IS 「메일발송 관리 > 템플릿관리」 탭을 옮김.

screen:
  id: s-admin-mailtpl
  name: 메일 템플릿
  menu_path: "관리자 > 알림 · 메일 관리 > [메일 템플릿] 탭"
  route: "/admin.html#notify (옛 키 #mailtpl 로 와도 이 탭으로 열림)"
  entry: "adminGo('notify') → amgTab('notify','mailtpl') → admSectionBody → amgBody → amsTplHtml"
  data_source: "관리자 직접 작성 (AS-IS 템플릿관리)"
  asis_source: "base-front src/views/admin/postbox/TemplateManagement.vue · Template.ts"
  source_files:
    - public/js/admin-asis-mail.js    # 렌더 · 핸들러 · 목업 데이터(AMS_DEF.tpl)
    - public/js/admin-menu-group.js   # '알림 · 메일 관리' 묶음 탭
  purpose: >
    메일 제목과 내용 틀을 관리한다. ${…} 자리는 발송 때 실제 값으로 바뀐다. 메일링리스트가 이 템플릿을 고른다.
  asis_diff: "AS-IS 와 같은 배치(왼쪽 목록 + 오른쪽 편집). 편집기는 서식 편집기(toast-ui) 대신 글 상자 + '넣을 수 있는 값' 버튼. 행삭제 체크 대신 행별 [삭제]"

elements:
  - { id: inp-mailtpl-title, label: "제목 (조회 조건)", type: input, crud: R, area: "조회 조건", event: oninput,
      front: { handler: "amsSet('mailtpl','title',값) · Enter=amsSearch('mailtpl')", file: "admin-asis-mail.js:amsSet", logic: "제목에 들어간 글자로 찾음" }, backend: null, result: "조회 조건 입력값" }
  - { id: btn-mailtpl-reset, label: 초기화, type: button, crud: N, area: "조회 조건", event: onclick,
      front: { handler: "amsReset('mailtpl')", file: "admin-asis-mail.js:amsReset", logic: "조건 비움" }, backend: null, result: 전체 목록 }
  - { id: btn-mailtpl-search, label: 조회, type: button, crud: R, area: "조회 조건", event: onclick,
      front: { handler: "amsSearch('mailtpl')", file: "admin-asis-mail.js:amsSearch", logic: "조건 적용" }, backend: null, result: "검색결과 N건 / 총 M건" }
  - { id: grid-mailtpl, label: "템플릿 표 (템플릿ID · 제목 · 등록일자 · 관리)", type: grid, crud: R, area: 왼쪽 표, event: none,
      front: { handler: "amsTplHtml", file: "admin-asis-mail.js:amsTplHtml", logic: "제목 옆에 이 템플릿을 쓰는 메일링 수 표시. 처음엔 첫 템플릿 선택" }, backend: null, result: 템플릿 목록 }
  - { id: row-mailtpl-pick, label: "템플릿 줄 클릭 (편집 열기)", type: grid-row, crud: R, area: 왼쪽 표, event: onclick,
      front: { handler: "amsTplPick(id)", file: "admin-asis-mail.js:amsTplPick", logic: "오른쪽 편집 칸에 제목 · 내용을 채움" }, backend: null, result: 오른쪽 편집 칸 }
  - { id: btn-mailtpl-add, label: "＋ 템플릿 등록", type: button, crud: C, area: "표 위 툴바", event: onclick,
      front: { handler: "amsTplPick('new')", file: "admin-asis-mail.js:amsTplPick", logic: "오른쪽 편집 칸을 빈 새 템플릿으로" }, backend: null, result: 빈 편집 칸 }
  - { id: btn-mailtpl-var, label: "넣을 수 있는 값 (${수신자} · ${프로젝트명} …)", type: button, crud: N, area: "편집 칸 아래", event: onclick,
      front: { handler: "amsTplVar(값)", file: "admin-asis-mail.js:amsTplVar", logic: "내용 글 상자의 커서 자리에 넣음" }, backend: null, result: 내용 갱신 }
  - { id: btn-mailtpl-save, label: "등록 · 저장 (편집 칸)", type: button, crud: U, area: "편집 칸 아래", event: onclick,
      front: { handler: "amsTplSave()", file: "admin-asis-mail.js:amsTplSave", logic: "검사: '제목을 입력해 주세요.' · '내용을 입력해 주세요.'. 새 템플릿이면 ID(T-n) · 등록일자 자동, 맨 위에 추가" }, backend: null, result: 목록 갱신 + 토스트 }
  - { id: btn-mailtpl-cancel, label: "취소 (편집 칸)", type: button, crud: N, area: "편집 칸 아래", event: onclick,
      front: { handler: "amsTplCancel()", file: "admin-asis-mail.js:amsTplCancel", logic: "고친 내용을 버리고 첫 템플릿으로" }, backend: null, result: 편집 칸 }
  - { id: btn-mailtpl-del, label: "삭제 (행)", type: button, crud: D, area: "왼쪽 표 관리 칸", event: onclick,
      front: { handler: "amsAskDel('mailtpl',idx) → amsDel('mailtpl',idx)", file: "admin-asis-mail.js:amsAskDel", logic: "쓰고 있는 메일링이 있으면 그 수를 알림. 지우면 그 메일링의 템플릿은 비게 됨(메일링 목록에서 '-')" }, backend: null, result: 목록 갱신 }

requirements:
  - { id: FR-MTP-01, text: "관리자는 제목으로 메일 템플릿을 조회할 수 있어야 한다" }
  - { id: FR-MTP-02, text: "관리자는 목록에서 템플릿을 골라 제목과 내용을 고치고 저장할 수 있어야 한다" }
  - { id: FR-MTP-03, text: "관리자는 새 템플릿을 등록할 수 있어야 하며 템플릿ID와 등록일자가 자동으로 붙어야 한다" }
  - { id: FR-MTP-04, text: "제목이나 내용이 비면 저장되지 않고 안내가 나와야 한다" }
  - { id: FR-MTP-05, text: "관리자는 ${수신자} · ${프로젝트명} 같은 치환 값을 버튼으로 내용에 넣을 수 있어야 한다" }
  - { id: FR-MTP-06, text: "템플릿 목록에는 그 템플릿을 쓰는 메일링 수가 보여야 하며, 쓰는 템플릿을 지울 때는 영향을 알려야 한다" }

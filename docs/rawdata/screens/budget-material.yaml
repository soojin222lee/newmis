# ── 대표 플로우 ──
flows:
  - name: 상품재료비(견적 Y)
    steps:
      - "#/budget-adjust/material 진입 → 상품재료비 탭(materialKind='item')"
      - "신규 등록 → 견적선정유무 Y → 견적 그룹 1건 클릭(selectMaterialQuoteLine)"
      - "물품정보 자동채움(readonly) → 검수 계획 등록 팝업 → 수량만큼 생성 행의 검수 예정월 조정 → 저장"
      - "등록(saveMaterialItem) → 검증 통과 → 상품계획 목록 추가(상태 '계획')"
      - "실적 발생 전 '수정' 가능 / actualized 후 '수정불가'"
  - name: 상품재료비(직접입력 N)
    steps:
      - "신규 등록 → N → 품목정보 + 예산 시작월~종료월 + 금액 → 월별 배분 미리보기 → 등록(buildMaterialAllocations 균등배분)"
  - name: 감가상각비
    steps:
      - "감가상각비 탭 → 신규등록 → 감가상각 계정 선택 + 시작월/개월수/상각총액 → 미리보기 → (선택)월별 보정 → 저장(saveDepreciationPlan)"
  - name: 이관재료비
    steps:
      - "이관재료비 탭 → 신규등록(Receiver 고정) → 이관예정월/금액/사유 → 등록(saveOtherMaterialExpense)"
      - "Sender·집행완료 건은 '조회'만 노출"
  - name: 계정 월예산 통합
    steps:
      - "getAccountDetailRows(CATS[2])=[상품재료비,감가상각비,이관재료비](budget-status-4.js:1217)"
      - "getMonthlyBudgetRows(:1243): 감가상각비 월값=getDepreciationAmountForMonth, 이관재료비=getMaterialTransferAmountForMonthFinal, 상품재료비=max(base-감가-이관,0)"

# ── 요구사항 후보(FR) — 재료비.md §11 재사용 ──
requirements:
  - { id: FR-MAT-01, text: "재료비 계정은 #/budget-adjust/material?pj=<프로젝트> 딥링크로 직접 진입할 수 있어야 한다" }
  - { id: FR-MAT-02, text: "재료비는 상품재료비/감가상각비/이관재료비 3개 상세구분 탭을 제공하고, 탭 전환 시 편집 상태를 초기화해야 한다" }
  - { id: FR-MAT-03, text: "상품재료비는 구매시스템 견적(구매건/PO 그룹)을 조회·선택해 등록하며, 선택된 견적의 물품정보는 편집할 수 없어야 한다(읽기전용)" }
  - { id: FR-MAT-04, text: "견적 사용 시 물품 수량만큼 검수 예정월 행을 생성하고, 사용자가 조정한 검수월별 금액을 월별 계획으로 배분해야 한다" }
  - { id: FR-MAT-05, text: "견적 미확정 시 예산 시작월~종료월과 금액으로 월별 균등 배분(잔액 마지막 월)해야 한다" }
  - { id: FR-MAT-06, text: "실적이 발생한(actualized) 상품재료비 계획은 수정할 수 없어야 하며, UI에서 수정 버튼을 비활성('수정불가')해야 한다" }
  - { id: FR-MAT-07, text: "상품재료비 저장 시 견적 선택/금액/검수월(또는 직접입력 기간)/품목 필수값을 검증해야 한다" }
  - { id: FR-MAT-08, text: "감가상각비는 4개 감가상각 계정(713801/713802/713803/713806) 중 선택하도록 한다" }
  - { id: FR-MAT-09, text: "감가상각비는 시작월/개월수/상각총액으로 월별 상각액을 자동 균등배분(잔액 보정)하고, 수기 보정 팝업을 제공해야 한다" }
  - { id: FR-MAT-10, text: "감가상각 월배분액은 재료비 계정 월별 예산내역의 '감가상각비' 행으로 반영되어야 한다" }
  - { id: FR-MAT-11, text: "이관재료비 신규 등록은 Receiver Project(수취, 플러스 금액)만 허용하고, Sender Project/집행완료 건은 조회 전용이어야 한다" }
  - { id: FR-MAT-12, text: "이관금액은 월별 예산내역의 '이관재료비' 행(및 실적)으로 반영되어야 한다" }
  - { id: FR-MAT-13, text: "재료비 계정 월예산은 상품재료비/감가상각비/이관재료비 3행으로 분해되며, 상품재료비=계정 월계획-감가상각-이관(음수 방지)으로 산출한다(상품재료비 상세 계획의 월예산 직접 반영 여부는 정책 확정 필요)" }
  - { id: FR-MAT-14, text: "목업으로 처리된 견적/검수 실적/감가상각 원장/이관 인터페이스는 실제 외부 시스템 연동으로 정의해야 한다" }

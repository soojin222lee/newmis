    채팅 답변(app.js:chatIssueListHtml)은 1차 데이터 HOME_FEED + homeFeedState 를 읽고,
    레일·메인 화면은 AGENT_PROPOSALS_FINAL(pjtTodosOf) + SCEN_RISKS_BY_PJT 를 읽었다.
    소스가 갈려 왼쪽에 5건이 있어도 채팅은 "해야 할 일이 없습니다"로 답했다.
  fix:
    - "chatIssueListHtml 을 dashboard.js 에서 재정의해 화면과 같은 소스를 쓰게 한다 (app.js 316 < dashboard.js 317 이므로 뒤가 이김)"
    - "v2PjtFromText(text): 질문에서 프로젝트 이름·번호를 찾아 범위를 좁힌다 (이름 앞부분만 말해도 매칭)"
    - "routeIntents 를 런타임 교체해 질문에서 찾은 프로젝트를 homeSelectedProject·homeV2Open·leadPjtSel 에 반영"

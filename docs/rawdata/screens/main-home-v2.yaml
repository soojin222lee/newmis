# rawdata: 메인 홈 버전2 (AxgenticWire 셸) — 스토리보드/SRS/버튼로직 생성용 원천 데이터
# 스키마 규약: 영문 key(안정적 파싱) + 한국어 value. 로직은 file:function 근거 인용.
# ⚠ override 규칙: dashboard.js 는 동일 함수를 여러 번 재정의한다(뒤가 앞을 이김).
#   버전2는 파일 맨 끝(31차 블록)에서 initDashboard 를 런타임 교체하므로 이 문서가 실제 동작 기준.
#   initDashboard 는 function 선언이 아니라 window.initDashboard = ... 로 덮는다(호이스팅 회피).

screen:
  id: s-main-home-v2
  name: 메인 홈 버전2 (AxgenticWire 통일 셸)
  menu_path: 홈 (메인화면 우측 상단 "버전2" 버튼)
  route: "해시 라우팅 없음 · showMain() 진입 후 homeVer 상태로 분기"
  entry: "showMain() → setScreen('s-main') → initDashboard() → homeVer==='v2' ? renderHomeV2() : initDashboardV1()"
  container: "#s-main (initDashboard 가 innerHTML 렌더)"
  source_files:
    - public/js/dashboard.js        # 31차 블록: homeVer/setHomeVer/renderHomeV2/homeV2RailHtml/homeV2Hero
    - public/js/app.js              # showMain·askFromHome·openAiChat·openSetupGuide·toggleAgentGrid
    - public/css/home.css           # 31차 블록: .v2-* 전용 스타일 (버전1 스타일 무영향)
  purpose: >
    선행 시스템 AiTeaming(인력추천 teaming)·AiPMO(CP금액 산정)가 AxgenticWire 브랜드로 디자인을
    통일해 오픈했다. 실행예산도 같은 셸(상단 바 없음 · 좌측 레일 브랜드/메뉴 · 중앙 한 문장 히어로)
    로 맞추기 위한 신규 구성이다. 기존 화면은 "버전1"로 그대로 보존하고, 우측 상단 버튼으로
    두 버전을 번갈아 비교한다. 버전1에 쌓인 지시사항(카드 그리드 · 상세/간소 토글 · KPI 7종 ·
    원가 분해 · 5-Tier · 위젯)은 버전2에 가져오지 않는다. 중앙은 히어로 하나만 두고,
    업무는 좌측 레일에서 처리하고 상세 진입은 프롬프트 → AI 네비게이터가 담당한다.
  design_reference:
    brand_lockup: "AXGENTIC WIRE(워드마크) + AiBudget(서비스 서브타이틀)"
    siblings: [AiTeaming, AiPMO]
    rules:
      - "상단 바 없음 — 브랜드·사용자·유틸 내비가 좌측 레일로 이동"
      - "연회색 배경 + 흰 라운드 카드(14~20px), 섹션 라벨 → 카드 안 행 + 카운트 배지 + chevron"
      - "히어로: ✦ → 인사말(작게) → 현재 상태 한 문장(핵심어만 파랑) → 안내 필 → 질문 바"
      - "색: 배경 #eef1f6 · 카드 #fff/#e6eaf1 · 강조 #2f6bed · AI #7b61ff (SK 레드 미사용)"
      - "파랑=강조 문장 / 보라=AI·채팅"

# ── 화면 상태 ──
states:
  - id: ver_v1
    when: "homeVer === 'v1' (기본값 · localStorage 'newmis.homeVer')"
    render: "initDashboardV1() = 31차 이전의 initDashboard(renderPmDashboard)"
    shows: ["기존 버전1 화면 원형", "우측 상단 버전 토글(homeVerMount 로 주입)"]
    note: "버전1 렌더 경로·스타일은 한 줄도 변경하지 않는다."
  - id: ver_v2_pm
    when: "homeVer === 'v2' && homeUser === 'pm'"
    render: "renderHomeV2()"
    shows: ["좌측 레일(담당 프로젝트 아코디언 + 유틸 + 사용자)", "히어로: '해야 할 일 N건, 이상징후 N건이 있습니다'", "안내 필", "질문 바", "한 줄 안내"]
    note: "중앙에는 히어로만 둔다. 버전1의 카드 그리드·상세/간소 토글·KPI·원가 분해·5-Tier·위젯은 버전2에 가져오지 않는다(유관시스템 디자인 철학 유지)."
  - id: ver_v2_lead
    when: "homeVer === 'v2' && homeUser === 'lead'"
    render: "renderHomeV2()"
    shows: ["좌측 레일(팀 프로젝트 아코디언)", "히어로: '결재 대기 N건, 점검 항목 N건이 있습니다'", "안내 필에 CP총액·수행원가총액"]
    note: "팀장도 중앙은 히어로만. 원가 분석은 레일 펼침 또는 AI 네비게이터로 들어간다."
  - id: rail_pjt_expanded
    when: "homeV2Open === <프로젝트 id> (toggleHomeV2Pjt 로 1개만 열림)"
    effect: "그 프로젝트 행이 제자리에서 펼쳐져 수행원가총액·소진율과 해야 할 일·이상징후 항목이 보인다. 항목을 누르면 해당 계정 화면으로 이동(homePjtGo)."
    note: "내 업무는 별도 섹션이 아니라 프로젝트 안으로 병합됐다. 모든 조작이 레일 안에서 끝난다."
  - id: ver_v2_clear
    when: "homeVer === 'v2' && 처리할 항목이 0건"
    effect: "히어로 문장이 '결재와 점검이 모두 정리된 상태입니다' / '지금 처리할 일이 없습니다' 로 바뀐다"
  - id: topbar_hidden
    when: "body.home-v2 && #s-main.active"
    effect: "CSS `body.home-v2 .shell:has(#s-main.active) .topbar { display:none }` 로 상단 바만 숨김. 다른 화면으로 이동하면 상단 바가 그대로 복귀한다."

# ── 요소(버튼/입력/칩) 인벤토리 ──
elements:
  - id: btn-ver-v1
    label: 버전1
    kind: button
    crud: N
    where: "메인화면 우측 상단 .v2-vertabs"
    handler: "setHomeVer('v1')"
    logic: "homeVer='v1' → localStorage 'newmis.homeVer' 저장 → body.home-v2 해제 → initDashboard() 재렌더"
    api: 없음 (로컬 상태)
  - id: btn-ver-v2
    label: 버전2
    kind: button
    crud: N
    where: "메인화면 우측 상단 .v2-vertabs"
    handler: "setHomeVer('v2')"
    logic: "homeVer='v2' → localStorage 저장 → body.home-v2 부여 → initDashboard() 가 renderHomeV2() 렌더"
    api: 없음 (로컬 상태)
  - id: btn-brand-home
    label: AXGENTIC WIRE / AiBudget (브랜드 락업)
    kind: button
    crud: N
    where: "좌측 레일 최상단 .v2-lock"
    handler: "showMain()"
    logic: "메인 홈으로 복귀. app.js:showMain 재사용."
    api: 없음
  - id: btn-rail-collapse
    label: 좌측 메뉴 접기/펴기
    kind: button
    crud: N
    where: "좌측 레일 최상단 우측 .v2-collapse"
    handler: "toggleV2Rail()"
    logic: >
      homeV2Rail('open'|'min')을 뒤집고 localStorage 'newmis.v2Rail' 에 저장한 뒤
      v2ApplyRail() 로 폭을 적용한다(268px ↔ 60px). 접히면 글자·프로젝트 목록이 숨고
      마크·유틸 아이콘·아바타만 남는다. aria-expanded 와 title 도 함께 바꾼다.
      1100px 이하에서는 1열이라 버튼 자체를 숨기고 폭 지정을 해제한다.
    api: 없음 (로컬 상태)
  - id: btn-rail-pjt-toggle
    label: 담당 프로젝트 행 펼치기/접기 (조회)
    kind: button
    crud: R
    where: "좌측 레일 '담당 프로젝트' 카드 .v2-pjt-h"
    handler: "toggleHomeV2Pjt(id)"
    logic: >
      homeV2Open 을 해당 id 로 바꿔 한 번에 하나만 펼친다(같은 id 재클릭 시 접힘).
      #v2-rail-body 만 부분 렌더한다(중앙은 다시 그리지 않는다).
      행 우측 배지 = v2TodosOf(id).open + v2RisksOf(id).open 건수(역할별로 다름),
      0건이면 leadCostBreak(id).plan 유무에 따라 '정상' 또는 '편성 전' 태그.
    api: 없음 (AGENT_PROPOSALS_FINAL · SCEN_RISKS_BY_PJT · BUDGET_SOURCE 집계)
  - id: btn-rail-item
    label: 해야 할 일 · 이상징후 항목 조회
    kind: button
    crud: R
    where: "펼쳐진 프로젝트 안 .v2-item"
    handler: "homePjtGo(pjtId, acct)"
    logic: >
      해당 계정의 원가조정 화면으로 이동한다. 사용자가 팀장이면 agentPersonaFinal='exec',
      PM이면 'pm' 으로 맞춘 뒤 openCostArea(acct, pjtId) 를 호출한다.
      항목 상태(pjtItemState)에 따라 [재기안]/[결재중]/[처리완료] 라벨이 붙고, 처리완료는 취소선.
    api: 없음 (해시 라우팅 #/budget-adjust/<slug>?pj=<key>)
  - id: btn-chat-item
    label: 채팅 답변의 업무 항목 조회
    kind: button
    crud: R
    where: "AI 채팅 답변 안 .v2-ci"
    handler: "homePjtGo(pjtId, acct)"
    logic: >
      레일 항목과 같은 핸들러를 쓴다. 답변은 chatIssueListHtml(33차 재정의)이 만들며
      v2TodosOf/v2RisksOf 를 읽어 레일·히어로와 같은 건수를 보여준다.
    api: 없음 (해시 라우팅 #/budget-adjust/<slug>?pj=<key>)
  - id: input-ai-query
    label: 원가 관련 질문 입력
    kind: input
    crud: R
    where: "히어로 .v2-ask #ai-main-query"
    handler: "Enter → askFromHome()"
    logic: "app.js:askFromHome 재사용. 버전1과 동일한 id 를 써서 AI 채팅 진입 동선을 공유한다."
    api: "POST /api/chat (server.js:handleChat) · 키 미설정 시 규칙 기반 폴백"
  - id: btn-ai-send
    label: 질문하기 (조회)
    kind: button
    crud: R
    where: "히어로 .v2-ask-send"
    handler: "askFromHome()"
    logic: "입력값으로 AI 채팅 오버레이를 열고 인텐트 라우팅(routeIntents)에 따라 담당 AI가 답한다."
    api: "POST /api/chat"
  - id: btn-hero-notice
    label: 담당 프로젝트 업무 펼치기 (조회)
    kind: button
    crud: R
    where: "히어로 안내 필 .v2-notice"
    handler: "homeV2GoBoard()"
    logic: "중앙에 블록이 없으므로 스크롤 대신 레일의 첫 프로젝트(또는 이미 열린 것)를 펼친다."
    api: 없음
  - id: btn-util-groundrule
    label: 그라운드 룰 조회
    kind: button
    crud: R
    where: "좌측 레일 하단 .v2-util"
    handler: "openSetupGuide()"
    logic: "app.js:openSetupGuide — 팀 그라운드 룰·개발 셋업 오버레이."
    api: 없음
  - id: btn-util-navi
    label: AI 네비게이터 열기
    kind: button
    crud: N
    where: "좌측 레일 하단 .v2-util"
    handler: "openAiChat('navi')"
    logic: "app.js:openAiChat — 화면 이동 담당 AI 로 채팅 오버레이를 연다."
    api: 없음
  - id: btn-util-agents
    label: AI개발 Agent 목록 조회
    kind: button
    crud: N
    where: "좌측 레일 하단 .v2-util"
    handler: "openAgentModal()"
    logic: >
      AGENT_APPS 를 중앙 모달(.v2-modal)로 띄운다. 타일 클릭 시 window.open 으로 새 창.
      상단바용 toggleAgentGrid 는 .tb-agents 좌표로 위치를 잡고 바깥 클릭 예외도 .tb-agents 만
      두어, 상단바가 숨겨진 버전2에서는 열리는 즉시 닫혀 버린다. 그래서 전용 모달을 만들었다.
      ✕ · Esc · 배경 클릭으로 닫힌다.
    api: 없음
  - id: btn-agent-tile
    label: Agent 새 창으로 열기
    kind: button
    crud: N
    where: "AI개발 Agent 모달 .v2-agent"
    handler: "window.open(url,'_blank','noopener')"
    logic: "AGENT_APPS[].url 로 사내 Agent 를 새 창에 연다."
    api: 없음 (외부 링크)
  - id: btn-agent-close
    label: AI개발 Agent 팝업 닫기
    kind: button
    crud: N
    where: "AI개발 Agent 모달 .v2-modal-x"
    handler: "closeAgentModal()"
    logic: "open 클래스를 제거해 페이드아웃. Esc·배경 클릭도 같은 함수를 부른다."
    api: 없음
  - id: btn-user-switch
    label: 사용자 전환 (이봄 PM ↔ 박정우 팀장)
    kind: button
    crud: N
    where: "좌측 레일 최하단 .v2-me"
    handler: "homeV2SwitchUser()"
    logic: "switchHomeUser(homeUser==='lead' ? 'pm' : 'lead') → 레일 배지·히어로 문장·하단 블록이 모두 해당 관점으로 재렌더."
    api: 없음

# ── 데이터 ──
data:
  homeVer: "'v1' | 'v2' · localStorage 'newmis.homeVer' 에 보존(새로고침 유지)"
  homeV2Open: "레일에서 펼친 프로젝트 id (1개만, 세션 내 메모리)"
  hero_source:
    pm: "v2TodosOf(id).open 합계(pending·returned) / v2RisksOf(id).open 합계"
    lead: "v2TodosOf(id).open 합계(approved·submitted = leadApprovalQueue 와 동일) / v2RisksOf(id).open 합계"
  rail_badge_source: "히어로와 같은 함수를 쓴다 — 두 곳 숫자가 어긋날 수 없다"
  chat_source: "chatIssueListHtml 도 같은 v2TodosOf/v2RisksOf 를 쓴다(33차) — 채팅·레일·히어로가 한 소스"

# ── 요구사항 ──
requirements:
  - { id: FR-HOME2-01, text: "담당자는 메인화면 우측 상단 버튼으로 버전1과 버전2를 번갈아 비교할 수 있어야 하고, 선택한 버전은 새로고침 후에도 유지되어야 한다" }
  - { id: FR-HOME2-02, text: "버전1 화면은 버전2 도입과 무관하게 기존 구성·스타일이 그대로 유지되어야 한다" }
  - { id: FR-HOME2-03, text: "버전2는 상단 메뉴 바 없이 좌측 레일에서 브랜드·프로젝트·사용자를 제공하고, 메인화면을 벗어나면 상단 바가 복귀해야 한다" }
  - { id: FR-HOME2-04, text: "버전2 중앙에는 현재 처리해야 할 일을 한 문장으로 요약해 보여주고 핵심 건수를 강조해야 한다" }
  - { id: FR-HOME2-05, text: "히어로 문장·안내·레일 배지는 사용자 역할(PM/팀장)에 따라 각자 처리할 업무만 보여야 한다" }
  - { id: FR-HOME2-06, text: "버전2 중앙에는 카드 그리드·상세/간소 토글·원가 분해 등 버전1의 상세 블록을 표시하지 않아야 한다" }
  - { id: FR-HOME2-07, text: "담당자는 좌측 레일에서 프로젝트를 선택해 그 프로젝트의 업무를 펼쳐 볼 수 있어야 하며, 한 번에 하나만 펼쳐져야 한다" }
  - { id: FR-HOME2-08, text: "업무 항목을 클릭하면 해당 계정의 원가조정 화면으로 이동해야 하고, 처리된 항목은 처리완료로 구분되어야 한다" }
  - { id: FR-HOME2-09, text: "AI 채팅의 업무 답변은 화면(레일·히어로)과 동일한 건수를 보여야 하고, 질문에 프로젝트명이 있으면 그 프로젝트로 범위를 좁혀 답해야 한다" }
  - { id: FR-HOME2-10, text: "버전2 색상은 선행 시스템(AiTeaming·AiPMO)과 동일한 계열을 사용해야 하며 버전1 스타일에 영향을 주지 않아야 한다" }

# ── 확인 시나리오 ──
verification:
  - "버전2 전환 → 상단 바 사라짐 · 레일 브랜드 'AXGENTIC WIRE / AiBudget' 표시"
  - "중앙에 #home-board·.v2-below·.v2-cta 없음 (히어로만)"
  - "PM: 히어로 '확인이 필요한 원가 조정이 11건, 이상징후 3건 있습니다'"

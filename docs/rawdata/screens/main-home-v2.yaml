# ── 34차: 펼침 애니메이션 · 채팅 도킹 전환 · Agent 모달 ──
interactions:
  rail_expand:
    problem: ".v2-rail 에 max-height + overflow-y:auto 가 걸려 내용이 많으면 내부 스크롤이 생겼다"
    fix:
      - "max-height:none · overflow:visible · position:static → 내용만큼 아래로 자란다"
      - ".v2-exp-w 를 grid-template-rows 0fr → 1fr 로 전환해 auto 높이를 부드럽게 애니메이션"
      - "항목마다 animation-delay 45ms 씩 주어 순차로 떠오르게(v2Rise) — AI가 하나씩 꺼내는 느낌"
      - "화살표는 문자 교체 대신 transform:rotate(90deg)"
      - "prefers-reduced-motion 에서는 애니메이션을 끈다"
    verified: "레일 729px → 1374px 로 확장 · 내부 스크롤 없음 · 지연 135/180/225ms"
  chat_dock_on_nav:
    problem: >
      chatNavigate 는 답변 850ms 뒤 자동으로 navGo + dockAiChat 을 실행한다. 그보다 먼저
      사용자가 "지금 이동 →" 을 누르면 navGo 만 실행돼 중앙 팝업이 상세 화면을 덮은 채 남았다.
    fix: >
      navGo 를 런타임 교체해 .v2-navout 로 팝업을 먼저 접고, 300ms 뒤 dockAiChat() 으로
      우측 레일에 붙인다. 대화 DOM(#ai-chat-body)은 건드리지 않으므로 내용이 그대로 유지된다.
      key==='dashboard' 는 도킹하지 않는다(메인 복귀 관찰자가 닫는다).
    verified: "팝업(open) → v2-navout → s-budget 전환 → docked · 대화 2건 유지 · '메인으로' 버튼 생성"
  agent_modal:
    problem: "레일에서 toggleAgentGrid(this) 를 부르면 아무것도 보이지 않았다"
    cause: "위치를 .tb-agents 좌표로 잡고, 바깥 클릭 감지도 .tb-agents 만 예외 → 버전2에서는 즉시 닫힘"
    fix: "openAgentModal() 로 중앙 모달을 따로 만든다 (그라운드 룰·AI 네비게이터와 같은 결)"
    note: >
      트랜지션 시작 프레임을 requestAnimationFrame 으로 잡았더니 탭이 백그라운드일 때 rAF 가
      멈춰 모달이 영원히 보이지 않았다. setTimeout 20ms 로 바꿨다.
    verified: "중앙 정렬 · z-index 400 · 타일 2개 · ✕/Esc/배경 클릭 닫힘"

# ── 35차: 레일 접기/펴기 · 브랜드 락업 ──
brand_lockup:
  source: "36차에 받은 공식 로고 양식(기본 표기 / 하위 브랜드 병기 표기 + Construction 시트)"
  spec: "마크 + AXGENTIC(굵게) + WIRE(같은 검정·얇게·윗줄) + 하위 명칭(AXGENTIC 좌측 정렬)"
  sub_name: AiBudget
  mark: >
    v2BrandMarkSvg() — 노드가 이어진 분자형 점 묶음 7개, 시안(#22c1f0) → 블루(#1f7ae0)
    → 딥블루(#1b2fc8) 대각 그라데이션. 24px.
  wordmark: "AXGENTIC 900 #111820 · WIRE 500 #111820 + border-top 1.4px #111820"
  sub: "AXGENTIC 과 같은 #111820 · 800 · max(10.5px, 0.62A)"
  construction: >
    가이드의 "하위 브랜드 배치는 알파벳 A 높이 기준"을 --v2a(=15px) 변수로 옮겼다.
    하위 명칭 크기 0.62A · 위 여백 0.4A · WIRE 윗줄 간격 0.16A.
    0.62A 를 13px 기준에 그대로 쓰면 8px 라 읽히지 않아 최소 10.5px 를 보장한다.
  approximation_note: >
    마크는 이미지에서 읽은 근사 SVG다. 원본 SVG/PNG 를 받으면 v2BrandMarkSvg() 만
    교체하면 된다(다른 곳에서 마크를 참조하지 않는다).
rail_collapse:
  state: "homeV2Rail 'open'|'min' · localStorage 'newmis.v2Rail'"
  widths: { open: 268px, min: 60px }
  apply: "v2ApplyRail() — .v2-wrap 의 grid-template-columns 와 .v2-rail 의 width/maxWidth 를 인라인으로 지정"
  why_inline: >
    (1) grid-template-columns 는 minmax() 트랙이 섞이면 transition 이 보간되지 않아 값이 그대로 남는다.
    (2) 트랙을 auto 로 두면 레일 내용의 기여분(268px)이 잡혀 width 가 먹지 않는다.
    (3) 그리드 아이템의 min-width:auto 는 min-content 로 풀려 width 를 누른다 → min-width:0 필요.
    (4) width 만으로는 박스가 268px 로 남는 경우가 있어 max-width 도 함께 고정.
    (5) index.html 의 ?v= 가 고정돼 있어 새로 추가한 CSS 규칙이 캐시 때문에 적용되지 않을 수 있다.
    인라인 지정은 위 다섯 가지를 모두 비켜간다.
  motion: "폭은 즉시 바뀌고(트랙은 보간 불가) 내용만 v2RailFade 로 페이드"
  verified: "268px ↔ 60px · main 1041 ↔ 1249 · 겹침 없음 · 재렌더 후에도 접힘 유지 · 팀장 동일"


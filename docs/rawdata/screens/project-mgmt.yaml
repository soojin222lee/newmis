    log:   "{date, rel(상대시각), time, sys, field, before, after, delta?, num?, note?, io?}"

# ── 대표 플로우 ──
flows:
  - name: 수주형 신규 등록(목업)
    steps:
      - "목록 #/si-project → [+ 신규 등록] (siView='register')"
      - "CRM 코드/PM 입력 → 조회(siMockFetch): CRM_PROJECTS_POOL 필터 (0건 경고/1건 자동선택/복수 목록)"
      - "프로젝트 선택(siRegSelectProject) → CRM 기본정보 읽기전용 확인"
      - "[등록 완료](siConfirmRegister) → SI-00N 키로 SI_PROJECTS 추가(stage='등록완료') → 상세 전환 + 토스트"
  - name: 수주형/제안 조회 및 IF 모니터링
    steps:
      - "목록에서 검색/단계 필터로 탐색 → 행 클릭(openSIDetail/openProposalDetail)"
      - "상세 대시보드(siDetailHtml): 진행 스텝 · 선행 시스템 동기화 카드 · 기본정보(출처 배지·최근변경)"
      - "동기화 카드 클릭(siOpenSyncPopup) → 해당 시스템 IF 변경이력 팝업(날짜별 타임라인, 송/수신·before→after)"
      - "팝업 닫기(siCloseSyncPopup) → [← 목록](closeSIDetail/closeProposalDetail)로 복귀"

# ── 요구사항 후보(FR) ──
requirements:
  - { id: FR-PJ-01, text: 사용자는 수주형/제안 프로젝트를 목록에서 검색어·단계로 필터링해 조회할 수 있다 }
  - { id: FR-PJ-02, text: 사용자는 목록 행을 클릭해 프로젝트 상세 IF 대시보드로 진입할 수 있다(수주형·제안 동일 대시보드) }
  - { id: FR-PJ-03, text: 사용자는 CRM 최종계약완료 프로젝트를 조회하여 수주형 프로젝트로 선택 등록할 수 있다(D 시리즈 코드 승계) }
  - { id: FR-PJ-04, text: 제안 프로젝트는 원 수주 프로젝트 base 코드에 P00N을 채번하며 신규 등록 UI 없이 관리된다 }
  - { id: FR-PJ-05, text: 상세 화면은 선행 시스템(ERP·AI SCM·AI CRM·구매)별 동기화 상태(방향·마지막 교환시각·변경건수·지연)를 표시한다 }
  - { id: FR-PJ-06, text: 사용자는 동기화 카드를 클릭해 해당 시스템의 IF 변경이력을 날짜별 타임라인 팝업으로 확인할 수 있다 }
  - { id: FR-PJ-07, text: 기본정보 각 필드는 출처 시스템 배지와 최근 변경 강조를 함께 제공한다 }
  - { id: FR-PJ-08, text: 진행 단계는 착수/수행/종료 3단계 스테퍼로 표시되며 stage 값에 따라 자동 산출된다 }
  - { id: FR-PJ-09, text: 종료 처리는 현재 안내 토스트 스텁이며 실제 종료 로직은 미구현이다(목업) }
  - { id: FR-PJ-10, text: 모든 데이터는 JS 상수 기반 목업으로 백엔드 API 호출이 없으며 새로고침 시 초기화된다 }

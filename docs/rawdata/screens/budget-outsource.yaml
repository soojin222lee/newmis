# ── 대표 플로우 ──
flows:
  - name: 실투입대상 외주비(핵심)
    steps:
      - "#/budget-adjust/outsource?pj=budgetMock 진입 → 외주비 편집기(예산내역 표 + 상세계정 탭)"
      - "'실투입대상 외주비' 탭(기본). 헤드라인 분기편중 경고 + 요약"
      - "[신규등록] → 업체 예산폼(업체명/업무명/전체기간/예산) → [등록](osv3SaveVendorV3)"
      - "업체 행 ∨ 펼침 → [＋ 계획 라인](osv3AddPlanLineV3)으로 구매견적 맞춰 기간·금액 입력"
      - "구매계약 발생 시 PO번호·실적 채워짐(조회 전용). PO 행 [▦ 견적] → [이 견적대로 검수계획 채우기](osv3ApplyQuoteV3) 또는 [균등분배로 재설정](osv3ResetEvenV3)"
      - "합계 칩으로 PO금액 일치 확인. 과거 실적확정월은 잠김"
      - "분기 편중 warn 시 [AI 해설]로 원인/영향/조치 확인"
  - name: 나머지 상세계정
    steps:
      - "전문직/공사MA: 탭 → [신규등록] → 견적 Y/N → 견적라인 선택/직접입력 → 검수집행월 → 저장"
      - "외주출장비: [신규등록] → 계약번호 ⌕로 PO 선택 → 출장내역/집행월/금액 → 등록"
      - "이관외주비: Receiver만 [신규등록](이관월/금액/사유), Sender는 조회 전용"
      - "기타외주비: [신규등록] → 집행월/금액/설명 → 등록"

# ── 요구사항 후보(RQ) ── (외주비.md §11 재사용·정리; 최종 유효본의 '계획 라인' 모델 반영)
requirements:
  - { id: RQ-OS-01, text: "외주비는 6개 상세계정(실투입/전문직/외주출장/공사MA/이관/기타)으로 분류하고 상세계정 단위로 계획을 등록·수정할 수 있어야 한다" }
  - { id: RQ-OS-02, text: "실투입대상 외주비는 '업체별 전체기간 예산 1건 → 외주구매 계획 라인 N건 → PO별 월별 검수계획'의 3계층으로 편성되어야 한다" }
  - { id: RQ-OS-03, text: "PO번호·금액·실적·집행예정·견적은 구매계약 발생 시 구매시스템 수신값으로 채워지며(조회 전용), PM은 계획 라인(기간·금액)과 월별 검수계획(금액·MM)만 입력할 수 있어야 한다" }
  - { id: RQ-OS-04, text: "시스템은 기간 경과율 대비 예산 발행율이 15%p 초과 앞서면 '분기 편중' 경고를 표시해야 한다(warn/ok 2단계)" }
  - { id: RQ-OS-05, text: "계획 라인 금액은 잔여예산(전체기간 예산 − 편성 합계)을 상한으로 하고, 예산 소진 시 신규 계획 라인 추가를 차단해야 한다" }
  - { id: RQ-OS-06, text: "실적이 확정된 과거월(기준월 이전)의 월별 검수계획은 수정할 수 없어야 한다" }
  - { id: RQ-OS-07, text: "월별 검수계획은 균등분배 재설정 및 견적 비중대로 자동 채우기를 제공하되, 실적확정월은 보존해야 한다" }
  - { id: RQ-OS-08, text: "월별 검수계획 합계는 PO 금액과 일치 여부를 시각적으로 표시해야 한다" }
  - { id: RQ-OS-09, text: "업체 예산 저장 시 필수값·기간 유효성·발행 PO 합계 미만 예산·기간 외 PO 여부를 검증해야 한다" }
  - { id: RQ-OS-10, text: "실적이 발생한 업체는 삭제할 수 없어야 한다" }
  - { id: RQ-OS-11, text: "이관외주비는 Receiver Project만 신규등록 가능하고, Sender Project(집행완료)는 조회 전용으로 처리해야 한다" }
  - { id: RQ-OS-12, text: "공사MA는 구매 견적라인(표준품명·단위·주기·단가)을 선택해 검수집행월을 지정하되, 검수완료 라인은 검수집행월을 수정할 수 없어야 한다" }
  - { id: RQ-OS-13, text: "외주출장비는 PO를 매핑하고 항공·숙박·교통·일당·기타로 구성된 출장금액과 집행예정월을 등록해야 한다" }
  - { id: RQ-OS-14, text: "외주비 예산내역은 6개 상세계정 합계 부모행 + 접기/펼치기 자식행으로 표시하고, 실투입 행은 업체/PO/검수계획 실데이터로 산출해야 한다" }
  - { id: RQ-OS-15, text: "분기 편중 경고에 대해 AI 해설(원인/영향/조치)을 요청할 수 있어야 하며, API 키는 서버에만 보관하고 브라우저로 노출하지 않아야 한다" }
  - { id: RQ-OS-16, text: "외주비 편집기는 #/budget-adjust/outsource?pj=<프로젝트키> 딥링크로 직접 진입 가능해야 한다" }
  - { id: RQ-OS-17, text: "검수계획 저장·확정 시 해당 월이 월별 외주비 원가 등록 대상에 반영되어야 한다" }

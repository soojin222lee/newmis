# ── 대표 플로우 ──
flows:
  - name: 프로젝트 선택 후 AI 문맥 질문
    steps:
      - "showMain→initDashboard→renderPmDashboard. 캐러셀에 담당 9개(To-Do 많은 순) 표시"
      - "칩 이름 클릭 → selectHomePjt('skon') → picked(✓), 문맥 줄에 '선택된 프로젝트: SKON...'"
      - "검색창 '외주비 왜 늘었어?' + Enter → askFromHome → openAiChat('main', text) → sendAiChat"
      - "routeIntents 매칭(outsource 등) → 담당 Agent 렌더. q(LLM) 경유 시 chatPjtContext에 선택 PJT 재무 포함 → POST /api/chat"
  - name: 확인 항목 팝업 확인·이동
    steps:
      - "칩의 빨간 숫자공 클릭 → event.stopPropagation()로 선택과 분리 → openHomePjtModal('skon')"
      - "팝업(homePjtModalHtml 1818)에 미처리 항목을 homePjtSlimCard(태그·제목·임팩트·D-day)로 나열"
      - "'원가 조정으로 이동' → closeHomePjtModal() + openCostAdjust('budgetMock')"
  - name: 역할 전환(PM ↔ 팀장)
    steps:
      - "팀장 화면 renderRoleSwitch 버튼 → switchDashboardRole('lead'/'pm') → initDashboard() 재렌더"

# ── 요구사항 후보(FR) ──
requirements:
  - { id: FR-HOME-01, text: "담당자는 첫 화면에서 담당 프로젝트 목록을 확인 필요 건수(To-Do) 많은 순으로 볼 수 있다" }
  - { id: FR-HOME-02, text: "프로젝트 칩 이름을 클릭하면 해당 프로젝트를 대화 문맥으로 선택/해제할 수 있다" }
  - { id: FR-HOME-03, text: "칩의 빨간 숫자공(확인 필요 건수)을 클릭하면 이름 선택과 분리되어 확인항목 팝업이 열린다" }
  - { id: FR-HOME-04, text: "확인항목 팝업은 미처리 항목을 예산 점검/업무 반영으로 구분해 보여주고 원가현황·원가조정 화면으로 이동시킨다" }
  - { id: FR-HOME-05, text: "홈 검색창에 자연어를 입력하면 AI 채팅이 열리고 인텐트에 따라 담당 AI(네비/질문/이상징후/할일)가 답한다" }
  - { id: FR-HOME-06, text: "LLM 질문 시 선택된 프로젝트의 재무·확인항목이 컨텍스트로 전달되어 그 프로젝트 기준으로 답한다" }

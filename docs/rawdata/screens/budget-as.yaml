# rawdata: 원가조정 > A/S Cost 화면 (스토리보드/SRS/버튼로직 생성용 원천 데이터)
# 스키마 규약: 영문 key(안정적 파싱) + 한국어 value. 로직은 file:function 근거 인용.
# 소비: 이 YAML을 AI가 읽어 스토리보드/요구사항명세서/버튼 인벤토리로 변환.
# 근거: 최종 유효본 기준. 상세는 docs/수행원가/계정/AS비.md 참조.

screen:
  id: s-budget-as
  name: 원가조정 - A/S Cost (CATS[4], 하자보수 원가·유형별 행 직접입력)
  menu_path: 수행원가 > 원가조정 > A/S Cost
  route: "#/budget-adjust/as?pj=<프로젝트키>"
  entry: "openCostArea('A/S Cost', pj||'budgetMock') → renderBudgetAccountEditor(data,'A/S Cost')"
  source_files:
    - public/js/budget-area-as.js         # ★A/S Cost 전용 데이터/렌더/데코레이터(주 소스, 모든 로직 집중)
    - public/js/budget-area-routes.js     # #/budget-adjust/as 라우트(:7)
    - public/js/budget-status.js          # CATS(:742), 공통 렌더 파이프라인
    - public/js/budget-status-3.js        # 데코레이터 위임/override 원본
    - public/js/budget-status-4.js        # 데코레이터 위임/override 원본(renderBudgetAccountEditor 등)
  purpose: >
    프로젝트 종료 후 하자보수(A/S) 단계 투입 원가를 계획한다. A/S 프로젝트에 별도로 수립할
    인건비·외주비(예약 인력/공사MA)·재료비·경비를 5개 유형별 행으로 직접 입력하고, 그 합계를
    A/S비 계획 총액(plan[CATS[4]])으로 반영한다. 기본 시드 48,918,351원.
  load_order_note: >
    데코레이터(계정편집기/월별표/집행계획/상세행)는 자기 계정(CATS[4])만 처리하고 나머지는 이전 정의로
    위임하는 체인 패턴. 반드시 budget-status-*.js 전부 뒤에 로드되어야 최종 버전을 감싸며 동작(:4).

# ── 화면 상태 ──
states:
  - id: default
    when: "A/S Cost 계정 진입"
    shows: [상단_월별예산표, 요약카드, 안내문, 5개_편집테이블, "A/S비 계획 저장 버튼"]
  - id: empty-table
    when: "asCostRows[kind].length == 0"
    shows: ["'등록된 데이터가 없습니다.' 행(renderAsCostTable:108)"]
  - id: row-added
    when: "addAsCostRow 후"
    effect: 해당 유형 테이블에 템플릿 행 추가 + 재렌더(요약카드/합계 갱신)
  - id: inline-edit
    when: "셀 인라인 입력"
    effect: "updateAsCostInput in-place 갱신(재렌더 없음). 인건비/외주(예약) 금액 컬럼은 계산 결과 표시(입력 아님)"

# ── 요소(버튼/입력) 인벤토리 ── ★ 버튼 단위 프론트/검증/결과
elements:
  - id: btn-as-add-row
    label: "항목 추가 (유형별 x5: labor/outsourcePeople/outsourceMa/material/expense)"
    type: button
    area: 각 유형 테이블 헤드
    event: onclick
    front:
      handler: "addAsCostRow(kind)"
      file: budget-area-as.js:68
      logic: >
        유형별 템플릿 push 후 renderBudgetPage() 재렌더. 템플릿 기본값 —
        labor{role,grade,unitPrice:0,mm:0,laborAmount:0,indirectAmount:0},
        outsourcePeople{role,contractStatus:'미확정',vendor,grade,unitPrice:0,mm:0},
        outsourceMa/material{major,middle,minor,expectedDate,amount:0}, expense{account,amount:0}.
      state_writes: [asCostRows]
    validation: null
    backend: null
    result: 해당 유형 테이블에 빈 행 추가, 재렌더

  - id: btn-as-remove-row
    label: "삭제"
    type: button
    area: 각 유형 테이블 행
    event: onclick
    front:
      handler: "removeAsCostRow(kind, idx)"
      file: budget-area-as.js:80
      logic: "splice로 제거 후 재렌더. 길이 0 이하면 무시"
      state_writes: [asCostRows]
    result: 행 제거, 요약카드/합계 재계산

  - id: input-as-cell
    label: "셀 인라인 편집 인풋 (as-cost-input)"
    type: input
    area: 각 유형 테이블 셀
    event: oninput
    front:
      handler: "updateAsCostInput(kind, idx, field, value)"
      file: budget-area-as.js:63
      logic: "해당 행/필드 값만 in-place 갱신(재렌더 없음). 존재하지 않는 kind/idx 무시"
      state_writes: [asCostRows]
      input_modes:
        - "금액 컬럼: inputmode='numeric'"
        - "M/M(투입공수): inputmode='decimal'"
        - "예상납기일자: type='date'"
    validation: "asNumber(:36) 콤마 제거 후 Number 변환, 실패 시 0"
    backend: null
    result: >
      값 즉시 반영. 인건비 금액 컬럼=laborAmount+indirectAmount(계산, :128),
      외주(예약) 금액 컬럼=round(unitPrice×mm)(계산, :134) — 입력 불가 표시값.
      (요약카드/합계 행은 다음 재렌더 때 갱신)

  - id: btn-save-as-cost-plan
    label: "A/S비 계획 저장"
    type: button
    area: A/S 패널 하단 액션
    event: onclick
    front:
      handler: saveAsCostPlan()
      file: budget-area-as.js:86
      logic: >
        data=BUDGET_SOURCE[currentBudgetProj]; ensureAsCostPlanAmount(data)로 plan 슬롯 보장 →
        data.plan[CATS[4]]=getAsCostTotal()(5개 유형 총합) → 토스트 'A/S비 계획이 저장되었습니다.' → 재렌더.
      state_writes: ["BUDGET_SOURCE[proj].plan[CATS[4]]"]
    validation: "별도 필수값 검증 없음(빈 값은 asNumber로 0 처리)"
    backend: { note: "asCostRows는 전역 단일 객체(프로젝트별 분리 안됨) — SRS: 프로젝트별 영속화 필요" }
    result: A/S비 계획 총액 = 5개 테이블 합계로 반영, 저장 토스트

  # ── [2026.11.11] Agent 콘솔 A/S Cost 상세 — 직접 수정 (budget-direct-edit.js) ──
  # 예산 수정 방법 3가지(직접 수정 · Agent 제안 반영 · Agent 대화 지시) 중 '직접 수정'을 A/S Cost 에도 제공.
  # 원래 renderAgentAsDetailFinal 은 보기 전용이었고, budget-direct-edit.js 가 재정의해 관리 열 · 등록 버튼 · 입력 팝업을 더함.
  - id: btn-agent-as-add
    label: "＋ A/S {그룹} 등록"
    type: button
    crud: C
    area: "Agent 콘솔 A/S Cost 상세 · 그룹 탭(인건비/외주 인력/재료비/경비) 표 상단"
    event: onclick
    front:
      handler: "bdeAsOpen(group, '')"
      file: "budget-direct-edit.js:bdeAsOpen · bdeAsPanel → 입력 행 변환 budget-inline-edit.js:bieDraftRow · bieFocusRow"
      logic: "[2026.11.11] 팝업 대신 표 맨 위에 입력 행을 추가한다(budget-inline-edit.js:bieDraftRow). 입력 행을 연다. 인건비 · 외주 인력은 수량(MM) × 단가, 재료비 · 경비는 금액 직접 입력. 직책자 화면 · 과거 확정 버전 조회 중에는 숨김"
      state_writes: [bdeAsEdit]
    validation: null
    backend: null
    result: "표 맨 위에 입력 행 추가(누를 때마다 한 행씩 더 쌓이고 입력값 유지) — 화면이 아래로 내려가 있어도 그 행으로 올라가 첫 칸에 커서"

  - id: btn-agent-as-savebar
    label: 저장
    type: button
    crud: U
    area: "A/S Cost 표 상단 버튼 줄 맨 오른쪽([＋ 등록] 옆)"
    event: onclick
    front:
      handler: "bieSaveAll()"
      file: "budget-inline-edit.js:bieAddSaveButton · bieSaveAll → bieSaveDrafts"
      logic: "[2026.11.12] 일반 표처럼 추가 · 수정 · 삭제 모두 이 버튼을 눌러야만 반영된다(행별 저장 없음 — 저장 전까지 [예산 조정안] 기록 · API 호출 없음). 삭제 예정이 있으면 확인창 1번. 추가 · 수정을 먼저 저장하고 삭제는 그다음(순번이 밀리지 않게 화면 아래 행부터). 화면의 입력 행(등록 · 수정)을 위에서부터 차례로 원래 저장 함수로 저장한다(버튼에 입력 행 수 표시). 검증에 걸린 행에서 멈추고 그 행을 빨갛게 표시하며, 나머지 행은 입력값 그대로 남긴다. 열린 행이 없으면 흐리게 보이고, 누르면 안내 토스트. 직책자 화면 · 과거 확정 버전 조회 중에는 숨김"
      validation: "열린 입력 행이 없으면 '저장할 입력 행이 없습니다. [＋ 등록]이나 [수정]을 먼저 눌러 주세요.' 토스트 · 그 밖의 검증은 원래 저장 함수와 같음"
      state_writes: [BIE_DRAFTS, BIE_DELS]
    backend: null
    result: "추가 · 수정 · 삭제 일괄 반영 + [예산 조정안] 수기 입력 반영 + 토스트"

  - id: btn-agent-as-edit
    label: 수정
    type: button
    crud: N
    area: "A/S Cost 상세 표 관리 열"
    event: onclick
    front:
      handler: "bdeAsOpen(group, key)"
      file: "budget-direct-edit.js:bdeAsOpen → budget-inline-edit.js:bieDraftRow"
      logic: "[2026.11.11] 팝업 대신 그 행의 칸이 바로 입력칸으로 바뀐다(budget-inline-edit.js:bieDraftRow). 해당 항목 값을 채운 수정 입력 행 오픈"
      state_writes: [bdeAsEdit]
    validation: null
    backend: null
    result: "그 행에서 바로 수정(입력칸으로 바뀜 · 여러 행 동시 수정 가능) · Enter 저장 · Esc 취소"

  - id: btn-agent-as-save
    label: "등록 / 수정 저장"
    type: button
    crud: U
    area: "A/S 입력 행 → 표 위 [저장](입력 행 일괄)"
    event: onclick
    front:
      handler: "bdeAsSave()"
      file: "budget-direct-edit.js:bdeAsSave"
      logic: >
        항목을 등록하거나 고친다. 수정 전 대비 금액 변동을 사용자가 고른 [반영 월]에 남기고
        agentHandRecordFinal('A/S Cost','A/S {그룹}',…)로 [예산 조정안]에 ✎ 수기 입력 조정안을 만들어 바로 [반영] 상태로 둔다.
        표에는 '수기 입력(결재전)' 배지와 변동 금액을 표시. 승인된 실행예산은 결재 후 바뀐다.
      state_writes: [BDE_AS, AGENT_PROPOSALS_FINAL, AGENT_HAND_EDITS_FINAL, agentMiniSelFinal]
    validation: "항목 필수 · 금액(또는 수량 × 단가) 0 초과 · 반영 월 필수 — 어기면 토스트"
    backend: null
    result: "표 반영 + [예산 조정안] 수기 입력 조정안 + 토스트"

  - id: btn-agent-as-delete
    label: 선택삭제
    type: button
    crud: D
    area: "A/S Cost 표 상단 [＋ 등록] 왼쪽 (행 맨 앞 체크박스로 고름)"
    event: onclick
    front:
      handler: "bieDeleteChecked(scope, false)"
      file: "budget-inline-edit.js:bieDeleteChecked → 행마다 bdeAsDelete(group, key) (budget-direct-edit.js:bdeAsDelete)"
      logic: "[2026.11.12] 누르면 바로 지우지 않고 체크한 행을 '삭제 예정'(취소선 · 맨 앞 [↺] 되돌리기)으로만 표시한다. 실제 삭제는 표 위 [저장]을 눌렀을 때 추가 · 수정을 먼저 저장한 뒤 화면 아래 행부터 원래 함수로 처리한다. [2026.11.11] 행마다 있던 [삭제] 대신, 체크한 행을 확인창 1번 뒤 뒤에서부터 원래 삭제 함수 bdeAsDelete(group, key) 로 차례로 지운다(건별 검증 · [예산 조정안] 수기 입력 기록은 원래 함수 그대로). 원래 규칙: 확인 후 삭제. 수기 등록 항목은 목록에서 빠지고, 기존 항목은 금액 0 · '수기 입력(결재전)'으로 남는다. 감소분은 이번 달에 잡는다"
      state_writes: [BDE_AS, AGENT_PROPOSALS_FINAL, AGENT_HAND_EDITS_FINAL]
    validation: "confirm 확인 · 체크한 행이 없으면 '삭제할 행을 체크해 주세요.' 토스트"
    backend: null
    result: "'삭제 예정' 표시 → [저장] 시 반영 + 토스트"

  - id: chk-agent-as-row
    label: "행 선택 체크박스 / 머리 전체 선택"
    type: checkbox
    crud: N
    area: "A/S Cost 표 맨 앞 열(수기 삭제한 행은 [삭제 취소]만)"
    event: onclick
    front:
      handler: "bieCheckAll(this, scope)"
      file: "budget-inline-edit.js:bieAddChecks · bieCheckAll"
      logic: "삭제할 수 있는 행에만 체크박스가 생긴다(실적이 생긴 · 조회 전용 행은 빈칸). 머리 체크박스는 같은 표의 행을 모두 선택/해제한다. 체크 상태는 화면에만 있고 다시 그리면 풀린다"
      validation: null
      state_writes: []
    backend: null
    result: "선택 표시 — [선택삭제]가 체크한 행을 지움"

  - id: btn-agent-as-undo-del
    label: "↺ (삭제 취소)"
    type: button
    crud: N
    area: "'삭제 예정' 행 맨 앞(체크박스 자리)"
    event: onclick
    front:
      handler: "bieUndoDel(id)"
      file: "budget-inline-edit.js:bieUndoDel"
      logic: "저장 전 삭제 예정 표시를 풀고 원래 행으로 되돌린다(아무것도 반영되지 않은 상태)"
      validation: null
      state_writes: [BIE_DELS]
    backend: null
    result: "삭제 예정 해제"

  - id: btn-agent-as-restore
    label: 삭제 취소
    type: button
    crud: N
    area: "A/S Cost 상세 표 관리 열(수기 삭제한 기존 항목)"
    event: onclick
    front:
      handler: "bdeAsRestore(group, key)"
      file: "budget-direct-edit.js:bdeAsRestore"
      logic: 수기 삭제한 기존 항목을 되살리고 금액을 조정안에 다시 더함
      state_writes: [BDE_AS, AGENT_PROPOSALS_FINAL, AGENT_HAND_EDITS_FINAL]
    validation: null
    backend: null
    result: 항목 복원 + 토스트

  - id: btn-agent-as-close
    label: "취소"
    type: button
    crud: N
    area: "표 안 입력 행 [취소] / Esc"
    event: onclick
    front:
      handler: "bdeAsClose()"
      file: "budget-direct-edit.js:bdeAsClose"
      logic: "입력 행 닫기(입력값 버림). 입력 행에서 Esc 를 눌러도 같다(budget-inline-edit.js:bieKey) — 입력 중인 값은 버리고 아무것도 반영되지 않음"
      state_writes: [bdeAsEdit]
    validation: null
    backend: null
    result: 입력 행 닫힘

  - { id: input-bde-as-name,  label: 항목, type: input(text), crud: C, area: A/S 입력 행, front: { handler: null, file: "budget-direct-edit.js:bdeAsPanel", logic: 필수 } }
  - { id: input-bde-as-sub,   label: 구분, type: input(text), crud: C, area: A/S 입력 행, front: { handler: null, file: "budget-direct-edit.js:bdeAsPanel", logic: "자유 입력(예: 직급)" } }
  - { id: input-bde-as-qty,   label: "수량(MM)", type: input(numeric), crud: C, area: "A/S 입력 행(인건비 · 외주 인력)", front: { handler: "bdeAsCalc()", file: "budget-direct-edit.js:bdeAsCalc", logic: 입력 시 금액 자동 계산 } }
  - { id: input-bde-as-unit,  label: "단가(원/MM)", type: input(numeric), crud: C, area: "A/S 입력 행(인건비 · 외주 인력)", front: { handler: "bdeAsCalc()", file: "budget-direct-edit.js:bdeAsCalc", logic: 입력 시 금액 자동 계산 } }
  - { id: input-bde-as-amt,   label: "금액(원)", type: input(numeric), crud: C, area: "A/S 입력 행", front: { handler: null, file: "budget-direct-edit.js:bdeAsPanel", logic: "재료비 · 경비는 직접 입력, 인건비 · 외주 인력은 수량 × 단가 자동(읽기 전용)" } }

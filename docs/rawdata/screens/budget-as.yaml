      - "계정 선택 복귀는 브라우저 뒤로가기"

# ── 요구사항 후보(FR) — AS비.md §10 재사용 ──
requirements:
  - { id: FR-AS-01, text: "A/S비 계정은 인건비/외주(예약 인력)/외주(공사·MA)/재료/경비 5개 유형별 행을 각각 추가·수정·삭제할 수 있어야 한다" }
  - { id: FR-AS-02, text: "인건비 유형의 금액은 인건비금액+간접비금액, 외주(예약 인력) 금액은 단가×투입공수(M/M) 반올림으로 자동 계산·표시되어야 한다" }
  - { id: FR-AS-03, text: "각 유형 테이블은 건수 배지와 유형별 합계 행을 표시하고, 상단 요약 카드는 인건비/외주비(예약+공사MA 합산)/재료비/경비/총합계를 표시해야 한다" }
  - { id: FR-AS-04, text: "[A/S비 계획 저장] 시 5개 유형 총합을 프로젝트 계획 총액(plan[CATS[4]])에 반영하고 저장 피드백을 제공해야 한다" }
  - { id: FR-AS-05, text: "금액 입력은 콤마 포함 문자열을 허용하되 숫자로 정규화해 합산해야 한다(asNumber)" }
  - { id: FR-AS-06, text: "외주/재료 유형은 대·중·소분류와 예상납기일자를, 외주(예약 인력) 유형은 협력업체 확정여부·협력업체·직급을 관리해야 한다" }
  - { id: FR-AS-07, text: "집행계획 목록과 계정 상세(비중: 인건비 .56/외주 .23/재료 .05/경비 .16)에 A/S Cost가 자동 편입되어야 한다" }
  - { id: FR-AS-08, text: "(검토 필요) 무상하자보증 유무/보증기간과 A/S비 산정의 연동 여부 — 현재 목업은 미연동. 실제 요건에서 무상 구간 원가 처리 규칙 정의 필요" }
  - { id: FR-AS-09, text: "(개선) asCostRows가 전역 단일 객체로 프로젝트별 분리 저장이 안 됨 — 프로젝트별 A/S 원가 데이터 영속화 필요" }
  - { id: FR-AS-10, text: "[2026.11.11] Agent 화면의 A/S Cost 상세에서도 그룹별 항목을 직접 등록·수정·삭제할 수 있어야 하며, 저장 내용은 [예산 조정안]에 수기 입력 조정안으로 올라가 결재 후 반영되어야 한다" }
  - { id: FR-AS-11, text: "A/S Cost 등록·수정 입력 행에서 변동 금액을 반영할 월을 고를 수 있어야 한다" }
  - { id: FR-AS-12, text: "[2026.11.11] Agent 화면 A/S Cost 상세의 등록은 팝업이 아니라 표 맨 위에 입력 행을 추가하는 방식이어야 하며, 화면이 아래로 내려가 있어도 그 행으로 올라가 첫 칸에 커서가 있어야 한다" }
  - { id: FR-AS-13, text: "Agent 화면 A/S Cost 상세의 수정은 팝업 없이 그 행의 칸에서 바로 할 수 있어야 한다(Enter 저장 · Esc 취소)" }
  - { id: FR-AS-14, text: "Agent 화면 A/S Cost 상세의 삭제는 행 맨 앞 체크박스로 여러 건을 골라 표 위 [선택삭제]로 한 번에 할 수 있어야 하며, 실적이 생긴 건은 체크할 수 없어야 한다" }
  - { id: FR-AS-15, text: "Agent 화면 A/S Cost 상세는 표 위 [저장] 버튼으로 열려 있는 입력 행(등록 · 수정)을 저장할 수 있어야 하며, 열린 행이 없으면 저장 버튼이 흐리게 보여야 한다" }
  - { id: FR-AS-16, text: "Agent 화면 A/S Cost 상세는 입력 행을 여러 개 동시에 추가 · 수정할 수 있어야 하며, 다른 행을 추가하거나 화면이 다시 그려져도 입력 중인 값이 유지되어야 한다" }
  - { id: FR-AS-17, text: "[2026.11.12] Agent 화면 A/S Cost 상세의 등록 · 수정은 표 위 [저장]을 눌렀을 때만 한 번에 반영되어야 하며, 입력 행마다 따로 저장(등록 API 호출)하지 않아야 한다" }
  - { id: FR-AS-18, text: "[2026.11.12] Agent 화면 A/S Cost 상세의 선택삭제는 바로 반영하지 않고 '삭제 예정'으로 표시해야 하며(되돌리기 가능), 표 위 [저장]을 눌렀을 때 추가 · 수정과 함께 한 번에 반영되어야 한다" }

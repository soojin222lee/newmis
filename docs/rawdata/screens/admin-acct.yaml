# rawdata: 관리자 > 계정과목 조회 (스토리보드/SRS/버튼로직 생성용 원천 데이터)
# 스키마 규약: 영문 key(안정적 파싱) + 한국어 value. 로직은 file:function 근거 인용.
# [2026.11.27 남주] AS-IS 관리자(base-front) 화면을 옮긴 메뉴. 공통 코드는 public/js/admin-asis.js

screen:
  id: s-admin-acct
  name: 계정과목 조회
  menu_path: "관리자 > 기준정보 관리 > [계정과목] 탭"
  route: "/admin.html#base (옛 주소 #acct 로 와도 이 탭으로 열림)"
  entry: "adminGo('base') → amgTab('base', 탭) → admSectionBody → amgBody → AAS_RENDER.acct"
  data_source: "ERP 계정과목 연동 (조회 전용)"
  asis_source: "base-front src/views/admin/accountTitle/AccountTitleManagement.vue"
  source_files:
    - public/js/admin-asis.js   # 메뉴 등록(ADMIN_SECTIONS) · admSectionBody 데코레이터 · 렌더 · 핸들러 · 목업 데이터(AAS_DEF) · 전용 CSS(.aas-*)
    - public/js/admin-menu-group.js # 메뉴 11개 묶음 · 묶음 안 탭(amgTab) · 옛 주소 연결
    - public/js/admin.js        # 관리자 사이트 셸 · admModal · admToast — 수정하지 않음
    - public/admin.html         # admin-asis.js 로드(admin-approval.js 다음)
  purpose: >
    ERP 계정과목과 수행원가 계정 묶음(CI)을 조회한다. 실적이 어느 원가 계정으로 잡히는지 확인하는 기준.
  asis_diff: "AS-IS 의 그리드 행추가 · 바로 입력 · 행삭제 후 [저장] 방식을 목업 공통 방식(등록/수정 팝업 · 행별 삭제 확인)으로 바꿈. 페이지 이동(페이징)은 목업 건수가 적어 뺌"

elements:
  - { id: rdo-acct-type, label: "조회 구분 (계정코드 / 계정명)", type: radio, crud: N, area: "조회 조건", event: onclick,
      front: { handler: "aasSetDraft('acct','_type',필드)", file: "admin-asis.js:aasSetDraft", logic: "조회할 칸 선택(AS-IS 라디오와 같음). [조회]를 눌러야 적용" }, backend: null, result: "조회 조건 입력값" }
  - { id: inp-acct-q, label: "검색어", type: input, crud: R, area: "조회 조건", event: onclick,
      front: { handler: "aasSetDraft('acct','_q',값) · Enter=aasSearch('acct')", file: "admin-asis.js:aasSetDraft", logic: "고른 칸에 검색어가 들어간 줄만 찾음(대소문자 무시)" }, backend: null, result: "조회 조건 입력값" }
  - { id: btn-acct-reset, label: "초기화", type: button, crud: N, area: "조회 조건", event: onclick,
      front: { handler: "aasReset('acct')", file: "admin-asis.js:aasReset", logic: "조회 조건 · 선택 줄을 비우고 다시 그림" }, backend: null, result: "전체 목록" }
  - { id: btn-acct-search, label: "조회", type: button, crud: R, area: "조회 조건", event: onclick,
      front: { handler: "aasSearch('acct')", file: "admin-asis.js:aasSearch", logic: "입력한 조건을 적용(aasApplied)해 표를 다시 그림" }, backend: null, result: "검색결과 N건 / 총 M건" }
  - { id: grid-acct, label: "목록 표 (No · 계정코드 · 계정명 · 중계정명 · CI명)", type: grid, crud: R, area: "본문 표", event: onclick,
      front: { handler: "aasTableHtml('acct')", file: "admin-asis.js:aasTableHtml", logic: "조회 조건에 맞는 줄. 검색결과 건수 / 총 건수 표시. 조회 전용" }, backend: null, result: "목록" }

requirements:
  - { id: FR-ACT-01, text: "사용자는 계정코드 또는 계정명으로 계정과목을 조회할 수 있어야 한다" }
  - { id: FR-ACT-02, text: "목록은 계정코드 · 계정명 · 중계정명 · CI명을 보여야 한다" }
  - { id: FR-ACT-03, text: "CI명은 수행원가 계정(인건비 · 외주비 · 재료비 · 경비 · A/S비) 묶음으로 보여야 한다" }
  - { id: FR-ACT-04, text: "계정과목은 ERP 값으로 조회만 가능해야 한다" }
  - { id: FR-ACT-05, text: "검색결과 건수와 총 건수를 보여야 한다" }

# ── 대표 플로우 ──
flows:
  - name: 계정 편집 + 예산 이관 + 결재
    steps:
      - "'원가조정' 메뉴 → #/budget-adjust → 목록 (딥링크 ?pj= 또는 /labor 등 계정 슬러그 바로 진입 가능)"
      - "프로젝트 선택 → openBudgetProjectScreen(k) → 계정별 작성(edit) 스테퍼 진입"
      - "계정 타일 클릭 → 계정별 편집기에서 상세 계획 수정 → 임시저장"
      - "예산 집행 현황 테이블 '예산 이관 수정' → 조정배분 입력 → 저장 → (총액 일치·하한·경비한도·ERP가용성 통과 시) 새 버전 적재"
      - "스테퍼 '결재' → 버전 diff 확인 → 결재요청(작성중 버전만) → 상태 승인요청/결재중"
      - "총액 변경 필요 시 AI PMO Cost 재산정 안내로 이탈"

# ── 요구사항 후보(FR) ──
requirements:
  - { id: FR-BAD-01, text: 원가조정은 #/budget-adjust(및 계정별 /labor·/outsource·/material·/expense·/as, ?pj=) 딥링크로 진입할 수 있어야 한다 }
  - { id: FR-BAD-02, text: 진입 시 계정별 작성 스테퍼(이력 → 계정별 작성 → 결재)로 열려야 한다 }
  - { id: FR-BAD-03, text: 사용자는 5대 계정 타일에서 계정을 선택해 계정별 상세 계획을 편집할 수 있어야 한다 }
  - { id: FR-BAD-04, text: PM은 계정 간 예산을 이관할 수 있으며, 저장 시 총액은 불변이어야 한다(조정배분 합계 = 총액) }
  - { id: FR-BAD-05, text: 각 계정의 조정배분은 실집행+투입확정 금액 미만으로 설정할 수 없어야 한다 }
  - { id: FR-BAD-06, text: 경비 계정 조정배분은 ERP 가용 한도를 초과하거나 가용성 검증에 실패하면 저장을 거부해야 한다 }
  - { id: FR-BAD-07, text: 예산 이관 저장 시 변경 내역(계정별 변경 전/후/증감)을 버전으로 기록하고 로컬 영속화해야 한다 }
  - { id: FR-BAD-08, text: 총 Cost 변경은 이 화면에서 불가하며 AI PMO Cost 재산정으로 안내해야 한다 }
  - { id: FR-BAD-09, text: 작성중 버전만 결재요청이 가능하며, 결재라인(기안자→팀장)과 버전 diff 써머리를 제공해야 한다 }
  - { id: FR-BAD-10, text: "Agent ON 화면에서 계정 상세에 들어가면 Agent와 대화하기 칸을 접고 펼칠 수 있어야 한다" }
  - { id: FR-BAD-11, text: "Agent ON 화면의 계정 상세에서도 예산 조정안을 펼쳐 보며 반영·기안할 수 있어야 한다" }
  - { id: FR-BAD-12, text: "Agent ON 화면에서 계정 상세에 들어가면 계정색 강조로 프로젝트 메인 화면과 구분되어야 하며, [← 프로젝트 메인]으로 한 번에 돌아갈 수 있어야 한다" }
  - { id: FR-BAD-13, text: "Agent ON 화면의 모든 계정 상세에서 [월별 계획/실적 보기] 팝업으로 상세계정별 계획·실적·미집행과 월별 금액을 볼 수 있어야 한다" }
  - { id: FR-BAD-14, text: "메인에서 계정 상세로 들어가면 예산 조정안과 Agent와 대화하기가 모두 접힌 상태로 열려야 한다(계정 상세를 넓게)" }

  - { id: FR-BAD-32, text: "[2026.11.16] 계정 상세는 위쪽 요약을 그대로 두고 아래를 2칸(왼쪽 상세 예산내역 · 오른쪽 탭 [예산 조정안 · Agent와 대화])으로 보여야 하며, 칸 사이 경계선을 끌어 폭을 자유롭게 조절하고(최소: 오른쪽 280px · 상세 560px) 끝까지 밀어 접을 수 있어야 한다" }
  - { id: FR-BAD-33, text: "[2026.11.16] 예산 조정안 카드는 첫 화면에서 계정 · 금액 · 한 줄 제목 · [반영]만 보여야 하며, 날짜 · Agent 제안 표시 · 근거 · 삭제 · 1안/2안 고르기는 [자세히]로 펼쳐 볼 수 있어야 한다" }
  - { id: FR-BAD-34, text: "[2026.11.16] 프로젝트 메인도 2칸(왼쪽 예산 조정안 · 오른쪽 Agent와 대화)으로 보여야 하며, 오른쪽 칸은 메인과 계정 상세에서 같은 자리 · 폭 · 높이를 유지해 계정을 오가도 왼쪽만 바뀌어야 한다" }
  - { id: FR-BAD-35, text: "[2026.11.16] 예산 조정안 카드는 반영했을 때의 영향(그 계정 CP 여유 · 한도 초과액 · 이관 방향)을 한 줄로 보여 줘야 한다" }
  - { id: FR-BAD-36, text: "[2026.11.17] 월별 계획/실적 팝업은 시작 월 ~ 끝 월(일 제외)을 골라 그 기간의 월별 계획/실적과 기간 합계를 조회할 수 있어야 한다" }
  - { id: FR-BAD-37, text: "[2026.11.19] 월별 계획/실적 팝업에서 지난 달 실적 금액을 누르면 새 팝업을 띄우지 않고 같은 팝업 안에서 그 달 실적 상세를 볼 수 있어야 하며, [← 월별 표로]로 보던 표(보기 · 단위 · 스크롤 그대로)로 돌아갈 수 있어야 한다" }
  - { id: FR-BAD-38, text: "[2026.11.19] 수행원가 화면의 팝업은 오른쪽 위 ✕ 하나로 닫을 수 있어야 하며, ✕ 와 같은 일을 하는 [닫음] · [닫기] 버튼은 함께 두지 않아야 한다(✕ 가 없는 팝업은 닫기 버튼 유지 — budget-design-d.js:ddHidePopClose)" }
  - { id: FR-BAD-39, text: "[2026.11.19] 원가조정 화면은 핵심(계정 탭 · 예산 조정안 카드 · 상세 표)만 늘 보여 주고, 가끔 쓰는 기능(전부 해제 · 전체 펼치기 · 엑셀 다운로드 · 이력)은 [⋯] 더보기 메뉴로, 인력 투입 일정은 접어 두었다가 펼쳐 볼 수 있어야 하며, 예산 조정안은 '반영한 것만 보기' 체크 하나로 거를 수 있어야 한다" }
  - { id: FR-BAD-42, text: "[2026.11.20] 계정 상세 표에서 등록 · 수정할 때는 그 줄 자리에 표 폭 전체를 쓰는 편집 칸(칸마다 이름표 · 넉넉한 입력칸, 머리에 '새 항목 · 추가 중' / '○○ 수정 · 수정 중' + [취소])이 열려야 하며, 여러 줄을 동시에 고치고 표 위 [저장] 한 번에 반영하는 흐름은 그대로여야 한다(budget-inline-edit.js:biePanelize — 경비 편성 · 외주비 구매계획 카드는 각자 모양)" }
  - { id: FR-BAD-41, text: "[2026.11.20] 예산 조정안 카드는 계정 · 제목 · 금액 · [반영]과 함께 근거 한 줄(출처 + 핵심 숫자)을 늘 보여 주어야 하며, 판단 이유 · 영향은 [자세히 ▾]를 눌렀을 때만 보여야 한다. 자주 쓰지 않는 [삭제]는 [⋯] 안에 두어야 한다" }
  - { id: FR-BAD-40, text: "[2026.11.19][E안] Agent와 대화는 상단 [✦ AI에게 물어보기]로 오른쪽 사이드바에서 볼 수 있어야 하며(창이 좁으면 화면 위에 덮어서), 아이콘으로 옮길 수 있는 창으로 띄웠다가 ✕로 다시 사이드바로 돌아올 수 있어야 하고, 계정 탭이나 다른 메뉴 화면으로 옮겨도 꺼지지 않아야 한다" }
  - { id: FR-BAD-31, text: "[2026.11.12] 계정 상세의 입력 행(등록 · 수정)은 만든 탭(계정 + 상세계정 탭, 경비는 연도)에서만 보여야 하며, 다른 탭으로 옮기면 숨었다가 돌아오면 다시 보여야 한다. 저장 단위는 상세계정 탭마다(경비만 연도 탭을 한 번에 저장 — 다른 계정의 저장 단위는 논의 중)" }

    - { name: BUDGET_ACCT_LABELS, file: "budget-status.js:1243", note: "이관 대상 4계정 ['인건비','외주비','재료비','경비'] (A/S는 타일 5번째로 표시)" }
    - { name: "budgetTransferHistory[projKey][]", file: "budget-status.js:1279~1311", note: "{version,changedAt,changedBy,changes:[{acct,oldAdjusted,newAdjusted,diff,transfer}]}" }

# rawdata: 수행원가 > 원가조정 화면 (스토리보드/SRS/버튼로직 생성용 원천 데이터)
# 스키마 규약: 영문 key(안정적 파싱) + 한국어 value. 로직은 file:function 근거 인용.
# 소비: 이 YAML을 AI가 읽어 스토리보드/요구사항명세서/버튼 인벤토리로 변환.
# 주의: 렌더러는 budget-status.js + budget-status-2~5.js 5분할이며 동일 함수를 여러 번 override.
#       계정별 상세 편집기는 budget-area-*.js(데코레이터 체인)가 최종 소유자 — 여기선 공통 흐름 위주.

screen:
  id: s-budget            # 수행원가 3개 소메뉴 공유 화면(공유 렌더러 renderBudgetPage)
  name: 수행원가 > 원가조정 (실행예산 편집·수립·이관)
  menu_path: 수행원가 > 원가조정
  route: "#/budget-adjust"
  cost_mode: adjust
  entry: "showCostAdjust() → costMode='adjust'; showBudget()  /  openCostAdjust(k) → openBudgetProjectScreen(k)"
  source_files:
    - public/js/budget-cost-adjust.js  # 원가조정 진입점 + 라우트 등록
    - public/js/budget-area-routes.js  # 계정 슬러그 매핑/라우트, openCostArea
    - public/js/budget-status.js       # 이관 상태·검증(saveBudgetTransfer 등)·budgetTransferHistory·getBudgetAdjusted
    - public/js/budget-status-3.js     # renderAccountTransferTable·renderAcctTile·openBudgetAccountEditor·renderTotalBudgetBar·최종 renderBudgetPage
    - public/js/budget-status-4.js     # 스테퍼/스테이지·버전 스냅샷·결재(requestExecBudgetApprovalFinal·renderExecBudgetApprovalSummaryFinal)
    - public/js/budget-status-5.js     # openBudgetProjectScreen override(adjust → budgetSetupStage='edit')
    - public/js/budget-area-labor|outsource|material|expense|as.js  # 계정별 편집기 최종 구현(별도 문서)
    - public/js/app.js                 # SCREEN_ROUTES['s-budget'](계정 슬러그 한 뎁스 더)
  purpose: >
    프로젝트 실행예산을 편집·수립·이관한다. 두 축: (1) 5대 계정 타일에서 계정 선택 → 계정별 편집기,
    (2) 예산 이관(계정 간 금액 이동, 총액 불변·하한 검증). 이력→계정별 작성→결재 3단계 스테퍼.

# ── 진입/딥링크(양방향) ──
routing:
  cost_mode: adjust
  list_entry:    "showCostAdjust() (budget-cost-adjust.js:8)"
  project_entry: "openCostAdjust(k) → openBudgetProjectScreen(k) (budget-cost-adjust.js:10)"
  route_action:  "ROUTE_ACTIONS['budget-adjust'] (budget-cost-adjust.js:14~18)"
  deeplink_project: "#/budget-adjust?pj=<프로젝트키>"
  deeplink_account: "#/budget-adjust/<slug>?pj=<프로젝트키>"
  account_slugs: "BUDGET_AREA_SLUGS(budget-area-routes.js:13): 인건비=labor·외주비=outsource·재료비=material·경비=expense·'A/S Cost'=as (역매핑 BUDGET_AREA_BY_SLUG)"
  url_to_screen: >
    ?pj= 있으면 costMode='adjust' 후 openBudgetProjectScreen(pj)로 edit 진입, 없으면 목록(budget-cost-adjust.js:15~17).
    계정 슬러그 라우트는 budget-area-routes.js:37~44가 openCostArea(계정,pj) 등록 → openBudgetProjectScreen 후
    openBudgetAccountEditor(account)(budget-area-routes.js:30~34).
  screen_to_url: >
    SCREEN_ROUTES['s-budget'](app.js:49~62): costMode==='adjust'이면 base='budget-adjust',
    budgetSetupEditAccount 선택 시 BUDGET_AREA_SLUGS[acc]를 한 뎁스 더 붙여 'budget-adjust/<slug>',
    상세면 '?pj='+currentBudgetProj 부착. → URL↔화면 양방향 일치.

# ── 화면 상태 ── costMode(adjust) × budgetScreenView × budgetSetupStage
states:
  - id: list
    when: "costMode=='adjust' && budgetScreenView=='list'"
    renderer: "renderBudgetListView (budget-status-3.js:1791)"
    shows: [EXEC_BUDGET_PROJECTS 목록 + 필터]
    url: "#/budget-adjust"
  - id: edit_stage      # 원가조정 고유 진입 기본
    when: "budgetScreenView=='detail' && budgetSetupStage=='edit'"
    renderer: "renderBudgetSetupOverview (budget-status-4.js:1634~)"
    shows: [총액 KPI 바, 3단계 스테퍼, 5대 계정 타일, 선택 계정 확장 편집기, 임시저장·결재 상신]
    url: "#/budget-adjust?pj=<key> (계정 선택 시 /<slug> 추가)"
    note: "openBudgetProjectScreen에서 costMode==='adjust'이면 budgetSetupStage='edit'(budget-status-5.js:76). 요약 그리드로 넘어가지 않음"
  - id: history_stage
    when: "budgetSetupStage=='history'"
    renderer: "renderBudgetSetupOverview history 분기 (budget-status-4.js:1650~)"
    shows: [실행예산 버전 목록 V1/V2/V3, 선택 버전 상세, ＋ 신규 버전 생성]
    note: "상세는 변경이력 문서(budget-history.yaml) 참조"
  - id: approval_stage
    when: "budgetSetupStage=='approval'"
    renderer: "renderBudgetSetupOverview approval 분기 (budget-status-4.js:1679~)"
    shows: [결재라인(기안 이봄 → 팀장 김도윤), 버전 diff 써머리(renderExecBudgetApprovalSummaryFinal :1489), 결재요청]
  - id: transfer_table
    when: "budgetDetailStep=='overview' (계정별 이관 테이블 영역)"
    renderer: "renderAccountTransferTable (최종 유효본 budget-status-3.js:2160)"
    shows: [계정별 초기배분/이관/조정배분/실집행/투입확정/투입미정, 예산 이관 수정 버튼]
  - id: transfer_edit
    when: "budgetTransferEditMode==true"
    effect: "조정배분 셀이 입력 필드(actr-adjust-<idx>)로 전환(budget-status-3.js:2177~2179)"

# ── 요소(버튼/타일/입력) 인벤토리 ── ★ 프론트/백엔드 로직
elements:
  - id: row-project-open
    label: 프로젝트 목록 행 클릭
    type: row(clickable)
    area: 프로젝트 목록
    event: onclick
    front:
      handler: "openBudgetProjectScreen('${p.key}')"
      file: "budget-status-3.js:1815 / budget-status-5.js:71~92"
      logic: "costMode==='adjust'이므로 budgetSetupStage='edit'로 진입(budget-status-5.js:76)"
      state_writes: [currentBudgetProj, budgetScreenView, budgetSetupStage]
    backend: null
    result: 선택 프로젝트 계정별 작성(edit) 스테퍼 진입 + URL ?pj= 갱신
  - id: tile-account-select
    label: 계정 타일 선택 (인건비·외주비·재료비·경비·A/S비)
    type: button(tile)
    area: 계정별 작성 스테이지
    event: onclick
    front:
      handler: "openBudgetAccountEditor(key)"
      file: "budget-status-3.js:1549 (타일 renderAcctTile :1563)"
      logic: "budgetSetupEditAccount=key 세팅 → 선택 계정 아래 renderBudgetAccountEditor(viewData, account) 확장 노출"
      state_writes: [budgetSetupEditAccount]
    backend: null
    result: "계정별 상세 편집기(원가조정 5대계정 편집기) 진입. URL에 /<slug> 한 뎁스 추가. 상세 로직은 budget-area-*.js 소관"
  - id: stepper-goto-stage
    label: 3단계 스테퍼 (1 이력 · 2 계정별 작성 · 3 결재)
    type: button(stepper)
    area: 상세 상단
    event: onclick
    front:
      handler: "goBudgetSetupStage(stage)"
      file: "budget-status-4.js:1537 (스테퍼 renderBudgetFlowStepperFinal :1559)"
      state_writes: [budgetSetupStage]
    result: history/edit/approval 스테이지 전환
  - id: btn-transfer-edit
    label: 예산 이관 수정
    type: button(toggle)
    area: 예산 집행 현황(이관) 테이블
    event: onclick
    front:
      handler: "startBudgetTransferEdit() / cancelBudgetTransferEdit()"
      file: "budget-status.js:1328 / :1333"
      logic: "budgetTransferEditMode 전환 → 조정배분 셀을 입력 필드로 렌더"
      state_writes: [budgetTransferEditMode]
    result: 이관 편집 모드 진입/취소
  - id: btn-transfer-save
    label: 예산 이관 저장
    type: button
    area: 예산 집행 현황(이관) 테이블 (편집 모드)
    event: onclick
    front:
      handler: "saveBudgetTransfer()"
      file: "budget-status.js:2296 (최종 유효 override) · 초기 정의 :1338"
      logic: >
        각 계정 입력값(actr-adjust-<idx>)을 parseBudgetAmount로 읽어 nextAdjusted 산출 →
        검증 통과 시 data.transfer[acct]=newAdjusted−plan[acct] 반영 →
        budgetTransferHistory[proj] 새 버전 unshift(version=기존+1, changedAt=현재시각, changedBy=PM, changes[]) →
        budgetHistorySelectedVersion 최신 갱신 → persistBudgetTransferState() → 토스트 → renderBudgetPage()
      validation:
        - "총액 불변: Σ nextAdjusted === Σ plan(총액) 아니면 거부 — '조정배분 합계는 총액 …원과 같아야 합니다.'(budget-status.js:2312~2315)"
        - "하한(한도): 각 계정 nextAdjusted ≥ actual+quasi(실집행+투입확정) 아니면 거부 — '… 조정배분은 실적+투입확정 금액보다 작게 설정할 수 없습니다.'(:2317~2321)"
        - "경비 한도(최종본 추가): nextAdjusted['경비'] ≤ getExpenseTransferLimit() (ERP 가용 한도 초과 시 거부, :2323~2327)"
        - "경비 ERP 가용성(최종본 추가): validateExpenseErpAvailability().ok 아니면 거부(:2329~2333)"
        - "변경 없음: changes.length==0이면 '변경된 예산 이관 내역이 없습니다.'(:2347~2350)"
      state_writes: [data.transfer, budgetTransferHistory, budgetHistorySelectedVersion, budgetTransferEditMode]
    backend: "없음(목업). 영속화 localStorage['budgetTransferState'] (persistBudgetTransferState budget-status.js:1407)"
    result: 이관 반영 + 변경 이력 버전 적재 + '예산 이관 내역이 저장되었습니다.' 토스트
  - id: btn-temp-save
    label: 임시저장 / 결재 상신 →
    type: button
    area: 계정별 작성 스테이지 상단
    event: onclick
    front:
      handler: "임시저장 / goBudgetSetupStage('approval')"
      file: budget-status-4.js
    result: 작성 임시저장 또는 결재 스테이지 이동
  - id: btn-approval-request
    label: 결재요청
    type: button
    area: 결재 스테이지
    event: onclick
    front:
      handler: "requestExecBudgetApprovalFinal"
      file: "budget-status-4.js:1443~1451"
      validation: "'작성중' 상태 버전만 결재요청 가능 → 상신 시 상태 '승인요청'/'결재중' 전환"
    result: 결재 상신
  - id: btn-cost-guide
    label: AI PMO Cost 재산정 안내
    type: button
    area: 이관 테이블
    event: onclick
    front: { handler: "showBudgetCostGuide", file: "budget-status-3.js:2275" }
    result: "총액 자체 변경은 이 화면 불가 — Cost 재산정으로 안내(이관은 총액 내에서만)"


  # ── [2026.10.12] 예산관리 Agent ON · 계정 상세(5대 계정 공통) — 양옆 칸 접기/펼치기 ──
  - id: btn-agent-detail-chat-fold
    label: "접기 ›(Agent와 대화하기)"
    type: button
    crud: N
    area: "계정 상세 화면 · Agent와 대화하기 칸 머리 우측"
    event: onclick
    front:
      handler: agentGaChatFoldSetFinal(true)
      file: "budget-agent-console.js:3311 (그리드 조합 renderAgentGaViewFinal:3423)"
      logic: "대화하기 칸을 빼고 계정 상세를 넓힌다. 계정 상세에 들어갔을 때만 버튼이 보인다(첫 화면은 그대로). 메인에서 계정 상세로 들어가면 기본으로 접혀 있다(agentAiSheetOpenFinal:4364)"
      validation: null
      state_writes: [agentGaChatFoldFinal]
    backend: null
    result: 대화하기 접힘 · 상세 머리 우측에 [💬 대화] 버튼 표시

  - id: btn-agent-detail-chat-open
    label: "💬 대화"
    type: button
    crud: N
    area: "계정 상세 칸 머리 우측(대화하기를 접었을 때만)"
    event: onclick
    front:
      handler: agentGaChatFoldSetFinal(false)
      file: "budget-agent-console.js:3311"
      logic: "대화하기 칸을 다시 열고 최신 대화로 스크롤(agentChatSeenFinal 초기화)"
      validation: null
      state_writes: [agentGaChatFoldFinal, agentChatSeenFinal]
    backend: null
    result: 대화하기 펼침

  - id: btn-agent-detail-todo-open
    label: "› 예산 조정안 (검토 대기 건수 배지)"
    type: button
    crud: N
    area: "계정 상세 칸 머리 좌측(예산 조정안이 접혀 있을 때)"
    event: onclick
    front:
      handler: agentGaTodoOpenSetFinal(true)
      file: "budget-agent-console.js:3316 (건수 agentGaPendingCntFinal)"
      logic: >
        계정 상세 왼쪽에 예산 조정안(renderAgentGaTodoFinal)을 그대로 펼친다(메인에서 들어오면 기본 접힘, 계정끼리 옮길 때는 상태 유지).
        펼친 상태에서 [반영]·[전부 반영]·[기안]을 누르면 옆 계정 상세 표가 바로 바뀐다. 직책자는 '결재할 일'로 표기.
      validation: null
      state_writes: [agentGaTodoOpenFinal]
    backend: null
    result: "조정안 | 계정 상세 | 대화하기 3칸(대화 접힘 시 2칸)"

  - id: btn-agent-detail-todo-fold
    label: "‹ 접기(예산 조정안)"
    type: button
    crud: N
    area: "계정 상세 화면 · 예산 조정안 칸 머리 우측"
    event: onclick
    front:
      handler: agentGaTodoOpenSetFinal(false)
      file: "budget-agent-console.js:3316"
      logic: 예산 조정안 칸을 접는다. 계정을 바꿔도 접기/펼치기 상태는 유지된다
      validation: null
      state_writes: [agentGaTodoOpenFinal]
    backend: null
    result: 예산 조정안 접힘


  # ── [2026.10.12] 계정 상세 진입 표시 — 첫 화면(조정안+대화)과 구분 ──
  #   경로 줄을 따로 두던 안은 상세 머리와 내용이 겹치고 표 높이를 잡아먹어, 상세 칸 머리로 합쳤다.
  - id: btn-agent-detail-home
    label: "← 프로젝트 메인"
    type: button
    crud: N
    area: "계정 상세 칸 머리 좌측(예산 조정안 펼치기 버튼 다음)"
    event: onclick
    front:
      handler: "agentAiSheetOpenFinal('')"
      file: "budget-agent-console.js:3350"
      logic: >
        계정 상세를 닫고 프로젝트 메인(예산 조정안 + Agent와 대화하기)으로 돌아간다.
        상세 칸은 계정색(AGENT_ACCT_TONE_FINAL) 테두리·머리 배경·제목으로 칠하고, 상단 계정 칩은 보고 있는 계정만
        계정색으로 채워 '상세 보는 중' 배지를 붙이며 나머지는 흐리게 표시한다(칩 툴팁: 다른 계정 이동 / 다시 누르면 메인).
      validation: null
      state_writes: [agentAiSheetFinal]
    backend: null
    result: 프로젝트 메인 화면


  - id: btn-agent-detail-monthly
    label: 월별 계획/실적 보기
    type: button
    crud: R
    area: "계정 상세 칸 머리 우측(5개 계정 공통 · [💬 대화] 버튼 앞)"
    event: onclick
    front:
      handler: "agentAcctMonthlySetFinal(acct)"
      file: "budget-agent-console.js:2128 (팝업 renderAgentAcctMonthlyPopFinal:2136)"
      logic: >
        계정별 기존 예산내역 표(renderAccountMonthlyBudgetTable)를 팝업으로 연다 — 상세계정 × 계획(전체) · 실적(확정) ·
        계획(미집행) · 월별 금액. 인건비 · 외주비처럼 합계 1줄로 접히는 표는 펼친 상태로 연다. 화면에는 기본 노출하지 않는다.
      validation: null
      state_writes: [agentAcctMonthlyFinal, laborBudgetTreeOpenFinal, outsourceBudgetTreeOpenV3]
    backend: null
    result: "{계정} 월별 계획 / 실적 팝업"

# ── 비즈니스 로직 & 규칙 ──
rules:
  transfer_total_invariant: "이관 저장은 총액 불변 — 조정배분 합계 = 총액(plan 합)"
  transfer_lower_bound: "각 계정 조정배분 ≥ 실집행(actual)+투입확정(quasi)"
  adjusted_formula: "조정배분 = 초기배분(plan) + transfer (getBudgetAdjusted budget-status.js:1319)"
  transfer_apply: "data.transfer[acct] = newAdjusted − plan[acct] (budget-status.js:2343/2353)"
  version_on_save: "이관 저장 성공 시에만 budgetTransferHistory에 새 버전 unshift(변경 이력은 이관 저장의 부산물)"
  approval_rule: "작성중 버전만 결재요청 가능(requestExecBudgetApprovalFinal budget-status-4.js:1443)"
  version_snapshot: "버전 스냅샷은 plan 대비 비율로 월별 재분배(applyExecBudgetVersionSnapshotFinal budget-status-4.js:1407)"
  persistence: "이관 상태는 localStorage['budgetTransferState']에 저장/복원(persist/restoreBudgetTransferState budget-status.js:1407/1415)"


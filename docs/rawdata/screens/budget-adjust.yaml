# ── 대표 플로우 ──
flows:
  - name: 계정 편집 + 예산 이관 + 결재
    steps:
      - "'원가조정' 메뉴 → #/budget-adjust → 목록 (딥링크 ?pj= 또는 /labor 등 계정 슬러그 바로 진입 가능)"
      - "프로젝트 선택 → openBudgetProjectScreen(k) → 계정별 작성(edit) 스테퍼 진입"
      - "계정 타일 클릭 → 계정별 편집기에서 상세 계획 수정 → 임시저장"
      - "예산 집행 현황 테이블 '예산 이관 수정' → 조정배분 입력 → 저장 → (총액 일치·하한·경비한도·ERP가용성 통과 시) 새 버전 적재"
      - "스테퍼 '결재' → 버전 diff 확인 → 결재요청(작성중 버전만) → 상태 승인요청/결재중"
      - "총액 변경 필요 시 AI PMO Cost 재산정 안내로 이탈"


    area: "예산 조정안 칸 카드 목록 머리(원래 '검토 대기 N · 반영 N' 숫자 자리)"
    event: onclick
    front:
      handler: "bapTodoFilterSet('all'|'wait'|'on')"
      file: "budget-adjust-panel.js:bapTodoFilterSet · renderAgentGaTodoFinal(데코레이터 — 원래 budget-agent-console.js:renderAgentGaTodoFinal)"
      logic: >
        카드를 상태별로 조회한다. 전체 = 모든 카드(기본), 검토 대기 = 아직 [반영] 안 한 카드, 반영 = [반영]한 카드(.agga-card.on).
        탭마다 건수를 붙이고, 고른 탭에 해당 카드가 없으면 '반영한 조정안이 없습니다.' / '검토 대기 중인 조정안이 없습니다.' 안내.
        [전부 반영] · [전부 해제] · [기안 →]은 탭과 관계없이 전체 기준으로 그대로 동작한다. 고른 탭은 화면을 다시 그려도 유지된다
      validation: null
      state_writes: [bapTodoFilter]
    backend: null
    result: "고른 상태의 조정안 카드만 표시"

  # [2026.11.12] 계정 상세 맨 위 "예산 조정안 반영 내역"(panel-acct-applied · 수정/저장/취소) 제거 — budget-adjust-panel.js:renderAgentAcctAppliedFinal 이 빈 칸을 돌려줌

  - id: chat-cp-gap
    label: "지금 CP 여유 얼마야? (대화 · 추천 칩)"
    type: input(chat) + chip
    crud: R
    area: "Agent와 대화하기 입력창 · 추천 칩"
    event: onclick / Enter
    front:
      handler: "agentChatSendFinal() → agentSimReadFinal(q) kind='cpgap' → agentCpGapSayFinal()"
      file: "budget-agent-console.js:4305 (계산 agentCpGapFinal:4654, 표 renderAgentCpGapFinal:4696)"
      logic: >
        CP총액(roll.cp) 기준 GAP을 세 단계로 답하고 답변 아래 표를 붙인다 —
        ① 최종 승인 실행예산(roll.plan, 결재 전 수기 입력 제외) ② [반영]해 둔 조정안이 승인됐을 때
        ③ 조정안을 모두 반영했을 때(택1 묶음은 고른 안, 없으면 1안). 금액이 들어 있거나 계정명만 있는 '여유' 질문은 해당하지 않는다
      validation: "CP총액을 못 찾으면 버전 선택 안내"
      state_writes: [AGENT_CHAT_FINAL]
    backend: null
    result: "CP총액 · 단계별 실행예산 · GAP(여유/초과) 답변"

# ── 비즈니스 로직 & 규칙 ──
rules:
  transfer_total_invariant: "이관 저장은 총액 불변 — 조정배분 합계 = 총액(plan 합)"
  transfer_lower_bound: "각 계정 조정배분 ≥ 실집행(actual)+투입확정(quasi)"
  adjusted_formula: "조정배분 = 초기배분(plan) + transfer (getBudgetAdjusted budget-status.js:1319)"
  transfer_apply: "data.transfer[acct] = newAdjusted − plan[acct] (budget-status.js:2343/2353)"
  version_on_save: "이관 저장 성공 시에만 budgetTransferHistory에 새 버전 unshift(변경 이력은 이관 저장의 부산물)"
  approval_rule: "작성중 버전만 결재요청 가능(requestExecBudgetApprovalFinal budget-status-4.js:1443)"
  version_snapshot: "버전 스냅샷은 plan 대비 비율로 월별 재분배(applyExecBudgetVersionSnapshotFinal budget-status-4.js:1407)"
  persistence: "이관 상태는 localStorage['budgetTransferState']에 저장/복원(persist/restoreBudgetTransferState budget-status.js:1407/1415)"


# rawdata: 관리자 > 구성원 조회 (스토리보드/SRS/버튼로직 생성용 원천 데이터)
# 스키마 규약: 영문 key(안정적 파싱) + 한국어 value. 로직은 file:function 근거 인용.
# [2026.11.27 남주] AS-IS 관리자(base-front) 화면을 옮긴 메뉴. 공통 코드는 public/js/admin-asis.js

screen:
  id: s-admin-member
  name: 구성원 조회
  menu_path: "관리자 > 사용자 관리 > [구성원 조회] 탭"
  route: "/admin.html#user (옛 주소 #member 로 와도 이 탭으로 열림)"
  entry: "adminGo('user') → amgTab('user', 탭) → admSectionBody → amgBody → AAS_RENDER.member"
  data_source: "HR 인사 마스터 연동 (조회 전용)"
  asis_source: "base-front src/views/admin/member/MemberManagement.vue"
  source_files:
    - public/js/admin-asis.js   # 메뉴 등록(ADMIN_SECTIONS) · admSectionBody 데코레이터 · 렌더 · 핸들러 · 목업 데이터(AAS_DEF) · 전용 CSS(.aas-*)
    - public/js/admin-menu-group.js # 메뉴 11개 묶음 · 묶음 안 탭(amgTab) · 옛 주소 연결
    - public/js/admin.js        # 관리자 사이트 셸 · admModal · admToast — 수정하지 않음
    - public/admin.html         # admin-asis.js 로드(admin-approval.js 다음)
  purpose: >
    조직별 구성원(이름 · 사번 · 직위 · 직책 · 부서)을 찾아본다. 사용자 그룹 멤버 추가 · IP 소유자 확인 등에서 사람을 찾을 때의 기준 목록.
  asis_diff: "AS-IS 의 그리드 행추가 · 바로 입력 · 행삭제 후 [저장] 방식을 목업 공통 방식(등록/수정 팝업 · 행별 삭제 확인)으로 바꿈. 페이지 이동(페이징)은 목업 건수가 적어 뺌"

elements:
  - { id: rdo-member-type, label: "조회 구분 (이름 / 사번)", type: radio, crud: N, area: "조회 조건", event: onclick,
      front: { handler: "aasSetDraft('member','_type',필드)", file: "admin-asis.js:aasSetDraft", logic: "조회할 칸 선택(AS-IS 라디오와 같음). [조회]를 눌러야 적용" }, backend: null, result: "조회 조건 입력값" }
  - { id: inp-member-q, label: "검색어", type: input, crud: R, area: "조회 조건", event: onclick,
      front: { handler: "aasSetDraft('member','_q',값) · Enter=aasSearch('member')", file: "admin-asis.js:aasSetDraft", logic: "고른 칸에 검색어가 들어간 줄만 찾음(대소문자 무시)" }, backend: null, result: "조회 조건 입력값" }
  - { id: btn-member-reset, label: "초기화", type: button, crud: N, area: "조회 조건", event: onclick,
      front: { handler: "aasReset('member')", file: "admin-asis.js:aasReset", logic: "조회 조건 · 선택 줄을 비우고 다시 그림" }, backend: null, result: "전체 목록" }
  - { id: btn-member-search, label: "조회", type: button, crud: R, area: "조회 조건", event: onclick,
      front: { handler: "aasSearch('member')", file: "admin-asis.js:aasSearch", logic: "입력한 조건을 적용(aasApplied)해 표를 다시 그림" }, backend: null, result: "검색결과 N건 / 총 M건" }
  - { id: tree-member-org, label: "조직 목록 (전체 · 본부 · 팀, 인원 수)", type: tree, crud: R, area: "왼쪽 조직 패널", event: onclick,
      front: { handler: "aasMemberOrgPick(조직명)", file: "admin-asis.js:aasMemberOrgPick", logic: "본부를 누르면 아래 팀 인원까지, 팀을 누르면 그 팀만(aasMemberInOrg)" }, backend: null, result: "오른쪽 표 필터" }
  - { id: grid-member, label: "목록 표 (No · 이름 · 사번 · 직위 · 직책 · 부서)", type: grid, crud: R, area: "오른쪽 표", event: onclick,
      front: { handler: "aasTableHtml('member')", file: "admin-asis.js:aasTableHtml", logic: "조회 조건에 맞는 줄. 검색결과 건수 / 총 건수 표시. 조회 전용 — 등록/수정/삭제 없음" }, backend: null, result: "목록" }

requirements:
  - { id: FR-MEM-01, text: "사용자는 이름 또는 사번으로 구성원을 조회할 수 있어야 한다" }
  - { id: FR-MEM-02, text: "사용자는 왼쪽 조직(본부 · 팀)을 눌러 그 조직의 구성원만 볼 수 있어야 하며, 본부를 고르면 아래 팀 구성원까지 보여야 한다" }
  - { id: FR-MEM-03, text: "조직 목록에는 조직별 인원 수가 보여야 한다" }
  - { id: FR-MEM-04, text: "목록은 이름 · 사번 · 직위 · 직책 · 부서를 보여야 하며 검색결과 건수와 총 건수를 함께 보여야 한다" }
  - { id: FR-MEM-05, text: "구성원 정보는 HR 인사 마스터에서 받은 값으로 조회만 가능해야 한다(등록 · 수정 · 삭제 없음)" }

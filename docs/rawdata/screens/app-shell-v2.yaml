# ── 요구사항 ──
requirements:
  - { id: FR-SHELL-01, text: "버전2 는 메뉴를 드러내지 않아야 하며, 사용자는 AI 에이전트 질의·응답과 담당 프로젝트 항목 클릭으로 화면을 이동할 수 있어야 한다" }
  - { id: FR-SHELL-02, text: "개발 테스트를 위해 레일의 버튼으로 숨겨진 상단 메뉴 바를 보이거나 숨길 수 있어야 하고, 그 선택은 유지되어야 한다" }
  - { id: FR-SHELL-03, text: "버전2 에서는 상단 메뉴 바 없이 화면 설명·그라운드 룰·AI 네비게이터·AI개발 Agent·구매시스템 참고·사용자 전환을 레일 하단에서 제공해야 한다" }
  - { id: FR-SHELL-04, text: "상세 화면에 들어가거나 다른 프로젝트로 넘어가면 레일이 자동으로 축소되어야 하고, 메인으로 돌아오면 메인에서 고른 상태로 돌아와야 한다" }
  - { id: FR-SHELL-05, text: "사용자는 어느 화면에서든 버전1과 버전2를 전환할 수 있어야 하며, 저장된 선택이 없으면 버전2로 열려야 한다" }
  - { id: FR-SHELL-06, text: "버전1 로 전환하면 모든 화면이 기존 구성·스타일 그대로 보여야 한다" }
  - { id: FR-SHELL-07, text: "버전2 의 수행원가 상세 화면은 예산관리 Agent ON 을 기준으로 열려야 하며, 조정안 시뮬레이션 → 기안·결재 → 확정 흐름은 버전1 과 같아야 하며, 메인에서 나눈 대화가 그 화면의 Agent 대화 하나로 이어지고, 그 입력창에서 화면 이동·이상징후·할 일도 물을 수 있어야 한다" }
  - { id: FR-SHELL-08, text: "목록 화면의 검색 패널·주요 버튼·건수·표는 선행 시스템(AiPMO)과 같은 형태로 보여야 하되 기존 기능과 버튼은 모두 유지되어야 한다" }
  - { id: FR-SHELL-09, text: "AI 대화창과 AI 레포트는 선행 시스템(Talent AX)과 같은 대화 형태(말풍선·구슬 아이콘·보라 테두리 입력창·면책 문구)로 보여야 한다" }
  - { id: FR-SHELL-10, text: "표가 화면 폭보다 넓으면 버튼이 잘리지 않고 표 안에서 가로로 스크롤되어야 한다" }


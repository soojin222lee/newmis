# ── 요구사항 후보(FR) ── (인건비.md §11 재사용·정리)
requirements:
  - { id: FR-LAB-01, text: "인건비 계정 편집기는 #/budget-adjust/labor?pj=<프로젝트키> 딥링크로 진입(pj 미지정 시 기본 프로젝트)" }
  - { id: FR-LAB-02, text: "예산내역 표는 '인건비' 부모합계행 1줄을 기본 노출하고, 토글로 실투입/이관/OT 3개 상세계정 행을 펼치고 접을 수 있어야 한다" }
  - { id: FR-LAB-03, text: "부모행 계획/실적/잔여/월별 값은 상세 3계정의 합계여야 한다" }
  - { id: FR-LAB-04, text: "상세계정은 실투입·이관·OT 3탭으로 구분되고 탭 선택에 따라 전용 패널을 표시해야 한다" }
  - { id: FR-LAB-05, text: "실투입인건비 계획은 SCM에서 확정완료된 인력만 선택·등록할 수 있어야 한다(자유 입력 불가)" }
  - { id: FR-LAB-06, text: "SCM 확정 인력 등록 시 시작/종료일·총MM 수신값으로 월별 MM과 금액을 자동 배분해야 한다" }
  - { id: FR-LAB-07, text: "동일 SCM 문서번호(scmNo) 인력은 중복 등록을 차단해야 한다" }
  - { id: FR-LAB-08, text: "SCM 확정완료(done) 상태 인력만 월별 예산의 투입확정(q) 금액으로 반영해야 한다" }
  - { id: FR-LAB-09, text: "인건비 계획 금액은 해당 월 투입확정 금액보다 작게 저장할 수 없어야 한다(저장 거부 + 안내)" }
  - { id: FR-LAB-10, text: "이관인건비 신규 계획은 Receiver Project만 등록 가능하고 금액은 양수로 정규화되어야 한다" }
  - { id: FR-LAB-11, text: "Sender Project/집행완료/actualized 이관 건은 조회 전용이며 수정할 수 없어야 한다" }
  - { id: FR-LAB-12, text: "이관인건비 요약은 건수·받은(+)·보낸(−)·순 이관금액을 구분 표시하고, 순액을 예산내역 이관인건비 행에 반영해야 한다" }
  - { id: FR-LAB-13, text: "OT비는 월별 계획금액을 직접 키인해 저장하고 예산내역 OT비 행에 반영해야 한다(계정 701301 단일 사용)" }
  - { id: FR-LAB-14, text: "SCM I/F로 확정 수신된 미등록 인력이 있을 때 알림과 [확정 인력 등록] 진입을 제공해야 한다" }
  - { id: FR-LAB-15, text: "계획 없이 OT 정산 실적이 선발생한 경우 경고 알림과 OT비 계획 보정 진입을 제공해야 한다" }
  - { id: FR-LAB-16, text: "P레벨 단가 확정으로 인한 예산 초과 가능성을 위험 알림으로 안내해야 한다(인력·MM 변동 없어도 초과 가능)" }
  - { id: FR-LAB-17, text: "등록된 인력 배정 상태는 localStorage에 영속화하고 재진입 시 복원해야 한다" }
  - { id: FR-LAB-18, text: "각 알림에 대해 AI 해설(원인/영향/조치)을 요청·표시할 수 있어야 하며, API 키는 서버에만 보관해야 한다" }
  - { id: FR-LAB-19, text: "Agent 화면의 실투입인건비는 SCM이 선행되어야 하며, 화면에서 인력을 직접 등록할 수 없어야 한다(SCM 수신분은 [예산 조정안] Agent 제안으로 올라와야 한다)" }
  - { id: FR-LAB-20, text: "PM이 [예산 조정안]에서 인건비 제안을 [반영]하면 실투입인건비 인력표에 '반영(결재전)'으로 신규·철수 변동이 표시되어야 한다" }
  - { id: FR-LAB-21, text: "Agent 화면에서 이관인건비와 OT비를 건 단위로 등록·수정·삭제할 수 있어야 하며, 결과가 인건비 상세 금액에 즉시 반영되어야 한다" }
  - { id: FR-LAB-22, text: "직책자 화면과 과거 확정 버전 조회 중에는 이관인건비·OT비를 열람만 할 수 있어야 한다" }
  - { id: FR-LAB-23, text: "이관인건비 계획은 '받을 인건비(+)'와 '보낼 인건비(−)' 두 구분으로 수립할 수 있어야 하며, 실제로 받거나 보낸 실적은 계획과 따로 표시되어야 한다(실적이 생긴 건은 조회 전용)" }
  - { id: FR-LAB-24, text: "인건비 월별 계획/실적은 화면에 기본 노출하지 않고 [월별 계획/실적 보기] 팝업으로 상세 3계정별 계획·실적·미집행과 월별 금액을 제공해야 한다" }

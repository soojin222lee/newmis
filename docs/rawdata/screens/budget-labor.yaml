  - id: btn-agent-labor-sub-update
    label: 수정 저장
    type: button
    crud: U
    area: "이관인건비/OT비 수정 팝업 하단"
    event: onclick
    front:
      handler: agentLabEditSaveFinal()
      file: "budget-agent-console.js:2076"
      logic: "수정 중인 건(agentLabEditFinal.id)에 월·금액·내용을 덮어쓴다. 처리 규칙은 아래 [등록]과 같다"
      validation: "월 미선택·금액 0·내용 공란이면 저장 거부 + 토스트, 잠긴 이관 건은 수정 불가"
      state_writes: ["laborTransferRowsByProjectFinal[proj]", "AGENT_LABOR_OT_FINAL[proj]", agentLabEditFinal]
    backend: null
    result: 표·탭 금액·인건비 합계 갱신 + 토스트

  - id: btn-agent-labor-sub-save
    label: 등록
    type: button
    crud: C
    area: 이관인건비/OT비 등록 팝업 하단
    event: onclick
    front:
      handler: agentLabEditSaveFinal()
      file: "budget-agent-console.js:2076"
      logic: >
        이관인건비는 공유 목업 getLaborTransferRowsFinal()에 추가/수정 — 받을 인건비=Receiver Project(+금액),
        보낼 인건비=Sender Project(−금액). 입력은 양수로 받고 구분에 따라 부호를 붙인다(AGENT_LAB_TR_KIND_FINAL).
        OT비는 Agent 화면 전용 목록 agentLaborOtRowsFinal()에 {month, amount, memo} 추가/수정 → 재렌더.
        인건비 상세 금액(getMonthlyBudgetRows 재정의:9126 부근)이 등록 내역 합계라 탭 금액·상단 LIVE 바가 함께 바뀐다.
      validation: "월 미선택·금액 0·내용 공란이면 저장 거부 + 토스트, 잠긴 이관 건은 수정 불가"
      state_writes: ["laborTransferRowsByProjectFinal[proj]", "AGENT_LABOR_OT_FINAL[proj]", agentLabEditFinal]
    backend: null
    result: 표·탭 금액·인건비 합계 갱신 + 토스트

  - id: btn-agent-labor-sub-delete
    label: 삭제
    type: button
    crud: D
    area: "이관인건비/OT비 표 관리 열"
    event: onclick
    front:
      handler: "agentLabDeleteFinal(kind, id)"
      file: "budget-agent-console.js:2103"
      logic: "confirm 확인 후 목록에서 제거 → 재렌더"
      validation: "실적이 생긴(집행완료·actualized) 이관 건은 삭제 불가 토스트"
      state_writes: ["laborTransferRowsByProjectFinal[proj]", "AGENT_LABOR_OT_FINAL[proj]"]
    backend: null
    result: 표·탭 금액·인건비 합계 감소 + 토스트

  - id: btn-agent-labor-sub-close
    label: 닫음
    type: button
    crud: N
    area: "등록·수정 팝업 하단 / 우상단 ✕ / 바깥 영역"
    event: onclick

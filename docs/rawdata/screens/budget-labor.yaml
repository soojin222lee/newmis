      logic: "switchLaborKindFinal('ot') — 계획 없이 실적 선발생한 OT 보정 유도"
      validation: null
      state_writes: [laborKindFinal]
    backend: null
    result: OT비 월별 계획 그리드로 전환

  - id: btn-ai-explain
    label: "AI 해설 (알림별)"
    type: button(toggle)
    area: 계정 시그널 알림(각 알림 우측)
    event: onclick
    front:
      handler: "budgetAiExplainV1(slotId, payload)"
      file: "laborAiBlockFinal budget-area-labor.js:157 → budgetAiExplainV1 budget-area-outsource.js:254"
      logic: >
        slot.dataset.open 토글; 열림 시 캐시(budgetAiCacheV1) 확인 후 없으면 POST /api/ai/explain,
        {kind,title,summary,facts} 전송 → 원인/영향/조치 3줄 렌더. 재클릭 시 접힘.
      validation: null
      state_writes: [budgetAiCacheV1, "slot.dataset.open(DOM)"]
    backend: { calls: api-ai-explain }
    result: 알림 하단에 AI 해설 블록(source ai|fallback)

  - id: btn-scm-register-confirmed
    label: 확정 인력 등록
    type: button
    area: 실투입 패널 요약 설명칸 우측
    event: onclick
    front:
      handler: openLaborScmCandidatePopupFinal()
      file: "budget-area-labor.js:420(문구 교체 삽입) → budget-status-4.js:984"
      logic: "'투입가능 인력 리스트' 팝업 오픈(SCM 확정완료 풀 laborScmConfirmedPoolFinal 표시)"
      validation: null
      state_writes: ["팝업 오픈 상태"]
    backend: { note: "풀은 SCM I/F 수신값(목업 laborScmConfirmedPoolFinal, budget-status-4.js:962)" }
    result: SCM 확정 인력 선택 팝업

  - id: scm-popup-select-register
    label: "SCM 인력 선택(radio) + 등록"
    type: [radio, button]
    area: SCM 확정 인력 팝업
    event: onclick
    front:
      handler: "selectLaborScmCandidateFinal(id) → registerSelectedScmLaborFinal()"
      file: "budget-status-4.js:995 / 1000 / 팝업 렌더 1099"
      logic: >
        선택 인력의 SCM 수신값(시작/종료일·총MM)으로 buildScmLaborMonthlyMmFinal(970)이 월별 MM 자동 배분·금액 산출 →
        rows(budgetLaborAssignments) unshift → persistBudgetLaborState → syncLaborAssignmentsToBudget → 토스트.
      validation: "scmNo 기준 이미 등록된 인력은 팝업에서 disabled+'등록완료'(1101,1118,1125) → 중복 등록 차단(1007-1012)"
      state_writes: [budgetLaborAssignments, "month[laborCat].q(투입확정)", localStorage.budgetLaborState]
    backend: null
    result: 실투입인건비 계획 rows 등록 + 예산내역 투입확정(q) 갱신

  # ── [2026.10.12] Agent 콘솔(예산관리 Agent ON) 인건비 상세 ──
  #   실투입인건비는 SCM 선행: 화면에서 인력을 직접 등록하는 버튼이 없다.
  #   SCM I/F 수신 → [예산 조정안] Agent 제안(ap-01 등) → PM [반영] → 인력표에 "반영(결재전)" 표시.
  - id: cell-agent-labor-reflected
    label: "인력표 상태열 '반영(결재전)' 배지"
    type: badge
    crud: R
    area: "Agent 콘솔 인건비 상세 · 실투입인건비 탭 인력표 상태열"
    event: null
    front:
      handler: "renderAgentLaborDetailFinal() 내부 st(r)"
      file: "budget-agent-console.js:2292 (행 구성 agentLaborRowsFinal:2204)"
      logic: >
        [예산 조정안]에서 PM이 [반영]한(agentMiniSelFinal) 인건비 제안의 persons는 신규 행, leaves는 기존 행 철수로 얹고
        상태열에 '반영(결재전)' + 아래 줄 '신규 +MM +금액' / '철수 −MM −금액'을 표시. 반영 해제·기안 상신 시 사라진다.
      validation: null
      state_writes: []
    backend: { note: "제안 원천은 SCM 투입계획 확정/변경 I/F(목업 AGENT_PROPOSALS_FINAL)" }
    result: 결재 전 반영분이 인력표·합계·간트에 함께 보임

  - id: btn-agent-labor-sub-add
    label: "＋ 이관인건비 등록 / ＋ OT비 등록"
    type: button
    crud: N
    area: "Agent 콘솔 인건비 상세 · 이관인건비/OT비 탭 표 상단 우측"
    event: onclick
    front:
      handler: "agentLabEditOpenFinal('transfer'|'ot', '')"
      file: "budget-agent-console.js:2063 (팝업 렌더 renderAgentLabEditPopFinal:2150)"
      logic: "신규 입력 팝업 오픈. 직책자 화면·과거 확정 버전 조회 중에는 버튼과 관리 열을 숨긴다(열람 전용)"
      validation: null
      state_writes: [agentLabEditFinal]
    backend: null
    result: 등록 팝업

  - id: btn-agent-labor-sub-edit
    label: 수정
    type: button
    crud: N
    area: "이관인건비/OT비 표 관리 열"
    event: onclick
    front:
      handler: "agentLabEditOpenFinal(kind, id)"
      file: "budget-agent-console.js:2063"
      logic: "해당 건 값을 채운 수정 팝업 오픈(금액은 양수로 표시). 실적이 생긴(집행완료·actualized) 이관 건은 버튼 대신 '조회 전용' 표시"
      validation: "잠긴 건이면 '실적(집행완료)이 생긴 이관 건은 조회만 가능합니다.' 토스트"
      state_writes: [agentLabEditFinal]
    backend: null
    result: 수정 팝업

  - id: frm-agent-labor-sub
    label: "입력 팝업 — 이관 구분(받을 인건비/보낼 인건비, 이관만) · 발생 예정월/대상 월 · 금액(원) · 내용"
    type: [input, select]
    crud: N
    area: 이관인건비/OT비 등록·수정 팝업
    event: null
    front:
      handler: renderAgentLabEditPopFinal(viewData)
      file: "budget-agent-console.js:2150"
      logic: "월 선택지는 프로젝트 기간 월(viewData.months). 입력 id: aglb-ed-type(이관만) / aglb-ed-month / aglb-ed-amount / aglb-ed-desc"
      validation: null
      state_writes: []
    backend: null

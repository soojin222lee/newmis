      - "'투입가능 인력 리스트' 팝업 radio 선택 → [등록] → registerSelectedScmLaborFinal"
      - "월별 MM 자동 배분·금액 산출 → rows unshift → persist → syncLaborAssignmentsToBudget"
      - "예산내역 부모/실투입 자식행, 월별 투입확정(q) 갱신"
  - name: 이관인건비 계획 등록(Receiver)
    steps:
      - "[이관인건비] 탭 → switchLaborKindFinal('transfer')"
      - "[신규등록] → Receiver Project 폼(이관예정월·금액·사유) → [등록]"
      - "saveLaborTransferFinal: 금액 양수화·Receiver 정규화 → 요약(받은/보낸/순) 갱신"
  - name: OT비 계획 보정(미계획 실적 대응)
    steps:
      - "알림 'OT비 실적 발생' → [OT비 계획 열기] → laborGoKindFinal('ot')"
      - "월별 그리드 계획금액 키인 → [계획 저장] → saveLaborOtPlanFinal → OT비 행 반영"
  - name: 계획 조정 검증
    steps:

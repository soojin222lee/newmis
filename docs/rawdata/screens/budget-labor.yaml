# ── 비즈니스 로직 & 규칙 ──
business:
  - id: BL-LAB-derive
    rule: "인건비 월별 예산을 상세 3계정으로 분해(getMonthlyBudgetRows override, budget-status-4.js:2003-2019)"
    detail: "실투입 월액 = max(월예산 − 이관월액 − OT월액, 0). 이관월액=getLaborTransferAmountForMonthFinal, OT월액=getLaborOtAmountForMonthFinal. 실적도 이관/OT 실적 공제 후 잔여가 실투입 실적."
  - id: BL-LAB-sync
    rule: "SCM 확정완료 인력만 투입확정(q)로 반영(syncLaborAssignmentsToBudget, budget-status-4.js:1062-1090)"
    detail: "laborStatusClass(status)==='done'('확정완료'/'승인완료')인 인력만 대상; rowAmount=round(mm×unitPrice)를 month[laborCat].q에 기록, details에 type:'투입확정',source:'laborAssignment' 추가."
  - id: BL-LAB-mm-split
    rule: "월별 MM 자동 배분(buildScmLaborMonthlyMmFinal, budget-status-4.js:970-982)"
    detail: "총MM을 투입기간 월수로 균등분할(base=floor(total/months×100)/100), 마지막 달에 잔차 몰아넣기."
  - id: BL-LAB-transfer-net
    rule: "순 이관금액 = 이관받은(+) − 이관보낸(−) (getLaborTransferSummaryFinal, budget-area-labor.js:241-246)"
    detail: "받은 금액은 인건비 실적 반영, 보낸 금액은 원가실적 차감. 순액이 예산내역 이관인건비 행에 반영."
  - id: BL-LAB-ot-single
    rule: "OT 계정은 701301 한 줄만 사용(getLaborOtRowsFinal override, budget-area-labor.js:301-305)"
    detail: "공유 목업의 701302(월별 OT 계획) 행은 필터 제외."

validation:
  - id: VAL-LAB-plan-floor
    where: "saveSimpleAccountPlan (budget-status-3.js:1695-1697, 2784)"
    rule: "월별 계획 금액은 해당 월 투입확정(q)보다 작을 수 없음 → 위반 시 저장 거부·안내"
  - id: VAL-LAB-scm-dup
    where: "registerSelectedScmLaborFinal / 팝업 (budget-status-4.js:1007-1012, 1101)"
    rule: "동일 scmNo 인력 중복 등록 차단(팝업 disabled+'등록완료')"
  - id: VAL-LAB-scm-done-only
    where: "syncLaborAssignmentsToBudget (budget-status-4.js:1066)"
    rule: "SCM 확정완료(done) 상태 인력만 투입확정(q)로 반영"
  - id: VAL-LAB-transfer-receiver
    where: "saveLaborTransferFinal (budget-status-4.js:1845-1862)"
    rule: "신규 이관은 Receiver Project만; 금액 양수화; Sender/actualized/집행완료 수정 불가; 금액 미입력 거부"

# ── 백엔드 API / 외부 연동 상세 ──
apis:
  - id: api-ai-explain
    path: /api/ai/explain
    method: POST
    handler: "ai-proxy.js (POST /api/ai/explain)"
    request: { kind: string, title: string, summary: string, facts: object }
    pipeline:
      - "kind별 규칙 기반 기본 해설 매핑(labor-ot / labor-prate / labor-scm 등, ai-proxy.js:69-94)"
      - "OPENAI_API_KEY 있으면 LLM 호출(cause/impact/action JSON), 없으면 로컬 폴백(source:'fallback')"
    response: { ok: boolean, cause: string, impact: string, action: string, source: "ai|fallback", model?, cached? }
    security:
      - "API 키는 서버(.env)만 보유, 브라우저엔 숫자·상황만 전송(budget-area-outsource.js:215)"
  - id: if-scm-inbound
    kind: 외부연동(SCM I/F)
    direction: inbound
    detail: >
      SCM(인력 공급/투입 관리)에서 투입계획이 확정(승인)된 인력이 I/F로 수신되어 확정완료 풀
      laborScmConfirmedPoolFinal(budget-status-4.js:962) 및 알림용 laborSignalsFinal.scmInbox(budget-area-labor.js:140-143)에 적재.
      수신만으로는 예산 미반영 — '확정 인력 등록' 후 투입확정(q) 집계됨. (목업; 실제 데이터는 SCM I/F 수신함)
  - id: if-plevel-rate
    kind: 외부연동(P레벨 단가 마스터)
    detail: "P레벨 단가는 매년 5월경 확정 → 인력·MM 변동 없어도 계획(전년 단가) 대비 초과 가능. 위험 알림 pGradeRate(budget-area-labor.js:137-138,211-230)."
  - id: if-ot-settlement
    kind: 외부연동(OT 정산 실적)
    detail: "계획 없이 OT 정산 실적이 먼저 발생하는 케이스 otUnplanned(budget-area-labor.js:135,193-209) → 경고 후 OT 계획 보정 유도."


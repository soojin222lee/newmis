# rawdata: 원가조정 계정 - 인건비 화면 (스토리보드/SRS/버튼로직 생성용 원천 데이터)
# 스키마 규약: 영문 key(안정적 파싱) + 한국어 value. 로직은 file:function 근거 인용.
# 소비: 이 YAML을 AI가 읽어 스토리보드/요구사항명세서/버튼 인벤토리로 변환.
# 근거: 최종 유효본(가장 나중에 재정의된 override)이 이긴다. budget-area-labor.js 는
#       budget-status-*.js 전부 뒤에 로드되는 데코레이터 체인 소유자.

screen:
  id: s-budget-labor
  name: 원가조정 · 인건비 (수행원가 CATS[0])
  menu_path: 예산관리 > 원가조정 > 인건비
  route: "#/budget-adjust/labor?pj=<프로젝트키>"      # pj 미지정 시 'budgetMock' (budget-area-routes.js:40-41)
  entry: "ROUTE_ACTIONS['budget-adjust/labor'] → openCostArea('인건비', pj) → costMode='adjust' → openBudgetProjectScreen(pj) → openBudgetAccountEditor('인건비')"
  source_files:
    - public/js/budget-area-labor.js     # 최종 소유자: 예산내역 트리·상세탭·알림·이관/OT override·편집기 조립 데코레이터
    - public/js/budget-status-4.js        # 활성 구현: 실투입 패널/SCM 팝업/등록, 이관·OT rows·저장, getMonthlyBudgetRows 분해
    - public/js/budget-status-3.js        # 저장검증 saveSimpleAccountPlan(투입확정 하한), getMonthAccountValue
    - public/js/budget-status.js          # 데이터 모델(budgetLaborAssignments), getLaborRows, CATS/상수, 영속화
    - public/js/budget-area-routes.js     # 슬러그/라우트, openCostArea
    - public/js/budget-area-outsource.js  # budgetAiExplainV1(AI 해설 공용, 먼저 로드)
    - ai-proxy.js                         # POST /api/ai/explain 핸들러
  purpose: >
    원가조정(costMode='adjust') 단계에서 PM이 인건비 계정의 예산내역과 상세계정(실투입/이관/OT) 계획을 편집한다.
    실투입인건비는 SCM I/F로 확정 수신된 인력만 등록·예산화하며, 계획 금액은 투입확정(q) 금액을 하한으로 검증한다.

# ── 화면 상태 ──
states:
  - id: tree-collapsed
    when: "laborBudgetTreeOpenFinal == false (기본, budget-area-labor.js:19)"
    shows: ["인건비 합계 부모행 1줄만(상세 3계정 합계)"]
  - id: tree-expanded
    when: "laborBudgetTreeOpenFinal == true (toggleLaborBudgetTreeFinal)"
    shows: ["부모행 + 실투입/이관/OT 3개 자식행"]
  - id: kind-direct
    when: "laborKindFinal == 'direct' (기본, budget-status-4.js:1728)"
    shows: ["실투입인건비 패널(SCM 확정 인력 등록 목록·요약 4칸)"]
  - id: kind-transfer
    when: "laborKindFinal == 'transfer'"
    shows: ["이관인건비 패널(요약 4칸·리스트·신규등록/수정 폼)"]
  - id: kind-ot
    when: "laborKindFinal == 'ot'"
    shows: ["OT비 월별 계획 그리드(EXPENSE_PLAN_MONTHS 10개월)"]
  - id: scm-popup-open
    when: "openLaborScmCandidatePopupFinal 호출 후 (budget-status-4.js:984)"
    shows: ["'투입가능 인력 리스트' 팝업(SCM 확정완료 풀, 이미 등록건 disabled)"]
  - id: transfer-editor-open
    when: "laborTransferEditorOpenFinal || editingLaborTransferIdFinal (budget-area-labor.js:250-251)"
    shows: ["이관 등록/수정 폼(renderLaborTransferFormFinal)"]
  - id: alerts-visible          # 직교 상태(계정 시그널)
    when: "renderLaborAlertsFinal() 반환값 존재 (budget-area-labor.js:166)"
    shows: ["SCM 확정 수신(info) / OT 실적 선발생(warn) / P레벨 단가 확정(danger) 알림"]
  - id: ai-explain-open         # 직교(토글) 상태
    when: "budget-ai-slot dataset.open == '1' (budget-area-outsource.js:258)"
    effect: 알림 하단에 AI 해설(원인/영향/조치) 블록 노출, 재클릭 시 접힘

# ── 요소(버튼/입력/탭) 인벤토리 ── ★ 버튼 단위 프론트/백엔드 로직

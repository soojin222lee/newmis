  - id: sum-agent-labor-transfer
    label: "이관인건비 요약 — 계획(받을 인건비 · 보낼 인건비 · 순 이관 계획) / 실적(받은 인건비 · 보낸 인건비 · 순 이관 실적)"
    type: summary
    crud: R
    area: "Agent 콘솔 인건비 상세 · 이관인건비 탭 상단"
    event: null
